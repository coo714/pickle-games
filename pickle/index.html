/* ---------------- render ---------------- */
function drawBoom(b) {
  const k = Math.min(1, b.t / b.life);
  const r = (18 + k * (b.big ? 120 : 82)) * b.sc;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - k);
  const g = ctx.createRadialGradient(b.sx, b.sy, 0, b.sx, b.sy, r);
  g.addColorStop(0, 'rgba(255,255,235,0.95)');
  g.addColorStop(0.32, 'rgba(255,205,100,0.8)');
  g.addColorStop(1, 'rgba(255,90,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.sx, b.sy, r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,242,205,' + (0.75 * (1 - k)) + ')';
  ctx.lineWidth = Math.max(1, 6 * b.sc * (1 - k));
  ctx.beginPath(); ctx.arc(b.sx, b.sy, r * 1.18, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawGround();

  ctx.save();
  if (G.shake > 0.2) {
    ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
  }

  drawRoad();
  drawGroundDetail();
  drawRails();
  drawHaze();

  // depth-sorted actors
  const list = [];
  for (let i = 0; i < G.entities.length; i++) if (!G.entities[i].dead) list.push(G.entities[i]);
  for (let i = 0; i < G.gates.length; i++) if (G.gates[i].z > -1) list.push(G.gates[i]);
  if (G.boss && !G.boss.dying) list.push(G.boss);
  for (let i = 0; i < G.bullets.length; i++) list.push(G.bullets[i]);
  for (let i = 0; i < G.ebullets.length; i++) list.push(G.ebullets[i]);
  list.sort((a, b) => b.z - a.z);

  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    if (o.kind === 'barrel') drawCrate(o);
    else if (o.kind === 'enemy') drawEnemy(o);
    else if (o.kind === 'gate') drawGate(o);
    else if (o.kind === 'bullet') drawBullet(o);
    else if (o.kind === 'ebullet') drawEBullet(o);
    else if (o.kind === 'boss') drawBoss(o);
  }

  if (G.boss && G.boss.dying) drawBossDeath();
  drawSquad();

  // 폭발 링
  for (let i = 0; i < G.booms.length; i++) drawBoom(G.booms[i]);

  // particles
  for (let i = 0; i < G.particles.length; i++) {
    const q = G.particles[i];
    const a = Math.max(0, q.life / q.max);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(q.sx, q.sy);
    ctx.rotate(q.rot);
    ctx.fillStyle = q.color;
    ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * 0.85);
    ctx.restore();
  }
  // popups
  for (let i = 0; i < G.popups.length; i++) {
    const p = G.popups[i];
    const a = Math.min(1, p.life / p.max * 1.6);
    ctx.globalAlpha = a;
    txt(p.text, p.sx, p.sy, p.size, p.color, 'center', '900', 'rgba(0,0,0,0.6)', Math.max(2, p.size * 0.16));
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.28, W / 2, H * 0.55, H * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,60,50,' + (G.flash * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();

  if (G.phase === 'start') drawStart();
  else if (G.phase === 'dead' || G.phase === 'clear') drawEnd();
  else buttons.length = 0;
}

function drawBossDeath() {
  const b = G.boss;
  const t = 1 - b.dieT / 1.7;
  const p = project(b.z);
  const x = CX + bend(b.z) + b.x * p.hw;
  const s = p.s;
  ctx.globalAlpha = Math.max(0, 1 - t);
  const r = (60 + t * 160) * s;
  const g = ctx.createRadialGradient(x, p.y - 100 * s, 0, x, p.y - 100 * s, r);
  g.addColorStop(0, 'rgba(255,255,220,0.95)');
  g.addColorStop(0.4, 'rgba(255,180,60,0.7)');
  g.addColorStop(1, 'rgba(255,90,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, p.y - 100 * s, r, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------- input ---------------- */
function setTargetFromPointer(clientX) {
  const p = project(2);
  const nx = (clientX - CX) / Math.max(30, p.hw);
  G.targetX = clamp(nx, -0.95, 0.95);
  if (!G.hintUsed) { G.hintUsed = true; G.hint = Math.min(G.hint, 0.3); }
}

function onDown(e) {
  e.preventDefault();
  initAudio();
  const x = e.clientX, y = e.clientY;

  if (muteBtn && x >= muteBtn.x && x <= muteBtn.x + muteBtn.w && y >= muteBtn.y && y <= muteBtn.y + muteBtn.h) {
    muted = !muted;
    return;
  }
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.act(); return; }
  }
  if (G.phase === 'start') { startRun(1); return; }
  if (G.phase === 'dead') { startRun(1); return; }
  if (G.phase === 'clear') return;
  G.dragging = true;
  setTargetFromPointer(x);
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
}
function onMove(e) {
  if (!G || !G.dragging || G.phase !== 'playing') return;
  e.preventDefault();
  setTargetFromPointer(e.clientX);
}
function onUp(e) {
  if (G) G.dragging = false;
}

canvas.addEventListener('pointerdown', onDown, { passive: false });
canvas.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', (e) => {
  if (!G || G.phase !== 'playing') return;
  if (e.key === 'ArrowLeft') { G.targetX = clamp(G.targetX - 0.12, -0.95, 0.95); e.preventDefault(); }
  if (e.key === 'ArrowRight') { G.targetX = clamp(G.targetX + 0.12, -0.95, 0.95); e.preventDefault(); }
});
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- boot ---------------- */
function startRun(stage) {
  resetRun(stage, 'playing');
  initAudio();
  G.hint = 1;
  G.hintUsed = false;
}

let last = 0;
function loop(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  if (!TEST_FREEZE) update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
resetRun(1, 'start');
window.addEventListener('resize', resize);
requestAnimationFrame(loop);

/* ---------------- test hooks (headless 검증용) ---------------- */
window.__game = {
  freeze(v) { TEST_FREEZE = v !== false; },
  step(sec, dt) {
    const st = dt || 1 / 60;
    let n = Math.round(sec / st);
    for (let i = 0; i < n; i++) update(st);
    render();
  },
  start(stage) { startRun(stage || 1); render(); },
  startScreen() { resetRun(1, 'start'); render(); },
  setX(x) { G.targetX = x; G.playerX = x; },
  skipToBoss() {
    G.dist = CFG.bossAt;
    G.scriptIdx = SCRIPT.length;
    G.entities.length = 0;
    G.gates.length = 0;
    update(0.0001);
    G.units = Math.max(G.units, 12);
    if (G.boss) { G.boss.z = 30; G.boss.fireT = 3; }
    render();
  },
  state() {
    return {
      phase: G.phase, stage: G.stage, units: G.units, score: Math.round(G.score),
      dist: Math.round(G.dist), entities: G.entities.length,
      gates: G.gates.length, boss: !!G.boss,
      bossHp: G.boss ? Math.round(G.boss.hp) : null,
      heavies: G.heavies.length, bikes: G.bikes.length, trucks: G.trucks.length,
      bullets: G.bullets.length, particles: G.particles.length, log: G.log
    };
  },
  giveSpecial(kind, n) {
    for (let i = 0; i < (n || 1); i++) spawnSpecial(kind, 0, 6);
    render();
  },
  setUnits(n) { G.units = Math.max(1, Math.min(CFG.maxUnits, n | 0)); render(); },
  spawnCrate(kind, x, z, hp) {
    G.entities.push(mkBarrel(x === undefined ? 0 : x, hp || 600, z === undefined ? 20 : z, kind));
    render();
  },
  damageTest() { if (G.boss) damageBoss(G.boss.hp); render(); },
  info() {
    return {
      px: G.playerX, units: G.units, phase: G.phase, t: G.t, dist: G.dist,
      ents: G.entities.map(e => ({ k: e.kind, x: +e.x.toFixed(3), z: +e.z.toFixed(1), hp: Math.round(e.hp) })),
      eb: G.ebullets.map(b => ({ x: +b.x.toFixed(3), z: +b.z.toFixed(1) })),
      gates: G.gates.map(g => ({ z: +g.z.toFixed(1), l: g.left, r: g.right, a: g.applied })),
      boss: G.boss ? { x: +G.boss.x.toFixed(2), z: +G.boss.z.toFixed(1), hp: Math.round(G.boss.hp), maxhp: G.boss.maxhp } : null,
      heavies: G.heavies.length, bikes: G.bikes.length, trucks: G.trucks.length,
      bul: G.bullets.slice(0, 12).map(b => {
        const p1 = project(b.z), p2 = project(Math.min(b.z + 9, Z_SPAWN + 2));
        return { x: +b.x.toFixed(2), z: +b.z.toFixed(1),
          sx1: Math.round(CX + bend(b.z) + b.x * p1.hw), sy1: Math.round(p1.y),
          sx2: Math.round(CX + bend(b.z + 9) + b.x * p2.hw), sy2: Math.round(p2.y) };
      })
    };
  }
};
})();
</script>
</body>
