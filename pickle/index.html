  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(92,50,26,0.32)';
  ctx.lineWidth = Math.max(1, 2 * sc);
  ctx.stroke();
  // 광배
  ctx.fillStyle = 'rgba(255,228,195,0.22)';
  ctx.beginPath(); ctx.ellipse(-W * 0.23, -H * 0.62, W * 0.11, H * 0.065, -0.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W * 0.23, -H * 0.62, W * 0.11, H * 0.065, 0.5, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(110,60,30,0.28)';
  ctx.fillRect(-W * 0.014, -H * 0.755, W * 0.028, H * 0.31);

  // 탄띠 X + 황동 탄환
  ctx.strokeStyle = 'rgba(40,44,52,0.95)';
  ctx.lineWidth = Math.max(2, W * 0.10);
  ctx.beginPath();
  ctx.moveTo(-W * 0.34, -H * 0.765); ctx.lineTo(W * 0.30, -H * 0.47);
  ctx.moveTo(W * 0.34, -H * 0.765); ctx.lineTo(-W * 0.30, -H * 0.47);
  ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const t = i / 5;
    const b1x = lerp(-W * 0.34, W * 0.30, t), b1y = lerp(-H * 0.765, -H * 0.47, t);
    const b2x = lerp(W * 0.34, -W * 0.30, t);
    ctx.fillStyle = '#eec24a';
    ctx.beginPath(); ctx.arc(b1x, b1y, W * 0.034, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(b2x, b1y, W * 0.034, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#b98a20';
    ctx.beginPath(); ctx.arc(b1x, b1y - W * 0.018, W * 0.016, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(b2x, b1y - W * 0.018, W * 0.016, 0, 6.2832); ctx.fill();
  }

  // 벨트
  ctx.fillStyle = '#2a2f38';
  ctx.fillRect(-W * 0.34, -H * 0.455, W * 0.68, H * 0.055);
  ctx.fillStyle = '#c9a24a';
  rr(-W * 0.07, -H * 0.465, W * 0.14, H * 0.07, 2 * sc); ctx.fill();

  // 목 + 머리
  ctx.fillStyle = '#c9895c';
  rr(-W * 0.09, -H * 0.815, W * 0.18, H * 0.05, 2 * sc); ctx.fill();
  const hx2 = Math.sin(ph * 0.7) * W * 0.03;
  // 목
  ctx.fillStyle = '#c9895c';
  rr(hx2 - W * 0.075, -H * 0.812, W * 0.15, H * 0.055, 2 * sc); ctx.fill();
  // 뒷머리(머리)
  ctx.fillStyle = '#c9895c';
  ctx.beginPath(); ctx.arc(hx2, -H * 0.858, W * 0.158, 0, 6.2832); ctx.fill();
  // 두건 (뒤통수 전체)
  const dg = ctx.createLinearGradient(hx2 - W * 0.17, 0, hx2 + W * 0.17, 0);
  dg.addColorStop(0, '#9c2019');
  dg.addColorStop(0.35, '#e0443a');
  dg.addColorStop(1, '#8f1b15');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(hx2, -H * 0.862, W * 0.166, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#c8322c';
  rr(hx2 - W * 0.166, -H * 0.822, W * 0.332, H * 0.020, 1.4 * sc); ctx.fill();
  // 매듭
  ctx.beginPath();
  ctx.moveTo(hx2 - W * 0.14, -H * 0.845);
  ctx.lineTo(hx2 - W * 0.29, -H * 0.800);
  ctx.lineTo(hx2 - W * 0.11, -H * 0.812);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,210,0.28)';
  ctx.beginPath(); ctx.ellipse(hx2 - W * 0.055, -H * 0.905, W * 0.055, H * 0.018, -0.4, 0, 6.2832); ctx.fill();
  // 귀
  ctx.fillStyle = '#c9895c';
  ctx.beginPath(); ctx.arc(hx2 - W * 0.162, -H * 0.848, W * 0.032, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(hx2 + W * 0.162, -H * 0.848, W * 0.032, 0, 6.2832); ctx.fill();

  // 왼팔
  ctx.save();
  ctx.translate(-W * 0.47, -H * 0.70);
  ctx.rotate(0.20 + run * 0.10);
  ctx.fillStyle = '#c98657';
  ctx.beginPath();
  ctx.moveTo(-W * 0.11, 0);
  ctx.quadraticCurveTo(-W * 0.185, H * 0.10, -W * 0.10, H * 0.20);
  ctx.lineTo(W * 0.09, H * 0.20);
  ctx.quadraticCurveTo(W * 0.145, H * 0.09, W * 0.11, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cf8b5c';
  rr(-W * 0.09, H * 0.18, W * 0.18, H * 0.11, 3 * sc); ctx.fill();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(0, H * 0.32, W * 0.095, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 오른팔 + 미니건
  ctx.save();
  ctx.translate(W * 0.46, -H * 0.66);
  ctx.rotate(-0.55);
  ctx.fillStyle = '#dda274';
  rr(-W * 0.11, 0, W * 0.22, H * 0.17, 4 * sc); ctx.fill();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(0, H * 0.185, W * 0.095, 0, 6.2832); ctx.fill();
  ctx.restore();

  const mgx = W * 0.56, mgy = -H * 0.58;
  const mgAng = -0.36 + Math.sin(ph) * 0.02 - rec * 0.10;
  ctx.save();
  ctx.translate(mgx, mgy);
  ctx.rotate(mgAng);
  // 총 본체
  ctx.fillStyle = '#2b303a';
  rr(-W * 0.21, -H * 0.062, W * 0.38, H * 0.115, 3 * sc); ctx.fill();
  ctx.fillStyle = '#5b6573';
  rr(-W * 0.17, -H * 0.042, W * 0.29, H * 0.03, 2 * sc); ctx.fill();
  // 회전 총열 6개
  for (let i = 0; i < 3; i++) {
    const off = (i - 1) * W * 0.052 + Math.sin(spin * 11 + i * 2.0) * W * 0.020;
    ctx.fillStyle = i === 1 ? '#b3bec9' : '#7c8894';
    rr(off - W * 0.023, -H * 0.30, W * 0.046, H * 0.26, 1.6 * sc); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    rr(off - W * 0.010, -H * 0.29, W * 0.012, H * 0.22, 0.8 * sc); ctx.fill();
  }
  ctx.fillStyle = '#c3ccd6';
  rr(-W * 0.115, -H * 0.315, W * 0.23, H * 0.03, 1.4 * sc); ctx.fill();
  // 탄창
  ctx.fillStyle = '#3b424d';
  rr(-W * 0.235, -H * 0.005, W * 0.10, H * 0.085, 2 * sc); ctx.fill();
  ctx.fillStyle = '#c9a24a';
  for (let i = 0; i < 3; i++) ctx.fillRect(-W * 0.222, H * 0.002 + i * H * 0.021, W * 0.072, H * 0.010);
  if (st.muzzle > 0) {
    muzzle(0, -H * 0.315, W * 0.24, 'rgba(255,205,120,0.95)');
    ctx.fillStyle = 'rgba(255,240,200,0.9)';
    ctx.beginPath(); ctx.arc(0, -H * 0.32, W * 0.08, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

/* ---------- 오토바이 라이더 ---------- */
function drawBikeUnit(x, y, sc, st) {
  const H = 84 * sc;
  const W = 0.62 * H;
  const ph = st.ph || 0;
  const weave = Math.sin(ph * 1.2) * 2.4 * sc;
  const bx = x + weave;
  const t = ph * 2.6;
  const rec = st.recoil || 0;

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(bx, y + 1.5 * sc, W * 0.46, W * 0.15, 0, 0, 6.2832); ctx.fill();

  // 전조등 빛
  const lg = ctx.createLinearGradient(bx, y - H * 1.05, bx, y - H * 2.7);
  lg.addColorStop(0, 'rgba(200,245,255,0.30)');
  lg.addColorStop(1, 'rgba(200,245,255,0)');
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(bx - W * 0.13, y - H * 0.95);
  ctx.lineTo(bx + W * 0.13, y - H * 0.95);
  ctx.lineTo(bx + W * 0.60, y - H * 2.7);
  ctx.lineTo(bx - W * 0.60, y - H * 2.7);
  ctx.closePath(); ctx.fill();

  // 뒷바퀴
  const wr = H * 0.17;
  ctx.fillStyle = '#16191e';
  ctx.beginPath(); ctx.ellipse(bx, y - wr, W * 0.19, wr, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(175,185,200,0.6)';
  ctx.lineWidth = Math.max(0.9, 1.6 * sc);
  for (let i = 0; i < 7; i++) {
    const a = t + i * 0.9;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(a) * W * 0.04, y - wr + Math.sin(a) * wr * 0.28);
    ctx.lineTo(bx + Math.cos(a) * W * 0.16, y - wr + Math.sin(a) * wr * 0.92);
    ctx.stroke();
  }
  ctx.fillStyle = '#4d565f';
  ctx.beginPath(); ctx.ellipse(bx, y - wr, W * 0.055, wr * 0.30, 0, 0, 6.2832); ctx.fill();

  // 배기관
  ctx.fillStyle = '#9aa3af';
  rr(bx - W * 0.34, y - H * 0.34, W * 0.09, H * 0.17, 2 * sc); ctx.fill();
  rr(bx + W * 0.25, y - H * 0.34, W * 0.09, H * 0.17, 2 * sc); ctx.fill();
  if (Math.sin(t * 1.7) > -0.2) {
    const fa = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.fillStyle = 'rgba(120,205,255,' + (0.28 + fa * 0.34) + ')';
    ctx.beginPath(); ctx.ellipse(bx - W * 0.295, y - H * 0.13, W * 0.05, H * 0.042 * fa, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + W * 0.295, y - H * 0.13, W * 0.05, H * 0.042 * fa, 0, 0, 6.2832); ctx.fill();
  }

  // 차체
  ctx.fillStyle = '#2f6ea8';
  rr(bx - W * 0.30, y - H * 0.44, W * 0.60, H * 0.14, 5 * sc); ctx.fill();
  ctx.fillStyle = '#1d4a72';
  rr(bx - W * 0.30, y - H * 0.32, W * 0.60, H * 0.032, 2 * sc); ctx.fill();
  ctx.fillStyle = '#ff4a3a';
  rr(bx - W * 0.09, y - H * 0.405, W * 0.18, H * 0.036, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,60,0.35)';
  ctx.beginPath(); ctx.ellipse(bx, y - H * 0.387, W * 0.15, H * 0.028, 0, 0, 6.2832); ctx.fill();

  // 시트
  ctx.fillStyle = '#20242c';
  rr(bx - W * 0.19, y - H * 0.55, W * 0.38, H * 0.10, 3 * sc); ctx.fill();

  // 라이더
  ctx.save();
  ctx.translate(bx, y - H * 0.57);
  ctx.rotate(rec * 0.05);
  const jg = ctx.createLinearGradient(-W * 0.22, 0, W * 0.22, 0);
  jg.addColorStop(0, '#1d2531');
  jg.addColorStop(0.4, '#3d4a5c');
  jg.addColorStop(1, '#1b222d');
  ctx.fillStyle = jg;
  ctx.beginPath();
  ctx.moveTo(-W * 0.21, 0);
  ctx.quadraticCurveTo(-W * 0.23, -H * 0.23, 0, -H * 0.265);
  ctx.quadraticCurveTo(W * 0.23, -H * 0.23, W * 0.21, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(10,16,24,0.4)';
  ctx.lineWidth = Math.max(1, 1.2 * sc);
  ctx.stroke();
  ctx.fillStyle = 'rgba(120,180,255,0.30)';
  ctx.fillRect(-W * 0.035, -H * 0.235, W * 0.07, H * 0.20);
  ctx.fillStyle = '#2b7fd8';
  ctx.beginPath(); ctx.arc(0, -H * 0.30, W * 0.115, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#66b2f5';
  ctx.beginPath(); ctx.arc(-W * 0.035, -H * 0.325, W * 0.042, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#123a63';
  rr(-W * 0.118, -H * 0.30, W * 0.236, H * 0.016, 1.5 * sc); ctx.fill();
  ctx.restore();

  // 핸들 + 팔
  const barY = y - H * 0.60;
  ctx.strokeStyle = '#aab3bf';
  ctx.lineWidth = Math.max(1.2, 2 * sc);
  ctx.beginPath(); ctx.moveTo(bx - W * 0.38, barY); ctx.lineTo(bx + W * 0.38, barY); ctx.stroke();
  ctx.fillStyle = '#2c313a';
  rr(bx - W * 0.42, barY - H * 0.020, W * 0.09, H * 0.042, 2 * sc); ctx.fill();
  rr(bx + W * 0.33, barY - H * 0.020, W * 0.09, H * 0.042, 2 * sc); ctx.fill();
  ctx.strokeStyle = '#242932';
  ctx.lineWidth = W * 0.070;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx - W * 0.19, y - H * 0.68); ctx.lineTo(bx - W * 0.36, barY - H * 0.01); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + W * 0.19, y - H * 0.68); ctx.lineTo(bx + W * 0.36, barY - H * 0.01); ctx.stroke();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(bx - W * 0.375, barY - H * 0.004, W * 0.042, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + W * 0.375, barY - H * 0.004, W * 0.042, 0, 6.2832); ctx.fill();

  // 전조등 (핸들 아래 작게)
  ctx.fillStyle = 'rgba(215,250,255,0.92)';
  ctx.beginPath(); ctx.ellipse(bx, barY - H * 0.045, W * 0.055, H * 0.018, 0, 0, 6.2832); ctx.fill();

  if (st.muzzle > 0) {
    muzzle(bx - W * 0.39, barY - H * 0.03, W * 0.13, 'rgba(160,235,255,0.95)');
    muzzle(bx + W * 0.39, barY - H * 0.03, W * 0.13, 'rgba(160,235,255,0.95)');
  }
}

/* ---------- 무장 지프 ---------- */
function drawJeepUnit(x, y, sc, st) {
  const Wd = 70 * sc;
  const Hh = 54 * sc;
  const ph = st.ph || 0;
  const bounce = Math.abs(Math.sin(ph * 1.7)) * 1.8 * sc;
  const gy = y - bounce;
  const rec = st.recoil || 0;
  const spin = ph * 7;

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 2 * sc, Wd * 0.50, Wd * 0.13, 0, 0, 6.2832); ctx.fill();

  // 배기 연기
  for (let i = 0; i < 3; i++) {
    const pr = ((ph * 0.35 + i * 0.34) % 1);
    ctx.fillStyle = 'rgba(220,220,210,' + (0.22 * (1 - pr)) + ')';
    ctx.beginPath();
    ctx.arc(x - Wd * 0.42 - pr * 16 * sc, gy - Hh * 0.16 - pr * 24 * sc, (2.4 + pr * 7) * sc, 0, 6.2832);
    ctx.fill();
  }

  // 바퀴 (몸체 밖)
  for (let i = -1; i <= 1; i += 2) {
    const wx = x + i * Wd * 0.40;
    ctx.fillStyle = '#15181d';
    rr(wx - Wd * 0.085, gy - Hh * 0.36, Wd * 0.17, Hh * 0.36, 4 * sc); ctx.fill();
    ctx.fillStyle = '#2c333c';
    rr(wx - Wd * 0.045, gy - Hh * 0.26, Wd * 0.09, Hh * 0.13, 2.5 * sc); ctx.fill();
    ctx.strokeStyle = 'rgba(180,190,205,0.45)';
    ctx.lineWidth = Math.max(0.9, 1.3 * sc);
    for (let k = 0; k < 3; k++) {
      const a = spin + k * 1.05;
      ctx.beginPath();
      ctx.moveTo(wx, gy - Hh * 0.18);
      ctx.lineTo(wx + Math.cos(a) * Wd * 0.065, gy - Hh * 0.18 + Math.sin(a) * Hh * 0.13);
      ctx.stroke();
    }
  }

  // 차체
  const g = ctx.createLinearGradient(0, gy - Hh * 0.92, 0, gy);
  g.addColorStop(0, '#88975c');
  g.addColorStop(0.40, '#65744a');
  g.addColorStop(1, '#3d472c');
  ctx.fillStyle = g;
  rr(x - Wd * 0.355, gy - Hh * 0.86, Wd * 0.71, Hh * 0.74, 6 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(26,32,18,0.55)';
  ctx.lineWidth = Math.max(1.2, 2 * sc);
  rr(x - Wd * 0.355, gy - Hh * 0.86, Wd * 0.71, Hh * 0.74, 6 * sc); ctx.stroke();

  // 범퍼
  ctx.fillStyle = '#3a4132';
  rr(x - Wd * 0.40, gy - Hh * 0.20, Wd * 0.80, Hh * 0.11, 3 * sc); ctx.fill();
  ctx.fillStyle = '#59614a';
  rr(x - Wd * 0.40, gy - Hh * 0.20, Wd * 0.80, Hh * 0.032, 2 * sc); ctx.fill();

  // 후면 패널
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  rr(x - Wd * 0.30, gy - Hh * 0.81, Wd * 0.60, Hh * 0.58, 4 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(28,34,20,0.55)';
  ctx.lineWidth = Math.max(1, 1.6 * sc);
  ctx.beginPath();
  ctx.moveTo(x, gy - Hh * 0.80); ctx.lineTo(x, gy - Hh * 0.24);
  ctx.stroke();
  ctx.fillStyle = '#b3bd8c';
  rr(x - Wd * 0.055, gy - Hh * 0.55, Wd * 0.11, Hh * 0.055, 2 * sc); ctx.fill();
  // 테일램프
  ctx.fillStyle = '#ff4a3a';
  rr(x - Wd * 0.31, gy - Hh * 0.34, Wd * 0.075, Hh * 0.06, 2 * sc); ctx.fill();
  rr(x + Wd * 0.235, gy - Hh * 0.34, Wd * 0.075, Hh * 0.06, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,60,0.30)';
  ctx.beginPath(); ctx.ellipse(x - Wd * 0.27, gy - Hh * 0.31, Wd * 0.10, Hh * 0.035, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + Wd * 0.27, gy - Hh * 0.31, Wd * 0.10, Hh * 0.035, 0, 0, 6.2832); ctx.fill();

  // 지붕판
  ctx.fillStyle = '#4e5a36';
  rr(x - Wd * 0.34, gy - Hh * 0.985, Wd * 0.68, Hh * 0.16, 4 * sc); ctx.fill();
  ctx.fillStyle = '#77865a';
  rr(x - Wd * 0.30, gy - Hh * 0.975, Wd * 0.28, Hh * 0.045, 2 * sc); ctx.fill();
  rr(x + Wd * 0.02, gy - Hh * 0.975, Wd * 0.28, Hh * 0.045, 2 * sc); ctx.fill();

  // 포탑
  ctx.save();
  ctx.translate(x, gy - Hh * 1.02);
  ctx.rotate(rec * 0.05);
  ctx.fillStyle = '#2f3722';
  ctx.beginPath(); ctx.ellipse(0, 0, Wd * 0.26, Hh * 0.055, 0, 0, 6.2832); ctx.fill();
  const tg = ctx.createLinearGradient(-Wd * 0.20, 0, Wd * 0.20, 0);
  tg.addColorStop(0, '#48542e');
  tg.addColorStop(0.4, '#6b7a46');
  tg.addColorStop(1, '#3d4726');
  ctx.fillStyle = tg;
  rr(-Wd * 0.20, -Hh * 0.25, Wd * 0.40, Hh * 0.26, 5 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(22,28,12,0.6)';
  ctx.lineWidth = Math.max(1, 1.8 * sc);
  rr(-Wd * 0.20, -Hh * 0.25, Wd * 0.40, Hh * 0.26, 5 * sc); ctx.stroke();
  // 해치
  ctx.fillStyle = '#84945c';
  rr(-Wd * 0.07, -Hh * 0.235, Wd * 0.14, Hh * 0.06, 2 * sc); ctx.fill();
  // 기관포
  const ang = 0.04 + Math.sin(ph * 0.8) * 0.03;
  ctx.save();
  ctx.translate(Wd * 0.02, -Hh * 0.22);
  ctx.rotate(ang);
  ctx.fillStyle = '#7c8794';
  rr(-Wd * 0.028, -Hh * 0.42, Wd * 0.056, Hh * 0.44, 1.8 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(-Wd * 0.012, -Hh * 0.40, Wd * 0.014, Hh * 0.36, 1 * sc); ctx.fill();
  ctx.fillStyle = '#30363d';
  rr(-Wd * 0.045, -Hh * 0.44, Wd * 0.09, Hh * 0.07, 1.6 * sc); ctx.fill();
  ctx.fillStyle = '#30363d';
  rr(-Wd * 0.06, -Hh * 0.10, Wd * 0.12, Hh * 0.09, 2 * sc); ctx.fill();
  if (st.muzzle > 0) muzzle(0, -Hh * 0.46, Wd * 0.16, 'rgba(255,190,90,0.95)');
  ctx.restore();
  ctx.restore();
}

function drawUnitTier(tier, x, y, sc, st) {
  if (tier === 3) drawJeepUnit(x, y, sc, st);
  else if (tier === 2) drawBikeUnit(x, y, sc, st);
  else if (tier === 1) drawHeavyUnit(x, y, sc, st);
  else drawRifleUnit(x, y, sc, st);
}

/* ---------- 아군 1줄 ---------- */
function drawSquad() {
  if (G.phase === 'start' && !G.slots.length) return;
  const pulse = 1 + Math.max(0, G.unitPulse) * 0.05;

  // 지면 글로우
  const p0 = project(Z_UNIT + 0.6);
  const gx = CX + bend(Z_UNIT) + G.playerX * p0.hw;
  const gg = ctx.createRadialGradient(gx, p0.y, 0, gx, p0.y, ROAD_HALF * 0.55);
  gg.addColorStop(0, 'rgba(90,190,255,0.20)');
  gg.addColorStop(1, 'rgba(90,190,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(gx, p0.y - 2, ROAD_HALF * 0.55, 26, 0, 0, 6.2832); ctx.fill();

  for (let i = 0; i < G.slots.length; i++) {
    const s = G.slots[i];
    const pos = slotPos(i);
    if (s.glow > 0) {
      const gr = ctx.createRadialGradient(pos.x, pos.y - 30 * pos.sc, 0, pos.x, pos.y - 30 * pos.sc, 62 * pos.sc);
      gr.addColorStop(0, 'rgba(255,240,180,' + (0.35 * s.glow) + ')');
      gr.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(pos.x, pos.y - 30 * pos.sc, 62 * pos.sc, 0, 6.2832); ctx.fill();
    }
    drawUnitTier(s.tier, pos.x, pos.y, pos.sc * pulse, s);
  }
}

/* ---------- 나무통 ---------- */
function drawBarrel(e) {
  if (e.z < 0.45) return;
  const p = project(e.z);
  const x = CX + bend(e.z) + e.x * p.hw;
  const s = p.s;
  const w = 150 * s, h = 122 * s;
  const sq = e.sq;
  const sxq = 1 + sq * 0.20;
  const syq = 1 - sq * 0.17;

  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 1.5 * s, w * 0.52, w * 0.15, 0, 0, 6.2832); ctx.fill();

  // 보상 빛기둥
  if (e.rew && REW[e.rew]) {
    const col = REW[e.rew].col;
    const lg = ctx.createLinearGradient(0, p.y - h * 2.4, 0, p.y);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(1, hexA(col, 0.16));
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.26, p.y - h * 2.4);
    ctx.lineTo(x + w * 0.26, p.y - h * 2.4);
    ctx.lineTo(x + w * 0.55, p.y);
    ctx.lineTo(x - w * 0.55, p.y);
    ctx.closePath(); ctx.fill();
  }

  ctx.save();
  ctx.translate(x, p.y);
  ctx.scale(sxq, syq);

  // 몸통
  const body = ctx.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
  body.addColorStop(0, '#7d4a1e');
  body.addColorStop(0.16, '#b8793b');
  body.addColorStop(0.40, '#d8a463');
  body.addColorStop(0.66, '#b3773a');
  body.addColorStop(1, '#74441a');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-w * 0.43, -h);
  ctx.quadraticCurveTo(-w * 0.55, -h * 0.5, -w * 0.43, 0);
  ctx.lineTo(w * 0.43, 0);
  ctx.quadraticCurveTo(w * 0.55, -h * 0.5, w * 0.43, -h);
  ctx.closePath(); ctx.fill();

  // 세로 판자 홈
  ctx.strokeStyle = 'rgba(70,40,12,0.42)';
  ctx.lineWidth = Math.max(0.8, 1.6 * s);
  for (let i = -2; i <= 2; i++) {
    const bx = i * w * 0.17;
    ctx.beginPath();
    ctx.moveTo(bx * 0.86, -h * 0.98);
    ctx.quadraticCurveTo(bx * 1.12, -h * 0.5, bx * 0.86, -h * 0.02);
    ctx.stroke();
  }
  // 금속 밴드
  for (let i = 0; i < 2; i++) {
    const by = -h * (0.24 + i * 0.44);
    ctx.fillStyle = '#6d6a63';
    ctx.fillRect(-w * 0.47, by, w * 0.94, Math.max(2, h * 0.075));
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(-w * 0.47, by + Math.max(1, h * 0.012), w * 0.94, Math.max(0.8, h * 0.018));
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(-w * 0.47, by + h * 0.06, w * 0.94, Math.max(0.8, h * 0.015));
  }

  // 상단 뚜껑 (보상이 올라가는 면)
  ctx.fillStyle = '#e6bb80';
  ctx.beginPath(); ctx.ellipse(0, -h, w * 0.43, h * 0.10, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(96,60,22,0.7)';
  ctx.lineWidth = Math.max(1, 1.8 * s);
  ctx.beginPath(); ctx.ellipse(0, -h, w * 0.43, h * 0.10, 0, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = 'rgba(120,72,26,0.30)';
  ctx.beginPath(); ctx.ellipse(0, -h, w * 0.20, h * 0.045, 0, 0, 6.2832); ctx.fill();

  // 균열
  if (e.hp < e.maxhp * 0.66) {
    ctx.strokeStyle = 'rgba(48,24,6,0.55)';
    ctx.lineWidth = Math.max(1, 1.8 * s);
    ctx.beginPath();
    ctx.moveTo(-w * 0.28, -h * 0.90);
    ctx.lineTo(-w * 0.34, -h * 0.70);
    ctx.lineTo(-w * 0.26, -h * 0.56);
    ctx.moveTo(w * 0.32, -h * 0.84);
    ctx.lineTo(w * 0.26, -h * 0.66);
    if (e.hp < e.maxhp * 0.3) {
      ctx.moveTo(-w * 0.34, -h * 0.34);
      ctx.lineTo(-w * 0.22, -h * 0.20);
      ctx.moveTo(w * 0.30, -h * 0.95);
      ctx.lineTo(w * 0.12, -h * 0.66);
      ctx.lineTo(w * 0.26, -h * 0.46);
    }
    ctx.stroke();
  }

  // 숫자
  const fs = Math.min(w * 0.40, 38 * s);
  const bump = 1 + e.hitT * 1.8;
  ctx.save();
  ctx.translate(0, -h * 0.52);
  ctx.scale(bump, bump);
  txt(String(Math.max(0, Math.ceil(e.hp))), 0, 0, Math.max(8, fs), '#fff8e8', 'center', '900', 'rgba(44,20,0,0.95)', Math.max(1.6, fs * 0.17));
  ctx.restore();

  // 피격 백색 플래시
  if (e.flash > 0) {
    const a = Math.min(1, e.flash / 0.06);
    ctx.globalAlpha = a * 0.42;
    ctx.fillStyle = '#fff6e0';
    ctx.beginPath();
    ctx.moveTo(-w * 0.43, -h);
    ctx.quadraticCurveTo(-w * 0.55, -h * 0.5, -w * 0.43, 0);
    ctx.lineTo(w * 0.43, 0);
    ctx.quadraticCurveTo(w * 0.55, -h * 0.5, w * 0.43, -h);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 통 위 보상
  if (e.rew && REW[e.rew]) {
    drawRewardOnBarrel(e.rew, x, p.y - h * syq, s, e.rot);
  }
}

function drawRewardOnBarrel(kind, x, yTop, s, rot) {
  const bob = Math.abs(Math.sin(rot * 1.9)) * 7 * s;
  const spin = Math.cos(rot * 1.15);
  const flip = spin < 0 ? -1 : 1;
  const sc = (kind === 'jeep' ? 1.55 : kind === 'bike' ? 1.62 : kind === 'heavy' ? 1.44 : 1.78) * s;
  const st = { ph: rot * 3, muzzle: 0, recoil: 0 };

  ctx.save();
  ctx.translate(x, yTop - bob);
  ctx.scale(Math.max(0.26, Math.abs(spin)) * flip, 1);
  if (kind === 'power') {
    const hh = 34 * sc / 0.5;
    ctx.save();
    ctx.translate(0, -hh * 0.45);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, hh * 0.75);
    g.addColorStop(0, 'rgba(255,220,150,0.55)');
    g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, hh * 0.75, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#ffd24d';
    ctx.beginPath();
    ctx.moveTo(hh * 0.10, -hh * 0.55);
    ctx.lineTo(-hh * 0.22, hh * 0.02);
    ctx.lineTo(-hh * 0.02, hh * 0.02);
    ctx.lineTo(-hh * 0.12, hh * 0.52);
    ctx.lineTo(hh * 0.24, -hh * 0.10);
    ctx.lineTo(hh * 0.02, -hh * 0.10);
    ctx.closePath();
    ctx.fillStyle = '#ffdf6e';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,60,10,0.5)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();
  } else {
    const tier = kind === 'jeep' ? 3 : kind === 'bike' ? 2 : kind === 'heavy' ? 1 : 0;
    drawUnitTier(tier, 0, 0, sc, st);
  }
  ctx.restore();

  // 반짝임
  const tw = 0.5 + 0.5 * Math.sin(rot * 5.3);
  ctx.fillStyle = 'rgba(255,255,235,' + (0.35 + tw * 0.5) + ')';
  const sx = x + 26 * s * Math.sin(rot * 1.7);
  const sy = yTop - 42 * s - bob;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 5 * s); ctx.lineTo(sx + 1.6 * s, sy); ctx.lineTo(sx, sy + 5 * s); ctx.lineTo(sx - 1.6 * s, sy);
  ctx.closePath(); ctx.fill();
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* ---------- 빨간 적 ---------- */
function drawEnemy(e) {
  if (e.z < 0.4) return;
  const p = project(e.z);
  const x = CX + bend(e.z) + e.x * p.hw;
  const sc = p.s * 1.02;
  const h = 48 * sc, w = 23 * sc;
  const run = Math.sin(e.ph), run2 = Math.cos(e.ph);
  const bob = Math.abs(run2) * 1.2 * sc;
  const gy = p.y - bob;
  const sq = e.sq;
  const sxq = 1 + sq * 0.22, syq = 1 - sq * 0.18;

  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 1 * sc, w * 0.66, w * 0.22, 0, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.translate(x, p.y);
  ctx.scale(sxq, syq);
  const yb = -(p.y - gy);

  // 다리
  for (let sd = -1; sd <= 1; sd += 2) {
    ctx.save();
    ctx.translate(sd * w * 0.17, yb - h * 0.38);
    ctx.rotate(run * 0.7 * sd);
    ctx.fillStyle = '#a8321f';
    rr(-w * 0.115, 0, w * 0.23, h * 0.30, 2 * sc); ctx.fill();
    ctx.fillStyle = '#6d1f14';
    rr(-w * 0.13, h * 0.25, w * 0.26, h * 0.09, 1.6 * sc); ctx.fill();
    ctx.restore();
  }

  // 몸통
  ctx.fillStyle = '#e5d9c4';
  rr(-w * 0.36, yb - h * 0.80, w * 0.72, h * 0.44, 3 * sc); ctx.fill();
  ctx.fillStyle = '#c93a26';
  rr(-w * 0.36, yb - h * 0.80, w * 0.72, h * 0.12, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(-w * 0.36, yb - h * 0.52, w * 0.72, h * 0.03);
  // 벨트
  ctx.fillStyle = '#5a3a24';
  ctx.fillRect(-w * 0.36, yb - h * 0.40, w * 0.72, h * 0.05);

  // 팔
  for (let sd = -1; sd <= 1; sd += 2) {
    ctx.save();
    ctx.translate(sd * w * 0.40, yb - h * 0.74);
    ctx.rotate(-run * 0.55 * sd);
    ctx.fillStyle = '#e5d9c4';
    rr(-w * 0.09, 0, w * 0.18, h * 0.24, 2 * sc); ctx.fill();
    ctx.fillStyle = '#e0a87c';
    ctx.beginPath(); ctx.arc(0, h * 0.25, w * 0.085, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // 머리 + 빨간 헬멧
  const hy = yb - h * 0.92;
  ctx.fillStyle = '#e8b48c';
  ctx.beginPath(); ctx.arc(0, hy, w * 0.205, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#1c1c1c';
  ctx.beginPath(); ctx.arc(-w * 0.07, hy - w * 0.02, w * 0.028, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.07, hy - w * 0.02, w * 0.028, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#d8352a';
  ctx.beginPath(); ctx.arc(0, hy - h * 0.012, w * 0.28, Math.PI * 0.97, Math.PI * 2.03); ctx.fill();
  ctx.fillStyle = '#f2574a';
  ctx.beginPath(); ctx.arc(-w * 0.06, hy - h * 0.045, w * 0.11, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#a3241c';
  rr(-w * 0.30, hy - h * 0.012, w * 0.60, h * 0.032, 1.4 * sc); ctx.fill();

  // 소총 (작게)
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = Math.max(1, w * 0.11);
  ctx.beginPath();
  ctx.moveTo(w * 0.30, yb - h * 0.62);
  ctx.lineTo(w * 0.46, yb - h * 0.92);
  ctx.stroke();

  // 피격 플래시
  if (e.flash > 0) {
    ctx.globalAlpha = Math.min(1, e.flash / 0.06) * 0.55;
    ctx.fillStyle = '#ffffff';
    rr(-w * 0.40, yb - h * 0.98, w * 0.80, h * 0.60, 3 * sc); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- 게이트 ---------- */
function drawGate(g) {
  if (g.z < -2) return;
  const z = Math.max(g.z, 0.4);
  const p = project(z);
  const cx = CX + bend(z);
  let alpha = g.applied ? Math.max(0, g.flash / 0.7) : 1;
  alpha *= clamp((g.z - 1.0) / 5.0, 0, 1);
  if (alpha <= 0.02) return;
  const hh = 126 * p.s;

  ctx.save();
  ctx.globalAlpha = alpha;

  for (let side = -1; side <= 1; side += 2) {
    const key = side < 0 ? g.left : g.right;
    const o = GATE[key] || { label: '?', sub: '', col: '#fff', tier: -9 };
    const bad = o.tier === -3;
    const px = cx + side * p.hw * 0.5;
    const pw = p.hw * 0.90;
    const left = px - pw / 2;

    // 패널
    const pg = ctx.createLinearGradient(0, p.y - hh, 0, p.y);
    if (bad) {
      pg.addColorStop(0, 'rgba(214,58,48,0.66)');
      pg.addColorStop(1, 'rgba(140,26,22,0.86)');
    } else {
      pg.addColorStop(0, 'rgba(32,126,196,0.66)');
      pg.addColorStop(1, 'rgba(16,74,130,0.86)');
    }
    ctx.fillStyle = pg;
    rr(left, p.y - hh, pw, hh, 10 * p.s); ctx.fill();
    ctx.strokeStyle = bad ? 'rgba(255,160,150,0.9)' : 'rgba(150,225,255,0.85)';
    ctx.lineWidth = Math.max(1.2, 2.2 * p.s);
    rr(left, p.y - hh, pw, hh, 10 * p.s); ctx.stroke();

    // 위쪽 빛
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    rr(left + 3 * p.s, p.y - hh + 3 * p.s, pw - 6 * p.s, hh * 0.12, 6 * p.s); ctx.fill();

    // 아이콘
    const iy = p.y - hh * 0.76;
    if (bad) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(2, 3.4 * p.s);
      const r = 12 * p.s;
      ctx.beginPath();
      ctx.moveTo(px - r, iy - r); ctx.lineTo(px + r, iy + r);
      ctx.moveTo(px + r, iy - r); ctx.lineTo(px - r, iy + r);
      ctx.stroke();
    } else if (o.tier === -2) {
      const hh2 = 30 * p.s;
      ctx.fillStyle = '#ffd24d';
      ctx.beginPath();
      ctx.moveTo(px + hh2 * 0.10, iy - hh2 * 0.55);
      ctx.lineTo(px - hh2 * 0.22, iy + hh2 * 0.02);
      ctx.lineTo(px - hh2 * 0.02, iy + hh2 * 0.02);
      ctx.lineTo(px - hh2 * 0.12, iy + hh2 * 0.52);
      ctx.lineTo(px + hh2 * 0.24, iy - hh2 * 0.10);
      ctx.lineTo(px + hh2 * 0.02, iy - hh2 * 0.10);
      ctx.closePath(); ctx.fill();
    } else {
      const tier = o.tier === -1 ? 0 : o.tier;
      drawUnitTier(tier >= 0 ? tier : 0, px, iy + 16 * p.s, 0.52 * p.s, { ph: G.t * 5, muzzle: 0, recoil: 0 });
    }

    // 라벨
    const fs = Math.max(9, Math.min(19 * p.s, 15));
    txt(o.label, px, p.y - hh * 0.34, fs, '#ffffff', 'center', '900', 'rgba(0,0,0,0.5)', Math.max(2, fs * 0.18));
    txt(o.sub, px, p.y - hh * 0.16, Math.max(7, fs * 0.70), 'rgba(230,245,255,0.92)', 'center', '700');

    // 기둥
    ctx.fillStyle = 'rgba(60,70,80,0.75)';
    ctx.fillRect(px - side * pw * 0.5 - 2 * p.s, p.y - hh, 4 * p.s, hh);
  }
  ctx.restore();
}

/* ---------- 보스 ---------- */
function drawBoss(b) {
  const p = project(b.z);
  const x = CX + bend(b.z) + b.x * p.hw;
  const s = p.s * 1.36;
  const Hh = 250 * s, Wd = 150 * s;
  const stepA = Math.sin(b.step), stepB = Math.sin(b.step + Math.PI);
  const bob = Math.abs(Math.cos(b.step)) * 4 * s;
  const gy = p.y - bob;
  const sq = b.sq;
  const sxq = 1 + sq * 0.12, syq = 1 - sq * 0.10;

  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 2 * s, Wd * 0.52, Wd * 0.14, 0, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.translate(x, gy);
  ctx.scale(sxq, syq);

  // 다리
  for (let sd = -1; sd <= 1; sd += 2) {
    ctx.save();
    ctx.translate(sd * Wd * 0.17, -Hh * 0.40);
    ctx.rotate((sd > 0 ? stepA : stepB) * 0.24);
    ctx.fillStyle = '#4a1f1c';
    rr(-Wd * 0.10, 0, Wd * 0.20, Hh * 0.27, 5 * s); ctx.fill();
    ctx.fillStyle = '#2a1210';
    rr(-Wd * 0.13, Hh * 0.23, Wd * 0.26, Hh * 0.10, 4 * s); ctx.fill();
    ctx.restore();
  }

  // 코트 자락
  ctx.fillStyle = '#a82c26';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.34, -Hh * 0.52);
  ctx.quadraticCurveTo(-Wd * 0.46, -Hh * 0.28, -Wd * 0.34, -Hh * 0.16);
  ctx.lineTo(Wd * 0.34, -Hh * 0.16);
  ctx.quadraticCurveTo(Wd * 0.46, -Hh * 0.28, Wd * 0.34, -Hh * 0.52);
  ctx.closePath(); ctx.fill();

  // 몸통 (빨간 코트)
  const bg = ctx.createLinearGradient(-Wd * 0.45, 0, Wd * 0.45, 0);
  bg.addColorStop(0, '#8e2019');
  bg.addColorStop(0.34, '#cf3a30');
  bg.addColorStop(0.72, '#ad2b23');
  bg.addColorStop(1, '#7d1a14');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.33, -Hh * 0.44);
  ctx.quadraticCurveTo(-Wd * 0.44, -Hh * 0.66, -Wd * 0.40, -Hh * 0.80);
  ctx.quadraticCurveTo(-Wd * 0.28, -Hh * 0.86, -Wd * 0.12, -Hh * 0.865);
  ctx.lineTo(Wd * 0.12, -Hh * 0.865);
  ctx.quadraticCurveTo(Wd * 0.28, -Hh * 0.86, Wd * 0.40, -Hh * 0.80);
  ctx.quadraticCurveTo(Wd * 0.44, -Hh * 0.66, Wd * 0.33, -Hh * 0.44);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(60,10,8,0.45)';
  ctx.lineWidth = Math.max(1.5, 2.4 * s);
  ctx.stroke();
  // 등 근육
  ctx.fillStyle = 'rgba(255,190,170,0.14)';
  ctx.beginPath(); ctx.ellipse(-Wd * 0.20, -Hh * 0.68, Wd * 0.10, Hh * 0.07, -0.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(Wd * 0.20, -Hh * 0.68, Wd * 0.10, Hh * 0.07, 0.5, 0, 6.2832); ctx.fill();
  // 재킷 지퍼
  ctx.strokeStyle = 'rgba(70,14,10,0.5)';
  ctx.lineWidth = Math.max(1.5, 2.6 * s);
  ctx.beginPath(); ctx.moveTo(0, -Hh * 0.845); ctx.lineTo(0, -Hh * 0.18); ctx.stroke();
  // 벨트
  ctx.fillStyle = '#3a1a14';
  ctx.fillRect(-Wd * 0.34, -Hh * 0.48, Wd * 0.68, Hh * 0.045);
  ctx.fillStyle = '#d8b34a';
  rr(-Wd * 0.07, -Hh * 0.49, Wd * 0.14, Hh * 0.065, 3 * s); ctx.fill();

  // 왼팔 (거대)
  ctx.save();
  ctx.translate(-Wd * 0.40, -Hh * 0.78);
  ctx.rotate(-0.18 + stepB * 0.10);
  ctx.fillStyle = '#cf3a30';
  rr(-Wd * 0.10, 0, Wd * 0.20, Hh * 0.20, 6 * s); ctx.fill();
  ctx.fillStyle = '#e0a879';
  rr(-Wd * 0.095, Hh * 0.18, Wd * 0.19, Hh * 0.17, 6 * s); ctx.fill();
  ctx.fillStyle = '#eeb98c';
  ctx.beginPath(); ctx.arc(0, Hh * 0.38, Wd * 0.10, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 오른팔 + 철판
  ctx.save();
  ctx.translate(Wd * 0.42, -Hh * 0.80);
  ctx.rotate(0.12 + stepA * 0.06 - b.hitT * 0.3);
  ctx.fillStyle = '#cf3a30';
  rr(-Wd * 0.11, 0, Wd * 0.22, Hh * 0.22, 6 * s); ctx.fill();
  ctx.fillStyle = '#e0a879';
  rr(-Wd * 0.10, Hh * 0.20, Wd * 0.20, Hh * 0.18, 6 * s); ctx.fill();
  // 철판(빔)
  ctx.save();
  ctx.translate(0, Hh * 0.10);
  ctx.rotate(-0.35);
  ctx.fillStyle = '#9aa3ab';
  rr(-Wd * 0.55, -Hh * 0.10, Wd * 0.90, Hh * 0.085, 3 * s); ctx.fill();
  ctx.fillStyle = '#c8d0d6';
  rr(-Wd * 0.55, -Hh * 0.085, Wd * 0.90, Hh * 0.022, 2 * s); ctx.fill();
  ctx.fillStyle = '#6f767c';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(-Wd * 0.48 + i * Wd * 0.18, -Hh * 0.055, Wd * 0.014, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#eeb98c';
  ctx.beginPath(); ctx.arc(0, Hh * 0.40, Wd * 0.105, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 목
  ctx.fillStyle = '#b87c52';
  rr(-Hh * 0.045, -Hh * 0.905, Hh * 0.09, Hh * 0.07, 3 * s); ctx.fill();
  // 머리
  const hy = -Hh * 0.978;
  const hr = Hh * 0.088;
  ctx.fillStyle = '#efb98c';
  ctx.beginPath(); ctx.arc(0, hy, hr, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(60,26,14,0.32)';
  ctx.lineWidth = Math.max(1, 1.8 * s);
  ctx.beginPath(); ctx.arc(0, hy, hr, 0, 6.2832); ctx.stroke();
  // 노란 머리카락 (스파이크)
  ctx.fillStyle = '#f2c53d';
  ctx.beginPath(); ctx.arc(0, hy - hr * 0.10, hr * 1.06, Math.PI * 0.90, Math.PI * 2.10); ctx.fill();
  for (let i = -3; i <= 3; i++) {
    const bx = i * hr * 0.30;
    ctx.beginPath();
    ctx.moveTo(bx - hr * 0.24, hy - hr * 0.72);
    ctx.lineTo(bx + i * hr * 0.06, hy - hr * 1.30 + Math.abs(i) * hr * 0.05);
    ctx.lineTo(bx + hr * 0.24, hy - hr * 0.72);
    ctx.closePath(); ctx.fill();
  }
  // 눈 + 콧수염
  ctx.fillStyle = '#1c1410';
  ctx.beginPath(); ctx.arc(-hr * 0.36, hy + hr * 0.06, hr * 0.115, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(hr * 0.36, hy + hr * 0.06, hr * 0.115, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#f2c53d';
  ctx.beginPath();
  ctx.moveTo(-hr * 0.46, hy + hr * 0.38);
  ctx.quadraticCurveTo(0, hy + hr * 0.62, hr * 0.46, hy + hr * 0.38);
  ctx.quadraticCurveTo(0, hy + hr * 0.50, -hr * 0.46, hy + hr * 0.38);
  ctx.closePath(); ctx.fill();

  // 피격 플래시
  if (b.flash > 0) {
    ctx.globalAlpha = Math.min(1, b.flash / 0.06) * 0.45;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-Wd * 0.36, -Hh * 0.50);
    ctx.quadraticCurveTo(-Wd * 0.46, -Hh * 0.70, -Wd * 0.42, -Hh * 0.82);
    ctx.lineTo(Wd * 0.42, -Hh * 0.82);
    ctx.quadraticCurveTo(Wd * 0.46, -Hh * 0.70, Wd * 0.36, -Hh * 0.50);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 머리 위 HP 숫자
  const fs = Math.max(12, 30 * s);
  txt(String(Math.max(0, Math.ceil(b.hp))), x, gy - Hh * 1.14, fs, '#ffffff', 'center', '900', 'rgba(0,0,0,0.65)', Math.max(2.4, fs * 0.16));
}

/* ---------- 총알 ---------- */
function drawBullet(b) {
  const z1 = clamp(b.z, 0, Z_SPAWN);
  const z2 = clamp(b.z + 11, 0, Z_SPAWN + 6);
  if (z1 >= z2) return;
  const p1 = project(z1), p2 = project(z2);
  const x1 = CX + bend(z1) + b.x * p1.hw;
  const y1 = p1.y - 16 * p1.s;
  const x2 = CX + bend(z2) + b.x * p2.hw;
  const y2 = p2.y - 16 * p2.s;
  const hot = b.sp === 3;
  ctx.strokeStyle = hot ? 'rgba(255,200,90,0.95)' : b.sp === 1 ? 'rgba(255,225,150,0.95)' : 'rgba(150,225,255,0.95)';
  ctx.lineWidth = Math.max(1.2, 2.4 * p1.s * b.w);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = Math.max(0.7, 1.1 * p1.s * b.w);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(lerp(x1, x2, 0.55), lerp(y1, y2, 0.55));
  ctx.stroke();
  if (hot) {
    ctx.fillStyle = 'rgba(255,200,90,0.85)';
    ctx.beginPath(); ctx.arc(x1, y1, 2.4 * p1.s + 1, 0, 6.2832); ctx.fill();
  }
}

function drawEBullet(b) {
  const z = clamp(b.z, 0, Z_SPAWN);
  const p = project(z);
  const x = CX + bend(z) + b.x * p.hw;
  const y = p.y - (b.boss ? 60 : 26) * p.s;
  const r = (b.boss ? 9 : 5) * Math.max(0.5, p.s);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.9);
  g.addColorStop(0, 'rgba(255,240,180,0.95)');
  g.addColorStop(0.5, 'rgba(255,120,60,0.85)');
  g.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#fff3c0';
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 6.2832); ctx.fill();
}

/* ---------- fx draw ---------- */
function drawBoom(b) {
  const k = Math.min(1, b.t / b.life);
  const r = (16 + k * (b.big ? 130 : 88)) * b.sc;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - k);
  const g = ctx.createRadialGradient(b.sx, b.sy, 0, b.sx, b.sy, r);
  g.addColorStop(0, 'rgba(255,255,235,0.95)');
  g.addColorStop(0.32, 'rgba(255,205,100,0.8)');
  g.addColorStop(1, 'rgba(255,90,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.sx, b.sy, r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,242,205,' + (0.7 * (1 - k)) + ')';
  ctx.lineWidth = Math.max(1, 5 * b.sc * (1 - k));
  ctx.beginPath(); ctx.arc(b.sx, b.sy, r * 1.15, 0, 6.2832); ctx.stroke();
  ctx.restore();
}
function drawRing(r) {
  const k = r.t / r.life;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - k);
  ctx.strokeStyle = r.col;
  ctx.lineWidth = Math.max(1, 5 * (1 - k));
  ctx.beginPath(); ctx.arc(r.sx, r.sy, r.r * (0.4 + k * 1.5), 0, 6.2832); ctx.stroke();
  ctx.restore();
}
/*__PART_D__*/

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawGround();

  ctx.save();
  if (G.shake > 0.25) {
    ctx.translate(rand(-1, 1) * G.shake * 0.42, rand(-1, 1) * G.shake * 0.42);
  }

  drawRoad();
  drawRails();
  drawHaze();

  const list = [];
  for (let i = 0; i < G.entities.length; i++) if (!G.entities[i].dead) list.push(G.entities[i]);
  for (let i = 0; i < G.gates.length; i++) list.push(G.gates[i]);
  for (let i = 0; i < G.bullets.length; i++) list.push(G.bullets[i]);
  for (let i = 0; i < G.ebullets.length; i++) list.push(G.ebullets[i]);
  if (G.boss && !G.boss.dying) list.push(G.boss);
  list.sort((a, b) => b.z - a.z);

  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    if (o.kind === 'barrel') drawBarrel(o);
    else if (o.kind === 'enemy') drawEnemy(o);
    else if (o.kind === 'gate') drawGate(o);
    else if (o.kind === 'bullet') drawBullet(o);
    else if (o.kind === 'ebullet') drawEBullet(o);
    else if (o.kind === 'boss') drawBoss(o);
  }

  if (G.boss && G.boss.dying) drawBossDeath();
  drawSquad();

  for (let i = 0; i < G.booms.length; i++) drawBoom(G.booms[i]);
  for (let i = 0; i < G.rings.length; i++) drawRing(G.rings[i]);

  // 파편
  for (let i = 0; i < G.particles.length; i++) {
    const q = G.particles[i];
    const a = Math.max(0, Math.min(1, q.life / q.max));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(q.sx, q.sy);
    ctx.rotate(q.rot);
    ctx.fillStyle = q.color;
    ctx.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * q.sq);
    ctx.restore();
  }
  // 탄피
  for (let i = 0; i < G.casings.length; i++) {
    const c = G.casings[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, c.life / c.max));
    ctx.translate(c.sx, c.sy);
    ctx.rotate(c.rot);
    ctx.fillStyle = '#e8c05a';
    ctx.fillRect(-2, -1, 4, 2.2);
    ctx.restore();
  }
  // 보상 비행체
  for (let i = 0; i < G.flyers.length; i++) {
    const f = G.flyers[i];
    const pos = flyerPos(f);
    const spin = Math.abs(Math.cos(f.spin * 1.4));
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(Math.max(0.3, spin), 1);
    const tier = f.rew === 'jeep' ? 3 : f.rew === 'bike' ? 2 : f.rew === 'heavy' ? 1 : 0;
    drawUnitTier(tier, 0, 0, pos.sc * 0.78, { ph: f.spin, muzzle: 0, recoil: 0 });
    ctx.restore();
    // 빛무리
    const g = ctx.createRadialGradient(pos.x, pos.y - 20 * pos.sc, 0, pos.x, pos.y - 20 * pos.sc, 34 * pos.sc);
    g.addColorStop(0, 'rgba(255,245,200,0.35)');
    g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pos.x, pos.y - 20 * pos.sc, 34 * pos.sc, 0, 6.2832); ctx.fill();
  }

  // 숫자 팝업
  for (let i = 0; i < G.popups.length; i++) {
    const p = G.popups[i];
    const a = Math.min(1, (p.life / p.max) * 1.8);
    ctx.globalAlpha = a;
    txt(p.text, p.sx, p.sy, p.size, p.color, 'center', '900', 'rgba(0,0,0,0.62)', Math.max(2, p.size * 0.17));
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 비네트
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.30, W / 2, H * 0.55, H * 0.80);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.36)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,70,55,' + (G.flash * 0.30) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (G.hurtT > 0.01) {
    const hg = ctx.createRadialGradient(W / 2, H * 0.72, H * 0.12, W / 2, H * 0.72, H * 0.72);
    hg.addColorStop(0, 'rgba(220,40,30,0)');
    hg.addColorStop(1, 'rgba(220,40,30,' + (G.hurtT * 0.42) + ')');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();

  if (G.phase === 'start') drawStart();
  else if (G.phase === 'dead' || G.phase === 'clear') drawEnd();
  else buttons.length = 0;
}

function drawBossDeath() {
  const b = G.boss;
  const t = 1 - b.dieT / 1.8;
  const p = project(b.z);
  const x = CX + bend(b.z) + b.x * p.hw;
  const s = p.s;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - t);
  const r = (70 + t * 170) * s;
  const g = ctx.createRadialGradient(x, p.y - 110 * s, 0, x, p.y - 110 * s, r);
  g.addColorStop(0, 'rgba(255,255,220,0.95)');
  g.addColorStop(0.4, 'rgba(255,180,60,0.7)');
  g.addColorStop(1, 'rgba(255,90,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, p.y - 110 * s, r, 0, 6.2832); ctx.fill();
  ctx.restore();
}

/* =====================================================================
   HUD — 최소한만
   ===================================================================== */
let muteBtn = null;

function drawHUD() {
  if (G.phase === 'start') return;

  // 진행 헤어라인
  const prog = clamp(G.dist / CFG.bossAt, 0, 1);
  ctx.fillStyle = 'rgba(8,14,22,0.30)';
  ctx.fillRect(0, 0, W, 2.5);
  const pg = ctx.createLinearGradient(0, 0, W, 0);
  pg.addColorStop(0, 'rgba(60,190,255,0.9)');
  pg.addColorStop(1, 'rgba(255,210,77,0.95)');
  ctx.fillStyle = pg;
  ctx.fillRect(0, 0, W * prog, 2.5);

  // 좌측 알약: STAGE + 티어 점
  const n = G.slots.length;
  ctx.font = '800 9.5px ' + FONT;
  const stw = ctx.measureText('STAGE ' + G.stage).width;
  const pw = 16 + stw + 7 + n * 9;
  ctx.fillStyle = 'rgba(9,17,27,0.34)';
  rr(9, 9, pw, 20, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(150,215,255,0.20)';
  ctx.lineWidth = 1;
  rr(9, 9, pw, 20, 10); ctx.stroke();
  txt('STAGE ' + G.stage, 17, 19.5, 9.5, 'rgba(210,238,255,0.90)', 'left', '800');
  for (let i = 0; i < n; i++) {
    const cx2 = 17 + stw + 7 + i * 9 + 3;
    ctx.fillStyle = TIER[G.slots[i].tier].col;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(cx2, 19.5, 3, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 우측 알약: 점수
  const scoreStr = Math.round(G.score).toLocaleString('en-US');
  ctx.font = '800 11px ' + FONT;
  const sw = ctx.measureText(scoreStr).width;
  ctx.fillStyle = 'rgba(9,17,27,0.34)';
  rr(W - 9 - sw - 18, 9, sw + 18, 20, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(150,215,255,0.20)';
  rr(W - 9 - sw - 18, 9, sw + 18, 20, 10); ctx.stroke();
  txt(scoreStr, W - 18, 19.5, 11, 'rgba(235,248,255,0.95)', 'right', '800');

  // 보스 HP (얇게)
  const b = G.boss;
  if (b && !b.dying) {
    const bx = 15, by = 34, bw = W - 30, bh = 5;
    ctx.fillStyle = 'rgba(9,17,27,0.42)';
    rr(bx, by, bw, bh, 2.5); ctx.fill();
    const frac = Math.max(0, b.hp / b.maxhp);
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#ff5f45');
    hg.addColorStop(1, '#ffb03a');
    ctx.fillStyle = hg;
    rr(bx, by, Math.max(2, bw * frac), bh, 2.5); ctx.fill();
    txt('BOSS', bx + 1, by + bh + 7, 7.5, 'rgba(255,190,160,0.8)', 'left', '800');
  }

  // 게이트 결과
  if (G.gateText) {
    const a = Math.min(1, G.gateT / 0.45);
    ctx.globalAlpha = a;
    const t = G.gateText;
    const yy = H * 0.335;
    txt(t.text, W / 2, yy, Math.min(40, W * 0.098), t.good ? '#8ff0c8' : '#ff6b6b', 'center', '900', 'rgba(0,0,0,0.66)', 6);
    txt(t.sub, W / 2, yy + 28, 12.5, 'rgba(255,255,255,0.92)', 'center', '800', 'rgba(0,0,0,0.55)', 3);
    ctx.globalAlpha = 1;
  }

  // 배너
  if (G.banner) {
    const bt = G.banner;
    const k = Math.min(1, (2.2 - bt.t) * 6);
    ctx.save();
    ctx.globalAlpha = Math.min(1, bt.t * 2);
    ctx.translate(W / 2, H * 0.245);
    ctx.scale(0.74 + 0.26 * k, 0.74 + 0.26 * k);
    txt(bt.text, 0, 0, Math.min(30, W * 0.076), bt.color || '#fff', 'center', '900', 'rgba(0,0,0,0.68)', 5);
    if (bt.sub) txt(bt.sub, 0, 25, 12, 'rgba(255,255,255,0.92)', 'center', '700', 'rgba(0,0,0,0.55)', 3);
    ctx.restore();
  }

  // 드래그 힌트
  if (G.phase === 'playing' && G.hint > 0.01) {
    ctx.globalAlpha = G.hint * (0.5 + 0.45 * Math.sin(G.t * 5));
    txt('◀   드래그로 이동   ▶', W / 2, H * 0.965, 13, '#ffffff', 'center', '800', 'rgba(0,0,0,0.5)', 3.5);
    ctx.globalAlpha = 1;
  }

  drawMuteBtn();
}

function drawMuteBtn() {
  const s = 26, x = W - s - 10, y = H - s - 10;
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = 'rgba(9,17,27,0.7)';
  rr(x, y, s, s, 8); ctx.fill();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#cfe6f7';
  if (muted) {
    ctx.fillRect(x + 8, y + 10, 4, 7);
    ctx.fillRect(x + 12, y + 8, 2.5, 11);
    ctx.strokeStyle = '#ff8a7a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 17, y + 9); ctx.lineTo(x + 21, y + 17);
    ctx.moveTo(x + 21, y + 9); ctx.lineTo(x + 17, y + 17);
    ctx.stroke();
  } else {
    ctx.fillRect(x + 7, y + 10, 4, 7);
    ctx.beginPath();
    ctx.moveTo(x + 11, y + 8); ctx.lineTo(x + 17, y + 5); ctx.lineTo(x + 17, y + 21); ctx.lineTo(x + 11, y + 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#cfe6f7';
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(x + 18, y + 13, 4.4, -0.8, 0.8); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  muteBtn = { x: x, y: y, w: s, h: s };
}

/* =====================================================================
   overlays
   ===================================================================== */
function drawStart() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(5,10,18,0.80)');
  g.addColorStop(0.26, 'rgba(5,10,18,0.40)');
  g.addColorStop(0.55, 'rgba(5,10,18,0.30)');
  g.addColorStop(0.82, 'rgba(5,10,18,0.62)');
  g.addColorStop(1, 'rgba(5,10,18,0.80)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const ty = H * 0.115;
  txt('NUMBER ROAD', CX, ty, 10.5, 'rgba(150,215,255,0.85)', 'center', '800');
  txt('넘버로드 v3', CX, ty + 40, Math.min(44, W * 0.112), '#ffffff', 'center', '900', 'rgba(0,0,0,0.55)', 7);
  txt('1줄 진화 슈터', CX, ty + 74, 13, '#ffd24d', 'center', '800', 'rgba(0,0,0,0.5)', 3);

  // 티어 사다리
  const ladderY = H * 0.40;
  const xs = [W * 0.17, W * 0.39, W * 0.61, W * 0.83];
  const tiers = [0, 1, 2, 3];
  const names = ['소총병', '형님', '바이크', '지프'];
  ctx.fillStyle = 'rgba(7,13,22,0.74)';
  rr(W * 0.07, ladderY - 68, W * 0.86, 110, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(110,190,255,0.24)';
  ctx.lineWidth = 1.2;
  rr(W * 0.07, ladderY - 68, W * 0.86, 110, 14); ctx.stroke();

  for (let i = 0; i < 4; i++) {
    drawUnitTier(tiers[i], xs[i], ladderY + 16, 0.72, { ph: G.t * 4 + i, muzzle: 0, recoil: 0 });
    txt(names[i], xs[i], ladderY + 31, 10, TIER[tiers[i]].col, 'center', '800');
    if (i < 3) {
      txt('›', (xs[i] + xs[i + 1]) / 2, ladderY - 4, 17, 'rgba(180,225,255,0.75)', 'center', '900');
    }
  }

  txt('통을 깨면 병사가 상위 클래스로 진화', CX, ladderY + 60, 13, '#ffffff', 'center', '800', 'rgba(0,0,0,0.5)', 3);
  txt('최대 5기 · 증식 없음 · 화면은 시원하게', CX, ladderY + 82, 11.5, 'rgba(200,225,245,0.82)', 'center', '600');

  // 시작 버튼
  const bw = Math.min(280, W - 76), bh = 58;
  const bx = CX - bw / 2, by = H * 0.60;
  const bg = ctx.createLinearGradient(bx, by, bx, by + bh);
  bg.addColorStop(0, '#37c2ff');
  bg.addColorStop(1, '#1478e0');
  ctx.fillStyle = bg;
  rr(bx, by, bw, bh, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(180,240,255,0.75)';
  ctx.lineWidth = 2;
  rr(bx, by, bw, bh, 16); ctx.stroke();
  txt('터치해서 시작', CX, by + bh / 2 + 1, 20, '#ffffff', 'center', '900', 'rgba(0,0,0,0.25)', 3);
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 3);
  ctx.globalAlpha = 0.28 + pulse * 0.32;
  ctx.strokeStyle = '#8fe6ff';
  ctx.lineWidth = 2;
  rr(bx - 6, by - 6, bw + 12, bh + 12, 20); ctx.stroke();
  ctx.globalAlpha = 1;

  txt('사운드 ' + (muted ? 'OFF' : 'ON') + '  ·  좌우 드래그 이동 · 사격 자동', CX, H * 0.672, 10.5, 'rgba(200,220,240,0.65)', 'center', '600');
  txt('막판에 거대 보스가 기다린다', CX, H * 0.706, 11, 'rgba(255,200,120,0.9)', 'center', '700');

  buttons.length = 0;
  buttons.push({ x: bx, y: by, w: bw, h: bh, act: function () { startRun(1); } });
  buttons.push({ x: CX - 120, y: H * 0.656, w: 240, h: 30, act: function () { muted = !muted; } });
}

function drawEnd() {
  ctx.fillStyle = 'rgba(4,8,16,0.86)';
  ctx.fillRect(0, 0, W, H);
  const win = G.phase === 'clear';
  const ty = H * 0.22;

  if (win) {
    txt('STAGE ' + G.stage + ' CLEAR', CX, ty, 12, '#8fe6ff', 'center', '800');
    txt('보스 격파!', CX, ty + 46, Math.min(48, W * 0.13), '#ffd24d', 'center', '900', 'rgba(0,0,0,0.6)', 7);
  } else {
    txt('GAME OVER', CX, ty + 8, Math.min(42, W * 0.112), '#ff6b6b', 'center', '900', 'rgba(0,0,0,0.6)', 7);
    txt('1줄이 모두 쓰러졌다', CX, ty + 48, 13, 'rgba(230,240,250,0.9)', 'center', '700');
  }

  const cardW = Math.min(W - 56, 320);
  const cy = H * 0.37;
  ctx.fillStyle = 'rgba(12,20,32,0.97)';
  rr(CX - cardW / 2, cy, cardW, 118, 16); ctx.fill();
  ctx.strokeStyle = win ? 'rgba(255,210,77,0.45)' : 'rgba(255,107,107,0.35)';
  ctx.lineWidth = 1.4;
  rr(CX - cardW / 2, cy, cardW, 118, 16); ctx.stroke();

  const stat = function (label, val, y) {
    txt(label, CX - 74, y, 11.5, 'rgba(190,215,235,0.8)', 'left', '700');
    txt(val, CX + 88, y, 17, '#ffffff', 'right', '900');
  };
  stat('점수', Math.round(G.score).toLocaleString('en-US'), cy + 30);
  stat('1줄 편성', G.slots.length + '기 · ' + TIER[G.slots[G.slots.length - 1].tier].short + ' 외', cy + 62);
  stat('격파', G.kills + '명', cy + 94);

  buttons.length = 0;
  if (win) {
    const bw = Math.min(140, (W - 80) / 2), bh = 54, gap = 12;
    const bx1 = CX - bw - gap / 2, bx2 = CX + gap / 2, by = H * 0.58;
    const g1 = ctx.createLinearGradient(0, by, 0, by + bh);
    g1.addColorStop(0, '#37c2ff'); g1.addColorStop(1, '#1478e0');
    ctx.fillStyle = g1;
    rr(bx1, by, bw, bh, 14); ctx.fill();
    txt('다음 스테이지', bx1 + bw / 2, by + bh / 2, 14, '#fff', 'center', '900');
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(bx2, by, bw, bh, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.6;
    rr(bx2, by, bw, bh, 14); ctx.stroke();
    txt('다시 시작', bx2 + bw / 2, by + bh / 2, 14, '#fff', 'center', '900');
    buttons.push({ x: bx1, y: by, w: bw, h: bh, act: function () { startRun(G.stage + 1); } });
    buttons.push({ x: bx2, y: by, w: bw, h: bh, act: function () { startRun(1); } });
  } else {
    const bw = Math.min(260, W - 96), bh = 56;
    const bx = CX - bw / 2, by = H * 0.58;
    const g1 = ctx.createLinearGradient(0, by, 0, by + bh);
    g1.addColorStop(0, '#ff7a5c'); g1.addColorStop(1, '#e0442c');
    ctx.fillStyle = g1;
    rr(bx, by, bw, bh, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,180,0.7)';
    ctx.lineWidth = 2;
    rr(bx, by, bw, bh, 14); ctx.stroke();
    txt('다시 시작', CX, by + bh / 2 + 1, 19, '#fff', 'center', '900');
    buttons.push({ x: bx, y: by, w: bw, h: bh, act: function () { startRun(1); } });
    txt('화면을 눌러도 다시 시작', CX, H * 0.68, 11, 'rgba(200,220,240,0.55)', 'center', '600');
  }
}

/* =====================================================================
   input / loop
   ===================================================================== */
function setTargetFromPointer(clientX) {
  const p = project(Z_UNIT);
  const nx = (clientX - CX - bend(Z_UNIT)) / Math.max(30, p.hw);
  G.targetX = clamp(nx, -0.95, 0.95);
  if (!G.hintUsed) { G.hintUsed = true; G.hint = Math.min(G.hint, 0.35); }
}

function onDown(e) {
  e.preventDefault();
  initAudio();
  const x = e.clientX, y = e.clientY;

  if (muteBtn && x >= muteBtn.x && x <= muteBtn.x + muteBtn.w && y >= muteBtn.y && y <= muteBtn.y + muteBtn.h) {
    muted = !muted;
    return;
  }
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.act(); return; }
  }
  if (G.phase === 'start') { startRun(1); return; }
  if (G.phase === 'dead') { startRun(1); return; }
  if (G.phase === 'clear') return;
  G.dragging = true;
  setTargetFromPointer(x);
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
}
function onMove(e) {
  if (!G || !G.dragging || G.phase !== 'playing') return;
  e.preventDefault();
  setTargetFromPointer(e.clientX);
}
function onUp() { if (G) G.dragging = false; }

canvas.addEventListener('pointerdown', onDown, { passive: false });
canvas.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', function (e) {
  if (!G || G.phase !== 'playing') return;
  if (e.key === 'ArrowLeft') { G.targetX = clamp(G.targetX - 0.12, -0.95, 0.95); e.preventDefault(); }
  if (e.key === 'ArrowRight') { G.targetX = clamp(G.targetX + 0.12, -0.95, 0.95); e.preventDefault(); }
});
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

function startRun(stage) {
  resetRun(stage, 'playing');
  initAudio();
  G.hint = 1;
  G.hintUsed = false;
}

let last = 0;
function loop(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  if (!TEST_FREEZE) update(dt);
  render();
  requestAnimationFrame(loop);
}

function decorateStart() {
  for (let i = 0; i < 9; i++) {
    G.entities.push(mkEnemy(-0.7 + (i % 3) * 0.7, 120 + Math.floor(i / 3) * 4, 40));
  }
}

resize();
resetRun(1, 'start');
decorateStart();
window.addEventListener('resize', function () { resize(); });
requestAnimationFrame(loop);

/* =====================================================================
   test hooks (헤드리스 검증용)
   ===================================================================== */
window.__game = {
  freeze: function (v) { TEST_FREEZE = v !== false; },
  step: function (sec, dt) {
    const st = dt || 1 / 60;
    const n = Math.round(sec / st);
    for (let i = 0; i < n; i++) update(st);
    render();
  },
  start: function (stage) { startRun(stage || 1); render(); },
  startScreen: function () { resetRun(1, 'start'); decorateStart(); render(); },
  setX: function (x) { G.targetX = x; G.playerX = x; },
  setSlots: function (arr) {
    G.slots = arr.map(function (t) { return mkSlot(t); });
    render();
  },
  give: function (rew) { grantReward(rew); render(); },
  breakNearest: function () {
    let best = null;
    for (let i = 0; i < G.entities.length; i++) {
      const e = G.entities[i];
      if (e.kind === 'barrel' && !e.dead && (!best || e.z < best.z)) best = e;
    }
    if (best) { best.hp = 0; best.dead = true; breakBarrel(best); }
    render();
  },
  spawnWave: function (n, z) { spawnWave(n || 12, z || 110); render(); },
  clearEnts: function () { G.entities.length = 0; G.gates.length = 0; G.bullets.length = 0; G.flyers.length = 0; render(); },
  addBarrel: function (rew, x, z, hp) {
    G.entities.push(mkBarrel(x, hp || 500, z, rew || null));
    render();
  },
  skipToBoss: function () {
    G.dist = CFG.bossAt;
    G.scriptIdx = SCRIPT.length;
    G.entities.length = 0;
    G.gates.length = 0;
    update(0.0001);
    render();
  },
  state: function () {
    return {
      phase: G.phase, stage: G.stage,
      slots: G.slots.map(function (s) { return s.tier; }),
      power: +G.power.toFixed(2),
      score: Math.round(G.score), kills: G.kills,
      dist: Math.round(G.dist),
      entities: G.entities.length,
      barrels: G.entities.filter(function (e) { return e.kind === 'barrel'; }).length,
      enemies: G.entities.filter(function (e) { return e.kind === 'enemy'; }).length,
      gates: G.gates.length,
      boss: G.boss ? { hp: Math.round(G.boss.hp), maxhp: G.boss.maxhp, z: +G.boss.z.toFixed(1) } : null,
      bullets: G.bullets.length, ebullets: G.ebullets.length,
      particles: G.particles.length, flyers: G.flyers.length,
      px: +G.playerX.toFixed(2)
    };
  },
  /* 똑똑한 자동 플레이: 목표 추적 + 적탄 회피 */
  autoSmart: function (sec) {
    const st = 1 / 60;
    const n = Math.round((sec || 1) / st);
    for (let i = 0; i < n; i++) {
      let tx = G.targetX;
      let best = 1e9;
      for (let k = 0; k < G.entities.length; k++) {
        const e = G.entities[k];
        if (e.dead) continue;
        const wt = e.kind === 'barrel' ? e.z * 0.55 : e.z;
        if (wt < best && e.z > 6) { best = wt; tx = e.x; }
      }
      const b = G.boss;
      if (b && !b.dying && best > 60) tx = b.x;
      // 적탄 회피
      for (let k = 0; k < G.ebullets.length; k++) {
        const eb = G.ebullets[k];
        if (eb.z < 30 && Math.abs(eb.x - tx) < 0.26) {
          tx = eb.x + (tx >= eb.x ? 0.30 : -0.30);
          break;
        }
      }
      G.targetX = tx;
      update(st);
    }
    render();
  },
  /* 자동 플레이: 가장 가까운 보상을 향해 이동 */
  auto: function (sec) {
    const st = 1 / 60;
    const n = Math.round((sec || 1) / st);
    for (let i = 0; i < n; i++) {
      let tx = G.targetX;
      let best = 1e9;
      for (let k = 0; k < G.entities.length; k++) {
        const e = G.entities[k];
        if (e.dead) continue;
        if (e.z < best && e.z > 6) { best = e.z; tx = e.x; }
      }
      const b = G.boss;
      if (b && !b.dying) tx = b.x;
      G.targetX = tx;
      update(st);
    }
    render();
  }
};
})();
</script>
</body>
</html>
