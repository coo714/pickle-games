/* =========================================================
   넘버로드 (NUMBER ROAD)
   - 완전 오프라인 단일 파일 / 외부 이미지·CDN 없음
   - Canvas 2D + WebAudio 합성음
   ========================================================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* ---------------- layout / projection ---------------- */
let W = 390, H = 844, DPR = 1;
let HORIZON = 0, PLAYER_Y = 0, ROAD_HALF = 190, CX = 195;

const Z_SPAWN = 90;
const Z_K = 0.030;

function resize() {
  W = Math.max(300, Math.round(window.innerWidth));
  H = Math.max(460, Math.round(window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HORIZON = Math.round(H * 0.205);
  PLAYER_Y = Math.round(H * 0.852);
  ROAD_HALF = Math.min(W * 0.455, 250);
  CX = W / 2;
}

function project(z) {
  const zz = z < 0 ? z : z;
  const s = 1 / (1 + zz * Z_K);
  return { s, y: HORIZON + (PLAYER_Y - HORIZON) * s, hw: ROAD_HALF * s };
}

function bend(z) {
  const k = Math.max(0, Math.min(1, z / Z_SPAWN));
  const ph = (G ? G.dist : 0) * 0.0105;
  return Math.sin(ph + z * 0.016 - 0.9) * W * 0.052 * k * k;
}

/* ---------------- tiny helpers ---------------- */
function rr(x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
const FONT = '"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
function txt(s, x, y, size, color, align, weight, stroke, lw) {
  ctx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = lw || Math.max(2, size * 0.14);
    ctx.strokeStyle = stroke;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ---------------- audio ---------------- */
let AC = null, master = null, noiseBuf = null, muted = false, lastShot = 0, lastPunch = 0;

function initAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = 0.55;
      master.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * 0.4);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* audio is optional */ }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq, q, delay) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    const f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(Math.max(0.001, vol), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  } catch (e) {}
}

const sfx = {
  shoot() {
    if (!AC || muted) return;
    const now = AC.currentTime;
    if (now - lastShot < 0.055) return;
    lastShot = now;
    tone(1500, 620, 0.05, 'square', 0.045);
    noiseBurst(0.035, 0.05, 2600, 2.5);
  },
  hit() { noiseBurst(0.05, 0.05, 1500, 3); },
  /* 묵직한 저음 타격음(총성 + 둔탁한 펀치) */
  punch(power) {
    if (!AC || muted) return;
    const now = AC.currentTime;
    if (now - lastPunch < 0.045) return;
    lastPunch = now;
    const v = (power || 1) * 0.16;
    try {
      const o = AC.createOscillator();
      const g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(190, now);
      o.frequency.exponentialRampToValueAtTime(46, now + 0.1);
      g.gain.setValueAtTime(Math.max(0.001, v), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + 0.15);
    } catch (e) {}
    noiseBurst(0.055, 0.06 * (power || 1), 520, 0.9);
    noiseBurst(0.03, 0.05 * (power || 1), 2400, 2.0);
  },
  breakCrate(big) {
    noiseBurst(0.34, big ? 0.34 : 0.26, 720, 0.7);
    tone(220, 52, 0.34, 'sawtooth', big ? 0.2 : 0.14);
    tone(900, 220, 0.13, 'square', 0.07, 0.01);
    noiseBurst(0.22, 0.16, 220, 0.6, 0.02);
  },
  join() {
    tone(196, 392, 0.16, 'sawtooth', 0.16);
    tone(392, 784, 0.22, 'square', 0.1, 0.1);
    tone(98, 60, 0.5, 'sine', 0.22, 0.02);
    noiseBurst(0.3, 0.16, 380, 0.7, 0.05);
  },
  evolve() {
    [262, 330, 392, 523].forEach((f, i) => tone(f, f * 1.02, 0.2, 'sawtooth', 0.12, i * 0.07));
    tone(70, 40, 0.7, 'sine', 0.26);
    noiseBurst(0.5, 0.2, 300, 0.6);
  },
  barrel() {
    noiseBurst(0.34, 0.26, 620, 0.8);
    tone(300, 65, 0.34, 'sawtooth', 0.13);
    tone(760, 200, 0.16, 'square', 0.07, 0.02);
  },
  gate() {
    tone(520, 520, 0.09, 'sine', 0.16);
    tone(680, 680, 0.09, 'sine', 0.15, 0.085);
    tone(900, 900, 0.16, 'sine', 0.16, 0.17);
  },
  hurt() {
    tone(190, 55, 0.24, 'triangle', 0.2);
    noiseBurst(0.2, 0.14, 320, 1);
  },
  bossIn() {
    tone(95, 42, 0.9, 'sawtooth', 0.22);
    noiseBurst(0.7, 0.22, 240, 1);
  },
  bossHit() { tone(130, 62, 0.06, 'square', 0.06); },
  win() {
    [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.24, 'triangle', 0.17, i * 0.13));
  },
  lose() {
    [400, 330, 260, 180].forEach((f, i) => tone(f, f * 0.85, 0.26, 'sawtooth', 0.14, i * 0.14));
  }
};

/* ---------------- config ---------------- */

const SCRIPT = [

SCRIPT.sort((a, b) => a.at - b.at);

/* ---------------- game state ---------------- */
let G = null;
let buttons = [];
let TEST_FREEZE = false;

function emptyState() {
  return {
    phase: 'start',
    stage: 1,
    log: [],
    t: 0, dist: 0, scrollZ: 0,
    units: 3, power: 1, score: 0, kills: 0,
    playerX: 0, targetX: 0,
    fireT: 0, muzzle: 0, unitPulse: 0,
    bullets: [], ebullets: [], entities: [], gates: [],
    popups: [], particles: [], booms: [],
    heavies: [], bikes: [], trucks: [],
    shake: 0, flash: 0, banner: null,
    hint: 1, hintUsed: false, dragging: false,
    boss: null, bossSpawned: false, scriptIdx: 0,
    enemyMul: 1, barrelMul: 1, bossMul: 1,
    lastGateText: null, lastGateT: 0,
    endT: 0
  };
}

function resetRun(stage, phase) {
  const st = stage || 1;
  G = emptyState();
  G.stage = st;
  G.enemyMul = 1 + (st - 1) * 0.45;
  G.barrelMul = 1 + (st - 1) * 0.55;
  G.bossMul = 1 + (st - 1) * 0.9;
  G.units = 3;
  G.phase = phase || 'playing';
  if (G.phase === 'start') {
    decorateStart();
  } else {
    G.banner = { text: 'STAGE ' + st, sub: '3명으로 시작!', t: 1.6, color: '#6fe0ff' };
  }
}

function decorateStart() {
  G.playerX = G.targetX = 0;
}

function mkBarrel(x, hp, z, sp) {
  return { kind: 'barrel', sp: sp || null, x, z, hp, maxhp: hp, w: sp ? 0.335 : 0.30,
    hitT: 0, flashT: 0, dmgAcc: 0, popT: 0, seed: Math.random() * 9 };
}
function mkEnemy(x, z, hp) {
  return { kind: 'enemy', x, z, hp, maxhp: hp, w: 0.095, hitT: 0, dmgAcc: 0, popT: 0, ph: Math.random() * 6.28, fireT: rand(1.0, 2.4), dead: false };
}

/* ---------------- spawning ---------------- */
function runScript() {
  while (G.scriptIdx < SCRIPT.length && G.dist >= SCRIPT[G.scriptIdx].at) {
    spawnEncounter(SCRIPT[G.scriptIdx++]);
  }
}
function spawnEncounter(s) {
  const z0 = s.z || Z_SPAWN;
  if (s.type === 'barrel') {
    G.entities.push(mkBarrel(s.x, Math.round(s.hp * G.barrelMul), Math.min(z0, Z_SPAWN), s.sp));
  } else if (s.type === 'enemy') {
    const rows = s.n >= 8 ? 3 : s.n >= 5 ? 2 : 1;
    const cols = Math.ceil(s.n / rows);
    for (let i = 0; i < s.n; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const t = cols === 1 ? 0.5 : c / (cols - 1);
      const x = -0.76 + 1.52 * t + (Math.random() - 0.5) * 0.05;
      G.entities.push(mkEnemy(x, Math.min(s.z || Z_SPAWN, Z_SPAWN) + r * 5.5 + Math.random() * 2.5, Math.round(20 * G.enemyMul)));
    }
  } else if (s.type === 'gate') {
    G.gates.push({ kind: 'gate', z: z0, left: s.left, right: s.right, applied: false, flash: 0 });
  }
}

/* ---------------- squad formation ---------------- */
function formation(n) {
  // 큼직한 병사가 겹치지 않게 3~6열 종대로 배치
  const cols = Math.min(6, Math.max(3, Math.ceil(Math.sqrt(n * 1.3))));
  const sp = Math.min(0.195, 1.0 / cols);
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const cnt = Math.min(cols, n - r * cols);
    out.push({ dx: (c - (cnt - 1) / 2) * sp + Math.sin(i * 7.13) * 0.012, dz: 1.95 + r * 1.75, ph: i * 0.85, row: r, col: c, jy: Math.sin(i * 3.71) * 3 });
  }
  return { list: out, half: ((cols - 1) / 2) * sp, cols };
}

function clampPlayerX() {
  const f = formation(Math.max(1, G.units));
  const lim = Math.max(0.12, 0.885 - f.half);
  G.targetX = clamp(G.targetX, -lim, lim);
  G.playerX = clamp(G.playerX, -lim, lim);
}

/* ---------------- damage / fx ---------------- */
function addPopup(x, z, text, color, size, big, lift) {
  const p = project(Math.max(z, 0));
  G.popups.push({
    sx: CX + bend(Math.max(z, 0)) + x * p.hw + rand(-13, 13),
    sy: p.y - (lift || 34) * p.s - (big ? 26 : 0) + rand(-7, 5),
    text, color, life: big ? 1.15 : 0.78, max: big ? 1.15 : 0.78,
    size: size || Math.max(13, 26 * p.s)
  });
}
function addParticles(sx, sy, n, colorArr, spread, spd, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = rand(spd * 0.35, spd);
    G.particles.push({
      sx, sy,
      vx: Math.cos(a) * v * spread,
      vy: Math.sin(a) * v - rand(20, 90),
      life: rand(0.35, 0.8), max: 0.8,
      size: rand(size * 0.5, size),
      color: colorArr[(Math.random() * colorArr.length) | 0],
      rot: Math.random() * 6.28,
      vr: rand(-9, 9)
    });
  }
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* 폭발 링 이펙트 */
function addBoom(sx, sy, sc, big) {
  G.booms.push({ sx, sy, t: 0, life: big ? 0.62 : 0.44, sc: Math.max(0.45, sc || 1), big: !!big });
}

function showBanner(text, sub, color, t, icon) {
  G.banner = { text, sub, t: t || 1.9, color: color || '#fff', icon: icon || null };
}

function hasSpecials() {
  return G.heavies.length + G.bikes.length + G.trucks.length > 0;
}

/* ---------------- 특수 유닛 배치 / 합류 ---------------- */
function layoutSpecials() {
  const hv = G.heavies, bk = G.bikes, tk = G.trucks;
  for (let i = 0; i < hv.length; i++) {
    if (hv.length === 1) {
      hv[i].row = 1;
      hv[i].dx = 0;
    } else {
      hv[i].row = 2;
      hv[i].dx = (i - (hv.length - 1) / 2) * 0.44;
    }
    hv[i].dz = 3.2;
  }
  for (let i = 0; i < bk.length; i++) {
    bk[i].row = 0;
    bk[i].dx = (i % 2 ? 0.82 : -0.82);
    bk[i].dz = 2.0;
  }
  for (let i = 0; i < tk.length; i++) {
    tk[i].row = 0;
    tk[i].dx = (i % 2 ? -0.64 : 0.64);
    tk[i].dz = 2.2;
  }
}

function spawnSpecial(kind, x, z) {
  if (kind === 'heavy') {
    G.heavies.push({ ph: Math.random() * 6.28, fireT: 0.2 + Math.random() * 0.3, muzzle: 0, spin: 0, row: 1, dx: 0, dz: 3.2 });
    layoutSpecials();
    showBanner('헤비 형님 합류!', '미니건 연사 · 화력 급상승', '#ffb03a', 2.1, '🔥');
    addPopup(x === undefined ? 0 : x, (z || 8) + 4, '+1 형님', '#ffd76a', 30, true, 170);
    sfx.join();
    vibrate([25, 18, 60]);
    shakeIt(16);
    G.unitPulse = 0.7;
  } else if (kind === 'bike') {
    G.bikes.push({ ph: Math.random() * 6.28, fireT: 0.15 + Math.random() * 0.2, muzzle: 0, row: 0, dx: 0, dz: 2.0 });
    layoutSpecials();
    if (G.bikes.length >= 3) {
      evolveTruck(x, z);
    } else {
      showBanner('오토바이 돌격!', '질주하며 쌍연사', '#7ef0ff', 1.9, '🏍️');
      addPopup(x === undefined ? 0 : x, (z || 8) + 4, '+1 라이더', '#9fe8ff', 28, true, 170);
      sfx.join();
      vibrate([18, 12, 40]);
      shakeIt(13);
      G.unitPulse = 0.6;
    }
  } else if (kind === 'weapon') {
    G.power = Math.min(3.4, G.power + 0.35);
    G.units = Math.min(CFG.maxUnits, G.units + 3);
    showBanner('중화기 상자 개방!', '공격력 +35% · 병력 +3', '#ff8a4c', 1.9, '💥');
    addPopup(x === undefined ? 0 : x, (z || 8) + 4, '공격력 UP', '#ffb07a', 26, true, 170);
    sfx.join();
    vibrate([22, 14, 45]);
    shakeIt(14);
    G.unitPulse = 0.6;
  }
}

function evolveTruck(x, z) {
  G.bikes.length = 0;
  G.trucks.push({ ph: 0, fireT: 0.4, muzzle: 0, row: 0, dx: 0, dz: 2.2 });
  layoutSpecials();
  showBanner('무장 지프 진화!', '오토바이 3대 → 중화기 탑재 차량', '#ffd24d', 2.4, '🚙');
  addPopup(x === undefined ? 0 : x, (z || 8) + 4, '+1 무장차', '#ffd24d', 30, true, 180);
  sfx.evolve();
  vibrate([30, 20, 25, 20, 70]);
  shakeIt(22);
  G.flash = Math.max(G.flash, 0.35);
  G.unitPulse = 0.8;
}

function shakeIt(v) { G.shake = Math.max(G.shake, v); }

function damageEntity(e, amt, bx) {
  if (!e || e.dead) return;
  e.hp -= amt;
  e.hitT = 0.10;
  e.flashT = 0.05;
  e.dmgAcc += amt;
  G.score += amt * 0.35;

  // 타격 지점 스파크 + 나무 파편
  const pz = Math.max(e.z, 0);
  if (Math.random() < 0.6) {
    const p = project(pz);
    const sx = CX + bend(pz) + (bx === undefined ? e.x : bx) * p.hw;
    const sy = p.y - (e.kind === 'barrel' ? 50 : 34) * p.s;
    addParticles(sx, sy, e.kind === 'barrel' ? 4 : 3,
      e.kind === 'barrel' ? ['#ffe9b0', '#ffffff', '#d0954c', '#8a5522'] : ['#ffd0a0', '#ffffff', '#ff8a5a'],
      1.5, 260, 5.5 * Math.max(0.5, p.s));
  }
  sfx.punch(1);

  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    const p = project(pz);
    const sx = CX + bend(pz) + e.x * p.hw;
    if (e.kind === 'barrel') {
      const big = !!e.sp;
      addParticles(sx, p.y - 46 * p.s, big ? 40 : 26, ['#c98a44', '#8a5522', '#e0b070', '#6b3f14', '#ffe9b0'], 1.9, 380, 10 * Math.max(0.4, p.s));
      addBoom(sx, p.y - 48 * p.s, p.s, big);
      G.units = Math.min(CFG.maxUnits, G.units + 4);
      G.power = Math.min(3.4, G.power + 0.10);
      G.score += big ? 900 : 360;
      shakeIt(big ? 18 : 10);
      addPopup(e.x, e.z + 2, '+4 병력', '#7ef0ff', Math.max(15, 24 * p.s), true, 104);
      if (!big) addPopup(e.x, e.z + 7, '💥', '#ffd76a', 30, false, 150);
      sfx.breakCrate(big);
      vibrate(big ? [20, 15, 45] : [12, 8, 20]);
      G.unitPulse = 0.5;
      if (e.sp) spawnSpecial(e.sp, e.x, e.z);
    } else {
      addParticles(sx, p.y - 22 * p.s, 12, ['#e0553a', '#a8231d', '#ffd0a0'], 1.2, 240, 7 * Math.max(0.4, p.s));
      G.kills++;
      G.score += 60;
      noiseBurst(0.08, 0.07, 900, 2);
    }
  }
}

function damageBoss(amt) {
  const b = G.boss;
  if (!b || b.dying) return;
  b.hp -= amt;
  b.hitT = 0.08;
  b.flashT = 0.05;
  b.dmgAcc += amt;
  G.score += amt * 0.35;
  if (Math.random() < 0.25) {
    const p = project(b.z);
    const sx = CX + bend(b.z) + b.x * p.hw + rand(-40, 40) * p.s;
    addParticles(sx, p.y - rand(90, 220) * p.s, 3, ['#ffe9b0', '#ffffff', '#ffb03a'], 1.2, 220, 5 * p.s);
  }
  if (amt > 30) sfx.punch(1.2);
  if (b.hp <= 0) {
    b.hp = 0;
    b.dying = true;
    b.dieT = 1.7;
    shakeIt(20);
    G.flash = 0.5;
    vibrate([0, 40, 30, 40, 90]);
    const p = project(b.z);
    const sx = CX + bend(b.z) + b.x * p.hw;
    addParticles(sx, p.y - 150 * p.s, 60, ['#ffce4d', '#ff7a3d', '#ffffff', '#c8322c'], 2.0, 420, 12);
    addBoom(sx, p.y - 120 * p.s, p.s, true);
    sfx.barrel();
    sfx.win();
  }
}

function loseUnits(n, why) {
  if (G.phase !== 'playing') return;
  if (G.log) G.log.push({ t: +G.t.toFixed(2), n, why: why || '?' });
  if (G.log && G.log.length > 40) G.log.shift();
  G.units = Math.max(0, G.units - n);
  G.flash = Math.max(G.flash, 0.36);
  shakeIt(11);
  vibrate([35, 20, 35]);
  G.unitPulse = -0.4;
  sfx.hurt();
  if (G.units <= 0) {
    if (hasSpecials()) {
      G.units = 1;
      if (!G.saveShown || G.t - G.saveShown > 6) {
        G.saveShown = G.t;
        showBanner('형님이 막아냈다!', '아직 안 죽었다 · 버텨라', '#ffb03a', 1.6);
      }
    } else {
      gameOver();
    }
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  G.t += dt;
  updateEffects(dt);
  if (G.phase !== 'playing') return;

  G.playerX += (G.targetX - G.playerX) * Math.min(1, dt * 15);
  clampPlayerX();

  G.scrollZ += CFG.speed * dt;
  G.dist += CFG.speed * dt;

  runScript();

  if (!G.bossSpawned && G.dist >= CFG.bossAt) {
    G.bossSpawned = true;
    spawnBoss();
  }

  G.fireT -= dt;
  if (G.fireT <= 0 && G.units > 0) {
    G.fireT += 1 / CFG.fireRate;
    fireSalvo();
  }
  if (G.muzzle > 0) G.muzzle -= dt;
  if (G.unitPulse > 0) G.unitPulse = Math.max(0, G.unitPulse - dt * 1.6);
  else if (G.unitPulse < 0) G.unitPulse = Math.min(0, G.unitPulse + dt * 1.6);

  updateBullets(dt);
  updateEntities(dt);
  updateGates(dt);
  updateSpecials(dt);
  updateBoss(dt);
  updateEnemyBullets(dt);

  if (G.hint > 0 && G.t > 7) G.hint = Math.max(0, G.hint - dt * 0.7);
}

function updateEffects(dt) {
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 34);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.6);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (G.lastGateText) { G.lastGateT -= dt; if (G.lastGateT <= 0) G.lastGateText = null; }
  for (let i = G.popups.length - 1; i >= 0; i--) {
    const p = G.popups[i];
    p.life -= dt;
    p.sy -= 46 * dt;
    if (p.life <= 0) G.popups.splice(i, 1);
  }
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.life -= dt;
    q.sx += q.vx * dt;
    q.sy += q.vy * dt;
    q.vy += 520 * dt;
    q.rot += q.vr * dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.booms.length - 1; i >= 0; i--) {
    const b = G.booms[i];
    b.t += dt;
    if (b.t >= b.life) G.booms.splice(i, 1);
  }
}

function pickAim() {
  let aimX = G.playerX;
  let bestZ = 1e9;
  const b = G.boss;
  if (b && !b.dying) { bestZ = b.z; aimX = b.x; }
  for (let i = 0; i < G.entities.length; i++) {
    const e = G.entities[i];
    if (e.dead) continue;
    const dx = e.x - G.playerX;
    if (Math.abs(dx) < 0.34 + e.w * 0.5 && e.z < bestZ) { bestZ = e.z; aimX = e.x; }
  }
  return aimX;
}

function fireSalvo() {
  const n = Math.min(10, Math.max(3, Math.round(G.units * 0.7)));
  const total = (G.units * CFG.dpsPerUnit * G.power) / CFG.fireRate;
  const dmg = total / n;
  const aimX = pickAim();
  const spread = Math.min(0.32, 0.14 + G.units * 0.006);
  // 맨 앞줄 병사 위치에서 발사
  const f = formation(Math.max(1, G.units));
  const front = [];
  for (let i = 0; i < f.list.length; i++) if (f.list[i].row === 0) front.push(f.list[i]);
  if (!front.length) front.push({ dx: 0 });
  for (let i = 0; i < n; i++) {
    const u = front[i % front.length];
    const t = n === 1 ? 0.5 : i / (n - 1);
    const x0 = G.playerX + u.dx + (t - 0.5) * 0.05;
    const x1 = aimX + (t - 0.5) * spread + (Math.random() - 0.5) * 0.02;
    G.bullets.push({ kind: 'bullet', x: x0, x0, x1, z: 2.3 + Math.random() * 0.8, dmg, w: 1 });
  }
  G.muzzle = 0.075;
  sfx.shoot();
}

/* 형님·오토바이·지프의 독립 사격 */
function updateSpecials(dt) {
  fireSpecialGroup(G.heavies, 'heavy', dt);
  fireSpecialGroup(G.bikes, 'bike', dt);
  fireSpecialGroup(G.trucks, 'truck', dt);
}

function fireSpecialGroup(arr, kind, dt) {
  const cfg = SPECIAL[kind];
  for (let i = 0; i < arr.length; i++) {
    const s = arr[i];
    s.ph += dt;
    s.spin = (s.spin || 0) + dt * (kind === 'heavy' ? 30 : kind === 'truck' ? 4 : 16);
    if (s.muzzle > 0) s.muzzle -= dt;
    s.fireT -= dt;
    if (s.fireT <= 0) {
      s.fireT += 1 / cfg.rate;
      fireSpecial(s, kind, cfg);
    }
  }
}

function fireSpecial(s, kind, cfg) {
  const aimX = pickAim();
  const wx = G.playerX + s.dx;
  const fromZ = Math.max(1.5, s.dz - 1.0);
  for (let i = 0; i < cfg.bullets; i++) {
    const off = cfg.bullets === 1 ? 0 : (i - (cfg.bullets - 1) / 2) * (kind === 'truck' ? 0.055 : 0.035);
    const x0 = wx + off;
    G.bullets.push({
      kind: 'bullet', x: x0, x0,
      x1: aimX + off * 1.8 + (Math.random() - 0.5) * 0.03,
      z: fromZ,
      dmg: cfg.dps / cfg.rate / cfg.bullets,
      sp: kind, splash: cfg.splash,
      w: kind === 'truck' ? 2.2 : kind === 'heavy' ? 1.55 : 1.15
    });
  }
  s.muzzle = kind === 'truck' ? 0.13 : 0.07;
  sfx.shoot();
}

function updateBullets(dt) {
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.z += CFG.bulletSpeed * dt;
    b.x = b.x0 + (b.x1 - b.x0) * Math.min(1, b.z / 40);
    let hit = null;
    const boss = G.boss;
    if (boss && !boss.dying && Math.abs(b.x - boss.x) < 0.42 && b.z > boss.z - 3.4 && b.z < boss.z + 4) hit = boss;
    if (!hit) {
      for (let k = 0; k < G.entities.length; k++) {
        const e = G.entities[k];
        if (e.dead) continue;
        if (Math.abs(b.x - e.x) < e.w + 0.015 && b.z > e.z - 2.0 && b.z < e.z + 2.0) { hit = e; break; }
      }
    }
    if (hit) {
      if (hit === boss) { damageBoss(b.dmg); sfx.bossHit(); }
      else damageEntity(hit, b.dmg, b.x);
      if (b.splash) {
        const p = project(clamp(b.z, 0, Z_SPAWN));
        const sx = CX + bend(clamp(b.z, 0, Z_SPAWN)) + b.x * p.hw;
        addParticles(sx, p.y - 30 * p.s, 8, ['#ffe9b0', '#ffb03a', '#ffffff'], 1.6, 260, 6 * Math.max(0.4, p.s));
        addBoom(sx, p.y - 24 * p.s, p.s * 0.8, b.sp === 'truck');
        for (let k = 0; k < G.entities.length; k++) {
          const e2 = G.entities[k];
          if (e2.dead || e2 === hit) continue;
          if (Math.abs(e2.x - b.x) < b.splash + e2.w * 0.4 && Math.abs(e2.z - b.z) < 9) {
            damageEntity(e2, b.dmg * 0.45, e2.x);
          }
        }
      }
      G.bullets.splice(i, 1);
      continue;
    }
    if (b.z > Z_SPAWN + 4) G.bullets.splice(i, 1);
  }
}

function updateEntities(dt) {
  for (let i = G.entities.length - 1; i >= 0; i--) {
    const e = G.entities[i];
    e.z -= (CFG.speed + (e.kind === 'enemy' ? CFG.enemySpeed : 0)) * dt;
    if (e.hitT > 0) e.hitT -= dt;
    if (e.flashT > 0) e.flashT -= dt;
    if (e.popT > 0) e.popT -= dt;
    if (e.dmgAcc >= 0.6 && e.popT <= 0) {
      addPopup(e.x, e.z + 1.4, '-' + Math.max(1, Math.round(e.dmgAcc)), '#ffe066', 0, false, e.kind === 'barrel' ? 118 : 46);
      e.dmgAcc = 0;
      e.popT = 0.22;
    }
    if (e.kind === 'enemy') {
      e.ph += dt * 9;
      e.fireT -= dt;
      if (e.z < 24 && e.z > 3 && e.fireT <= 0 && G.units > 0) {
        e.fireT = rand(2.0, 3.6);
        G.ebullets.push({ kind: 'ebullet', x: e.x, z: e.z - 1.5, vz: 62, r: 0.075, boss: false });
        noiseBurst(0.05, 0.05, 700, 3);
      }
      if (e.z <= 1.4) {
        e.dead = true;
        G.entities.splice(i, 1);
        loseUnits(1, 'contact');
        continue;
      }
    } else if (e.kind === 'barrel') {
      if (e.z <= 1.0) {
        e.dead = true;
        G.entities.splice(i, 1);
        if (G.units > 1) loseUnits(Math.min(2, G.units - 1), 'barrel');
        G.shake = Math.max(G.shake, 14);
        G.flash = Math.max(G.flash, 0.34);
        addPopup(e.x, 3, '으악!', '#ff5a5a', 20, true);
        continue;
      }
    }
    if (e.dead) { G.entities.splice(i, 1); }
  }
}

function updateGates(dt) {
  for (let i = G.gates.length - 1; i >= 0; i--) {
    const g = G.gates[i];
    g.z -= CFG.speed * dt;
    if (g.flash > 0) g.flash -= dt;
    if (!g.applied && g.z <= 2.2) {
      g.applied = true;
      g.flash = 0.6;
      const side = G.playerX < 0 ? g.left : g.right;
      applyOp(side);
    }
    if (g.z < -2) G.gates.splice(i, 1);
  }
}

function applyOp(key) {
  const o = OPS[key];
  if (!o) return;
  const before = G.units;
  if (key === 'x2') G.units = Math.min(CFG.maxUnits, G.units * 2);
  else if (key === 'x3') G.units = Math.min(CFG.maxUnits, G.units * 3);
  else if (key === 'p10') G.units = Math.min(CFG.maxUnits, G.units + 10);
  else if (key === 'p5') G.units = Math.min(CFG.maxUnits, G.units + 5);
  else if (key === 'm5') G.units = Math.max(1, G.units - 5);
  else if (key === 'm10') G.units = Math.max(1, G.units - 10);
  else if (key === 'd2') G.units = Math.max(1, Math.floor(G.units / 2));
  G.score += o.good ? 120 : 0;
  G.unitPulse = o.good ? 0.55 : -0.55;
  G.lastGateText = {
    text: o.label,
    sub: before + '기 → ' + G.units + '기',
    good: o.good
  };
  G.lastGateT = 1.5;
  if (o.good) sfx.gate(); else sfx.hurt();
  if (G.units >= CFG.maxUnits && o.good) {
    addPopup(G.playerX, 4, '최대 30기!', '#ffe066', 18, true);
  }
}

function updateEnemyBullets(dt) {
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.z -= b.vz * dt;
    if (b.z <= 0.8) {
      const p = project(0.8);
      const sx = CX + bend(0.8) + b.x * p.hw;
      addParticles(sx, p.y - 10, 6, ['#ff7a4d', '#ffd0a0'], 1, 200, 6);
      G.ebullets.splice(i, 1);
      if (Math.abs(b.x - G.playerX) < (b.boss ? 0.30 : 0.20)) {
        loseUnits(b.boss ? 2 : 1, b.boss ? 'bossfire' : 'fire');
      }
      continue;
    }
    if (b.z > Z_SPAWN) G.ebullets.splice(i, 1);
  }
}

/* ---------------- boss ---------------- */
function spawnBoss() {
  const spDps = G.heavies.length * SPECIAL.heavy.dps + G.bikes.length * SPECIAL.bike.dps + G.trucks.length * SPECIAL.truck.dps;
  const hp = Math.round(Math.max(9000, G.units * 820 + spDps * 13) * (1 + (G.stage - 1) * 0.45));
  G.boss = {
    kind: 'boss', x: 0, z: 46, hp, maxhp: hp,
    ph: 0, fireT: 2.4, summonT: 4.0, hitT: 0, dmgAcc: 0, popT: 0,
    dying: false, dieT: 0
  };
  if (G.units < 9) {
    G.units = 9;
    G.unitPulse = 0.6;
  }
  G.banner = { text: 'BOSS 등장!', sub: '무한 증원 · 병력 보충', t: 2.2, color: '#ff6b6b' };
  G.shake = 12;
  sfx.bossIn();
}

function updateBoss(dt) {
  const b = G.boss;
  if (!b) return;
  if (b.dying) {
    b.dieT -= dt;
    if (b.dieT <= 0) stageClear();
    return;
  }
  b.z += (23 - b.z) * Math.min(1, dt * 0.9);
  b.ph += dt;
  b.x = Math.sin(b.ph * 0.85) * 0.30;
  if (b.hitT > 0) b.hitT -= dt;
  if (b.popT > 0) b.popT -= dt;
  if (b.dmgAcc >= 0.6 && b.popT <= 0) {
    addPopup(b.x, b.z + 1.2, '-' + Math.max(1, Math.round(b.dmgAcc)), '#ffe066', 0, false, 400);
    b.dmgAcc = 0;
    b.popT = 0.18;
  }
  b.fireT -= dt;
  if (b.fireT <= 0) {
    b.fireT = 1.65;
    for (let i = 0; i < 3; i++) {
      G.ebullets.push({ kind: 'ebullet', x: b.x + (i - 1) * 0.26, z: b.z - 2, vz: 52, r: 0.16, boss: true });
    }
    tone(150, 70, 0.2, 'sawtooth', 0.1);
  }
  b.summonT -= dt;
  if (b.summonT <= 0) {
    b.summonT = 5.2;
    for (let i = 0; i < 3; i++) {
      G.entities.push(mkEnemy(-0.55 + i * 0.55, 52 + Math.random() * 8, Math.round(20 * G.enemyMul)));
    }
  }
}

function stageClear() {
  G.phase = 'clear';
  G.score += 2000 + G.units * 120 + G.stage * 500;
  sfx.win();
}
function gameOver() {
  G.phase = 'dead';
  G.endT = 0;
  sfx.lose();
}

/* ---------------- drawing : world ---------------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  g.addColorStop(0, '#31567d');
  g.addColorStop(0.45, '#6d97b8');
  g.addColorStop(0.82, '#b9cddc');
  g.addColorStop(1, '#e6dcc6');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HORIZON + 46);

  const rg = ctx.createRadialGradient(CX, HORIZON + 6, 0, CX, HORIZON + 6, W * 0.72);
  rg.addColorStop(0, 'rgba(255,243,205,0.75)');
  rg.addColorStop(1, 'rgba(255,243,205,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, HORIZON + 90);

  // distant hills
  ctx.fillStyle = 'rgba(120,140,150,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, HORIZON);
  for (let x = 0; x <= W; x += W / 14) {
    ctx.quadraticCurveTo(x + W / 28, HORIZON - 8 - Math.sin(x * 0.021) * 9, x + W / 14, HORIZON - 2);
  }
  ctx.lineTo(W, HORIZON + 5);
  ctx.lineTo(0, HORIZON + 5);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#c9b48c');
  g.addColorStop(0.35, '#c2a273');
  g.addColorStop(1, '#a8834f');
  ctx.fillStyle = g;
  ctx.fillRect(0, HORIZON, W, H - HORIZON);
}

function roadPath(z1, z2, inset, steps) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const z = z1 + (z2 - z1) * (i / steps);
    const p = project(z);
    const x = CX + bend(z) - p.hw * inset;
    if (i === 0) ctx.moveTo(x, p.y); else ctx.lineTo(x, p.y);
  }
  for (let i = steps; i >= 0; i--) {
    const z = z1 + (z2 - z1) * (i / steps);
    const p = project(z);
    ctx.lineTo(CX + bend(z) + p.hw * inset, p.y);
  }
  ctx.closePath();
}

function drawRoad() {
  // shoulder
  roadPath(-9, Z_SPAWN, 1.16, 26);
  ctx.fillStyle = '#b2915f';
  ctx.fill();
  // asphalt
  roadPath(-9, Z_SPAWN, 1.0, 26);
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#7c8189');
  g.addColorStop(0.5, '#666b72');
  g.addColorStop(1, '#54585f');
  ctx.fillStyle = g;
  ctx.fill();

  // edge lines
  quadZ(-9, Z_SPAWN, 0.93, 0.965, 'rgba(240,240,235,0.85)');
  quadZ(-9, Z_SPAWN, -0.965, -0.93, 'rgba(240,240,235,0.85)');

  quadZ(-9, Z_SPAWN, -0.62, -0.40, 'rgba(40,44,50,0.14)');
  quadZ(-9, Z_SPAWN, 0.40, 0.62, 'rgba(40,44,50,0.14)');
  quadZ(-9, Z_SPAWN, -0.20, -0.05, 'rgba(40,44,50,0.10)');
  quadZ(-9, Z_SPAWN, 0.05, 0.20, 'rgba(40,44,50,0.10)');

  // center dashes (scrolling)
  const seg = 11, dash = 5.5;
  const off = G.scrollZ % seg;
  for (let k = 0; k < 24; k++) {
    const z0 = k * seg - off;
    if (z0 < -6) continue;
    const z1 = z0 + dash;
    if (z0 > Z_SPAWN) continue;
    quadZ(z0, z1, -0.017, 0.017, 'rgba(245,245,238,0.9)');
  }
}

function quadZ(z1, z2, offA, offB, color) {
  const a = project(z1), b = project(z2);
  const ax = CX + bend(z1), bx = CX + bend(z2);
  ctx.beginPath();
  ctx.moveTo(ax + a.hw * offA, a.y);
  ctx.lineTo(ax + a.hw * offB, a.y);
  ctx.lineTo(bx + b.hw * offB, b.y);
  ctx.lineTo(bx + b.hw * offA, b.y);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawRails() {
  const spacing = 7.5;
  const off = 1.02;
  const phase = G.scrollZ % spacing;
  // rail bars (far to near) — top rail + lower rail
  for (let k = 20; k >= 1; k--) {
    const z1 = k * spacing - phase;
    const z2 = (k - 1) * spacing - phase;
    if (z1 < 0.2) continue;
    const p1 = project(z1), p2 = project(z2);
    const x1 = CX + bend(z1), x2 = CX + bend(z2);
    for (let r = 0; r < 2; r++) {
      const h1 = (r ? 17 : 30) * p1.s, h2 = (r ? 17 : 30) * p2.s;
      ctx.strokeStyle = r ? 'rgba(168,174,182,0.95)' : 'rgba(214,219,225,0.98)';
      ctx.lineWidth = Math.max(1, (r ? 2.4 : 4.2) * p1.s);
      ctx.beginPath();
      ctx.moveTo(x1 - p1.hw * off, p1.y - h1);
      ctx.lineTo(x2 - p2.hw * off, p2.y - h2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1 + p1.hw * off, p1.y - h1);
      ctx.lineTo(x2 + p2.hw * off, p2.y - h2);
      ctx.stroke();
    }
  }
  // posts
  for (let k = 16; k >= 0; k--) {
    const z = k * spacing - phase;
    if (z < 0.4) continue;
    const p = project(z);
    const cx = CX + bend(z);
    const h = 33 * p.s;
    const px = Math.max(1.4, 5.4 * p.s);
    for (let side = -1; side <= 1; side += 2) {
      const bx = cx + side * p.hw * off - px / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(bx + px * 0.5, p.y - h, px * 0.9, h);
      ctx.fillStyle = '#9098a1';
      ctx.fillRect(bx, p.y - h, px, h);
      ctx.fillStyle = '#c3c9d0';
      ctx.fillRect(bx, p.y - h, px, Math.max(1, 2.6 * p.s));
    }
  }
}

function drawGroundDetail() {
  for (let i = 0; i < 46; i++) {
    const seed = i * 7919 + 13;
    const base = ((seed % 997) / 997) * Z_SPAWN;
    let zz = (base - G.scrollZ) % Z_SPAWN;
    if (zz < 0) zz += Z_SPAWN;
    if (zz < 1) continue;
    const p = project(zz);
    const side = (seed % 2) ? 1 : -1;
    const off = 1.24 + ((seed % 89) / 89) * 1.05;
    const x = CX + bend(zz) + side * p.hw * off;
    const sz = Math.max(1, ((seed % 7) + 4) * 0.9 * p.s);
    ctx.fillStyle = (seed % 3 === 0) ? 'rgba(120,96,58,0.30)' : 'rgba(96,78,44,0.22)';
    ctx.beginPath();
    ctx.ellipse(x, p.y, sz * 1.5, sz * 0.45, 0, 0, 6.2832);
    ctx.fill();
  }
}

function drawHaze() {
  const y0 = HORIZON - 6;
  const y1 = HORIZON + (PLAYER_Y - HORIZON) * 0.42;
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(226,222,205,0.92)');
  g.addColorStop(0.45, 'rgba(222,218,202,0.35)');
  g.addColorStop(1, 'rgba(220,216,200,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, y1 - y0);
}

/* ---------------- drawing : actors ---------------- */
const BLUE = { helmet: '#2b7fd8', helmetDark: '#175a9e', helmLight: '#66b2f5', body: '#e7d8b5', bodyDark: '#bda884', pants: '#3c4d66', boots: '#232a35', skin: '#f4cba3', gun: '#31363d', gunLight: '#5f6873', pack: '#8a6a3f', packLight: '#ad8c58' };
const RED = { helmet: '#cf3a30', helmetDark: '#8f211c', helmLight: '#f0705f', body: '#e8cba4', bodyDark: '#bfa079', pants: '#6b4030', boots: '#3d2419', skin: '#f0bd93', gun: '#31363d', gunLight: '#5f6873', pack: '#7d5a35', packLight: '#9c7748' };

function drawFlash(x, y, r, col) {
  const R = r * 1.3;
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, 'rgba(255,255,246,1)');
  g.addColorStop(0.28, col || 'rgba(255,214,130,0.92)');
  g.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
  // 불꽃 혀
  ctx.fillStyle = 'rgba(255,240,200,0.92)';
  const n = 8;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + G.t * 2.4;
    const len = r * (0.75 + 0.4 * Math.sin(G.t * 31 + i * 2.2));
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a - 0.2) * r * 0.32, y + Math.sin(a - 0.2) * r * 0.32);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.lineTo(x + Math.cos(a + 0.2) * r * 0.32, y + Math.sin(a + 0.2) * r * 0.32);
    ctx.closePath(); ctx.fill();
  }
}

/* 병사 1명 — 뒤에서 본 달리기 모션(다리 스윙·몸 흔들림·총 반동) */
function drawUnit(x, y, sc, pal, ph, muzzle) {
  if (sc <= 0.02) return;
  const h = 66 * sc, w = 28 * sc;
  const run = Math.sin(ph);
  const run2 = Math.cos(ph);
  const bob = Math.abs(run2) * 2.0 * sc;
  const gy = y - bob;
  const sway = run * 0.9 * sc;
  const tilt = run * 0.045;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(x, y + 1.4 * sc, w * 0.60, w * 0.19, 0, 0, 6.2832); ctx.fill();

  const hipY = gy - h * 0.44;

  // 다리
  for (let s = -1; s <= 1; s += 2) {
    const swing = run * s * 0.62;
    const lift = Math.max(0, run2 * s) * 2.2 * sc;
    ctx.save();
    ctx.translate(x + s * w * 0.20 + sway * 0.3, hipY - lift);
    ctx.rotate(swing);
    ctx.fillStyle = pal.pants;
    rr(-w * 0.13, 0, w * 0.26, h * 0.40, 2.4 * sc); ctx.fill();
    ctx.fillStyle = pal.boots;
    rr(-w * 0.155, h * 0.32, w * 0.31, h * 0.11, 2 * sc); ctx.fill();
    ctx.restore();
  }

  // 몸통 + 백팩
  ctx.save();
  ctx.translate(x + sway * 0.65, gy);
  ctx.rotate(tilt);
  const bw = w * 0.78, bh = h * 0.46;
  ctx.fillStyle = pal.body;
  rr(-bw / 2, -h * 0.90, bw, bh, 4 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(-bw / 2, -h * 0.62, bw * 0.45, bh * 0.7, 3 * sc); ctx.fill();
  // 어깨(둥근 견갑)
  ctx.fillStyle = pal.body;
  ctx.beginPath(); ctx.arc(-bw * 0.44, -h * 0.855, w * 0.165, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(bw * 0.44, -h * 0.855, w * 0.165, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.beginPath(); ctx.arc(-bw * 0.44, -h * 0.845, w * 0.10, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(bw * 0.44, -h * 0.845, w * 0.10, 0, 6.2832); ctx.fill();
  // 허리끈
  ctx.fillStyle = pal.bodyDark;
  ctx.fillRect(-bw / 2, -h * 0.505, bw, Math.max(1, h * 0.05));
  ctx.fillStyle = '#6b5636';
  ctx.fillRect(-w * 0.07, -h * 0.515, w * 0.14, Math.max(1.2, h * 0.062));
  // 등가방 (작게)
  ctx.fillStyle = pal.pack;
  rr(-w * 0.23, -h * 0.815, w * 0.46, h * 0.255, 3 * sc); ctx.fill();
  ctx.fillStyle = pal.packLight;
  rr(-w * 0.165, -h * 0.782, w * 0.33, h * 0.07, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(-w * 0.23, -h * 0.60, w * 0.46, Math.max(0.8, h * 0.018));
  // 어깨끈
  ctx.strokeStyle = 'rgba(66,48,24,0.6)';
  ctx.lineWidth = Math.max(1, 2 * sc);
  ctx.beginPath(); ctx.moveTo(-w * 0.20, -h * 0.875); ctx.lineTo(-w * 0.175, -h * 0.56); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w * 0.20, -h * 0.875); ctx.lineTo(w * 0.175, -h * 0.56); ctx.stroke();
  ctx.restore();

  // 왼팔 (앞뒤 흔들림)
  ctx.save();
  ctx.translate(x - w * 0.40 + sway * 0.5, gy - h * 0.855);
  ctx.rotate(-run * 0.6 - 0.08);
  ctx.fillStyle = pal.bodyDark;
  rr(-w * 0.095, 0, w * 0.19, h * 0.28, 2.4 * sc); ctx.fill();
  ctx.fillStyle = pal.skin;
  ctx.beginPath(); ctx.arc(0, h * 0.30, w * 0.105, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 오른팔 (소총 파지)
  ctx.save();
  ctx.translate(x + w * 0.40 + sway * 0.5, gy - h * 0.845);
  ctx.rotate(0.30 - run * 0.10);
  ctx.fillStyle = pal.bodyDark;
  rr(-w * 0.095, 0, w * 0.19, h * 0.22, 2.4 * sc); ctx.fill();
  ctx.fillStyle = pal.skin;
  ctx.beginPath(); ctx.arc(0, h * 0.23, w * 0.10, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 머리 + 헬멧(뒤통수)
  const hx = x + sway * 0.9, hy = gy - h * 0.985;
  ctx.fillStyle = pal.skin;
  ctx.beginPath(); ctx.arc(hx, hy, w * 0.245, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(hx - w * 0.17, hy + h * 0.015, w * 0.34, h * 0.035, 2 * sc); ctx.fill();
  ctx.fillStyle = pal.helmet;
  ctx.beginPath(); ctx.arc(hx, hy - h * 0.012, w * 0.325, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.fillStyle = pal.helmLight;
  ctx.beginPath(); ctx.arc(hx - w * 0.085, hy - h * 0.05, w * 0.11, 0, 6.2832); ctx.fill();
  ctx.fillStyle = pal.helmetDark;
  rr(hx - w * 0.335, hy - h * 0.035, w * 0.67, Math.max(1, h * 0.045), 2 * sc); ctx.fill();

  // 소총 (오른쪽 어깨 위로)
  const ang = 0.18 + run * 0.05;
  const gx = x + w * 0.44 + sway * 0.5, gyy = gy - h * 0.60;
  const L = h * 0.40;
  ctx.save();
  ctx.translate(gx, gyy);
  ctx.rotate(ang);
  ctx.fillStyle = pal.gun;
  rr(-w * 0.040, -L, w * 0.080, L + h * 0.08, 1.2 * sc); ctx.fill();
  ctx.fillStyle = pal.gunLight;
  rr(-w * 0.034, -L + h * 0.02, w * 0.024, L * 0.5, 0.8 * sc); ctx.fill();
  ctx.fillStyle = pal.gun;
  rr(-w * 0.058, -h * 0.03, w * 0.116, h * 0.11, 1.2 * sc); ctx.fill();
  ctx.restore();

  // 총구 화염 (앞으로 뻗는 불꽃)
  if (muzzle) {
    const tipX = gx + L * Math.sin(ang);
    const tipY = gyy - L * Math.cos(ang);
    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(ang);
    const fl = w * 0.45;
    const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, fl);
    fg.addColorStop(0, 'rgba(255,255,245,0.98)');
    fg.addColorStop(0.38, 'rgba(255,214,130,0.85)');
    fg.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(0, -fl * 0.42);
    ctx.lineTo(fl * 1.0, 0);
    ctx.lineTo(0, fl * 0.42);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, fl * 0.42, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}

/* 화면 공간 대형 좌표(가까운 줄→먼 줄) */
function squadSlot(row, dx) {
  const pb = project(2.0);
  const unitSc = 1.46;
  const f = 1 - row * 0.045;
  return {
    x: CX + bend(2.0) + (G.playerX + dx) * pb.hw,
    y: pb.y - row * (42 * pb.s * unitSc),
    s: pb.s * f,
    us: pb.s * unitSc * f
  };
}

function drawSquad() {
  const n = Math.max(0, G.units);
  if (n <= 0 && !hasSpecials()) return;
  const f = formation(Math.max(1, n));
  const unitSc = 1.46;
  const pulse = 1 + Math.max(0, G.unitPulse) * 0.06;

  // 지면 글로우
  const p0 = project(2.2);
  const gx = CX + bend(2.2) + G.playerX * p0.hw;
  const gg = ctx.createRadialGradient(gx, p0.y, 0, gx, p0.y, ROAD_HALF * 0.62);
  gg.addColorStop(0, 'rgba(80,190,255,0.22)');
  gg.addColorStop(1, 'rgba(80,190,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(gx, p0.y - 2, ROAD_HALF * 0.62, 30, 0, 0, 6.2832); ctx.fill();

  // 뒤에서 앞으로(먼 줄부터) 그리기
  const actors = [];
  for (let i = 0; i < f.list.length; i++) actors.push({ r: f.list[i].row, p: 0, u: f.list[i] });
  for (let i = 0; i < G.heavies.length; i++) actors.push({ r: G.heavies[i].row, p: 1, s: G.heavies[i], t: 1 });
  for (let i = 0; i < G.bikes.length; i++) actors.push({ r: G.bikes[i].row, p: 2, s: G.bikes[i], t: 2 });
  for (let i = 0; i < G.trucks.length; i++) actors.push({ r: G.trucks[i].row, p: 0, s: G.trucks[i], t: 3 });
  actors.sort((a, b) => (b.r - a.r) || (a.p - b.p));

  for (let i = 0; i < actors.length; i++) {
    const a = actors[i];
    if (a.t === undefined) {
      const u = a.u;
      const sl = squadSlot(u.row, u.dx);
      drawUnit(sl.x, sl.y + u.jy, sl.us * pulse, BLUE, G.t * 12 + u.ph, G.muzzle > 0 && u.row === 0);
    } else if (a.t === 1) drawHeavy(a.s);
    else if (a.t === 2) drawBike(a.s);
    else drawTruck(a.s);
  }
}

/* ---------- 형님(헤비 거너) ---------- */
function drawHeavy(s) {
  const sl = squadSlot(s.row, s.dx);
  const p = { y: sl.y, s: sl.s };
  const x = sl.x;
  const sc = p.s;
  const st = G.t * 5.4 + s.ph;
  const bob = Math.abs(Math.cos(st)) * 2.6 * sc;
  const gy = p.y - bob;
  const Hh = 168 * sc, Wd = 96 * sc;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 2 * sc, Wd * 0.48, Wd * 0.16, 0, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.translate(x, gy);

  // 다리
  for (let sd = -1; sd <= 1; sd += 2) {
    ctx.save();
    ctx.translate(sd * Wd * 0.155, -Hh * 0.40);
    ctx.rotate(Math.sin(st + (sd > 0 ? 0 : Math.PI)) * 0.28);
    ctx.fillStyle = '#333a44';
    rr(-Wd * 0.105, 0, Wd * 0.21, Hh * 0.26, 4 * sc); ctx.fill();
    ctx.fillStyle = '#2a303a';
    rr(-Wd * 0.095, Hh * 0.22, Wd * 0.19, Hh * 0.16, 3 * sc); ctx.fill();
    ctx.fillStyle = '#15181d';
    rr(-Wd * 0.12, Hh * 0.34, Wd * 0.25, Hh * 0.075, 3 * sc); ctx.fill();
    ctx.restore();
  }

  // 등(민무늬 상체)
  const bg = ctx.createLinearGradient(-Wd * 0.45, 0, Wd * 0.45, 0);
  bg.addColorStop(0, '#96582f');
  bg.addColorStop(0.34, '#cf8d5c');
  bg.addColorStop(0.72, '#b87848');
  bg.addColorStop(1, '#8a4f2b');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.30, -Hh * 0.42);
  ctx.quadraticCurveTo(-Wd * 0.44, -Hh * 0.60, -Wd * 0.40, -Hh * 0.78);
  ctx.quadraticCurveTo(-Wd * 0.30, -Hh * 0.845, -Wd * 0.13, -Hh * 0.855);
  ctx.lineTo(Wd * 0.13, -Hh * 0.855);
  ctx.quadraticCurveTo(Wd * 0.30, -Hh * 0.845, Wd * 0.40, -Hh * 0.78);
  ctx.quadraticCurveTo(Wd * 0.44, -Hh * 0.60, Wd * 0.30, -Hh * 0.42);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(92,50,26,0.35)';
  ctx.lineWidth = Math.max(1, 2 * sc);
  ctx.stroke();

  // 등 중앙 홈 · 광배 하이라이트
  ctx.strokeStyle = 'rgba(110,60,30,0.32)';
  ctx.lineWidth = Math.max(1, 2.2 * sc);
  ctx.beginPath(); ctx.moveTo(0, -Hh * 0.80); ctx.lineTo(0, -Hh * 0.45); ctx.stroke();
  ctx.fillStyle = 'rgba(255,225,190,0.18)';
  ctx.beginPath(); ctx.ellipse(-Wd * 0.21, -Hh * 0.66, Wd * 0.10, Hh * 0.08, -0.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(Wd * 0.21, -Hh * 0.66, Wd * 0.10, Hh * 0.08, 0.5, 0, 6.2832); ctx.fill();

  // 벨트
  ctx.fillStyle = '#2a2f38';
  ctx.fillRect(-Wd * 0.31, -Hh * 0.445, Wd * 0.62, Hh * 0.055);
  ctx.fillStyle = '#c9a24a';
  rr(-Wd * 0.06, -Hh * 0.455, Wd * 0.12, Hh * 0.07, 2 * sc); ctx.fill();

  // X자 가죽끈
  ctx.strokeStyle = 'rgba(30,34,42,0.92)';
  ctx.lineWidth = Math.max(1.5, Wd * 0.055);
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.26, -Hh * 0.825); ctx.lineTo(Wd * 0.24, -Hh * 0.50);
  ctx.moveTo(Wd * 0.26, -Hh * 0.825); ctx.lineTo(-Wd * 0.24, -Hh * 0.50);
  ctx.stroke();

  // 금목걸이
  ctx.strokeStyle = '#f2c53d';
  ctx.lineWidth = Math.max(1.4, 2.6 * sc);
  ctx.beginPath(); ctx.arc(0, -Hh * 0.815, Wd * 0.17, 0.22, Math.PI - 0.22); ctx.stroke();
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.arc(0, -Hh * 0.645, Wd * 0.032, 0, 6.2832); ctx.fill();

  // 목
  ctx.fillStyle = '#c9895c';
  rr(-Wd * 0.07, -Hh * 0.905, Wd * 0.14, Hh * 0.06, 2 * sc); ctx.fill();
  // 머리
  ctx.fillStyle = '#dda274';
  ctx.beginPath(); ctx.arc(0, -Hh * 0.935, Wd * 0.115, 0, 6.2832); ctx.fill();
  // 두건
  ctx.fillStyle = '#c8322c';
  ctx.beginPath(); ctx.arc(0, -Hh * 0.94, Wd * 0.122, Math.PI * 0.96, Math.PI * 2.04); ctx.fill();
  ctx.fillRect(-Wd * 0.122, -Hh * 0.943, Wd * 0.244, Hh * 0.018);
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.11, -Hh * 0.928);
  ctx.lineTo(-Wd * 0.205, -Hh * 0.893);
  ctx.lineTo(-Wd * 0.10, -Hh * 0.898);
  ctx.closePath(); ctx.fill();
  // 귀
  ctx.fillStyle = '#c9895c';
  ctx.beginPath(); ctx.arc(-Wd * 0.117, -Hh * 0.928, Wd * 0.030, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(Wd * 0.117, -Hh * 0.928, Wd * 0.030, 0, 6.2832); ctx.fill();

  // 왼팔(주먹)
  ctx.save();
  ctx.translate(-Wd * 0.40, -Hh * 0.775);
  ctx.rotate(0.16 + Math.sin(st) * 0.10);
  ctx.fillStyle = '#c98657';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.09, 0);
  ctx.quadraticCurveTo(-Wd * 0.15, Hh * 0.11, -Wd * 0.085, Hh * 0.22);
  ctx.lineTo(Wd * 0.075, Hh * 0.22);
  ctx.quadraticCurveTo(Wd * 0.115, Hh * 0.10, Wd * 0.09, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cf8b5c';
  rr(-Wd * 0.07, Hh * 0.20, Wd * 0.14, Hh * 0.13, 3 * sc); ctx.fill();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(0, Hh * 0.36, Wd * 0.075, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 오른팔(미니건 파지)
  ctx.save();
  ctx.translate(Wd * 0.40, -Hh * 0.775);
  ctx.rotate(-0.62);
  ctx.fillStyle = '#dda274';
  rr(-Wd * 0.085, 0, Wd * 0.17, Hh * 0.20, 4 * sc); ctx.fill();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(0, Hh * 0.215, Wd * 0.075, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 미니건
  const mgx = Wd * 0.44, mgy = -Hh * 0.66;
  const mgAng = -0.40 + Math.sin(st) * 0.02;
  ctx.save();
  ctx.translate(mgx, mgy);
  ctx.rotate(mgAng);
  ctx.fillStyle = '#2b303a';
  rr(-Wd * 0.13, -Hh * 0.05, Wd * 0.26, Hh * 0.11, 3 * sc); ctx.fill();
  ctx.fillStyle = '#5b6573';
  rr(-Wd * 0.10, -Hh * 0.035, Wd * 0.20, Hh * 0.03, 2 * sc); ctx.fill();
  for (let i = 0; i < 3; i++) {
    const off = (i - 1) * Wd * 0.05 + Math.sin(s.spin + i * 2.1) * Wd * 0.016;
    ctx.fillStyle = i === 1 ? '#a3aeba' : '#78848f';
    rr(off - Wd * 0.021, -Hh * 0.27, Wd * 0.042, Hh * 0.23, 1.4 * sc); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    rr(off - Wd * 0.011, -Hh * 0.26, Wd * 0.012, Hh * 0.20, 0.7 * sc); ctx.fill();
  }
  ctx.fillStyle = '#b8c3cf';
  rr(-Wd * 0.085, -Hh * 0.288, Wd * 0.17, Hh * 0.026, 1.2 * sc); ctx.fill();
  // 탄창
  ctx.fillStyle = '#3b424d';
  rr(-Wd * 0.19, -Hh * 0.01, Wd * 0.10, Hh * 0.09, 2 * sc); ctx.fill();
  ctx.fillStyle = '#c9a24a';
  for (let i = 0; i < 4; i++) ctx.fillRect(-Wd * 0.17, -Hh * 0.005 + i * Hh * 0.022, Wd * 0.06, Hh * 0.012);
  ctx.restore();

  // 총구 화염
  if (s.muzzle > 0) {
    drawFlash(mgx + Hh * 0.28 * Math.sin(mgAng), mgy - Hh * 0.28 * Math.cos(mgAng), Wd * 0.16, 'rgba(255,205,120,0.95)');
  }
  ctx.restore();
}

/* ---------- 오토바이 라이더 ---------- */
function drawBike(s) {
  const sl = squadSlot(s.row, s.dx);
  const p = { y: sl.y, s: sl.s };
  const sc = p.s;
  const weave = Math.sin(G.t * 5 + s.ph) * 3.2;
  const x = sl.x + weave * sc;
  const Wd = 84 * sc, Hh = 110 * sc;
  const t = G.t * 9 + s.ph;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 1.5 * sc, Wd * 0.46, Wd * 0.17, 0, 0, 6.2832); ctx.fill();

  // 뒷바퀴 (회전)
  ctx.fillStyle = '#16191e';
  ctx.beginPath(); ctx.ellipse(x, p.y - Hh * 0.17, Wd * 0.25, Hh * 0.19, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(170,180,195,0.55)';
  ctx.lineWidth = Math.max(0.8, 1.6 * sc);
  for (let i = 0; i < 6; i++) {
    const a = t + i * 1.047;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * Wd * 0.05, p.y - Hh * 0.17 + Math.sin(a) * Hh * 0.04);
    ctx.lineTo(x + Math.cos(a) * Wd * 0.22, p.y - Hh * 0.17 + Math.sin(a) * Hh * 0.165);
    ctx.stroke();
  }
  ctx.fillStyle = '#454d57';
  ctx.beginPath(); ctx.ellipse(x, p.y - Hh * 0.17, Wd * 0.07, Hh * 0.05, 0, 0, 6.2832); ctx.fill();

  // 배기관 + 불꽃
  ctx.fillStyle = '#9aa3af';
  rr(x - Wd * 0.36, p.y - Hh * 0.36, Wd * 0.10, Hh * 0.19, 2 * sc); ctx.fill();
  rr(x + Wd * 0.26, p.y - Hh * 0.36, Wd * 0.10, Hh * 0.19, 2 * sc); ctx.fill();
  if (Math.sin(t * 1.7) > 0.15) {
    const fa = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.fillStyle = 'rgba(120,205,255,' + (0.35 + fa * 0.35) + ')';
    ctx.beginPath(); ctx.ellipse(x - Wd * 0.31, p.y - Hh * 0.14, Wd * 0.05, Hh * 0.045 * fa, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + Wd * 0.31, p.y - Hh * 0.14, Wd * 0.05, Hh * 0.045 * fa, 0, 0, 6.2832); ctx.fill();
  }

  // 뒷펜더 + 꼬리등
  ctx.fillStyle = '#2f6ea8';
  rr(x - Wd * 0.31, p.y - Hh * 0.44, Wd * 0.62, Hh * 0.13, 4 * sc); ctx.fill();
  ctx.fillStyle = '#1d4a72';
  rr(x - Wd * 0.31, p.y - Hh * 0.33, Wd * 0.62, Hh * 0.035, 2 * sc); ctx.fill();
  ctx.fillStyle = '#ff4a3a';
  rr(x - Wd * 0.10, p.y - Hh * 0.405, Wd * 0.20, Hh * 0.038, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,60,0.35)';
  ctx.beginPath(); ctx.ellipse(x, p.y - Hh * 0.39, Wd * 0.16, Hh * 0.03, 0, 0, 6.2832); ctx.fill();

  // 시트
  ctx.fillStyle = '#20242c';
  rr(x - Wd * 0.20, p.y - Hh * 0.56, Wd * 0.40, Hh * 0.10, 3 * sc); ctx.fill();

  // 라이더 (앞으로 숙인 등)
  ctx.save();
  ctx.translate(x, p.y - Hh * 0.58);
  // 등(검정 재킷)
  ctx.fillStyle = '#242932';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.24, 0);
  ctx.quadraticCurveTo(-Wd * 0.26, -Hh * 0.26, 0, -Hh * 0.30);
  ctx.quadraticCurveTo(Wd * 0.26, -Hh * 0.26, Wd * 0.24, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120,175,255,0.16)';
  ctx.fillRect(-Wd * 0.05, -Hh * 0.26, Wd * 0.10, Hh * 0.22);
  // 헬멧
  ctx.fillStyle = '#2b7fd8';
  ctx.beginPath(); ctx.arc(0, -Hh * 0.345, Wd * 0.150, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#66b2f5';
  ctx.beginPath(); ctx.arc(-Wd * 0.045, -Hh * 0.375, Wd * 0.052, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#123a63';
  rr(-Wd * 0.152, -Hh * 0.345, Wd * 0.30, Hh * 0.018, 1.5 * sc); ctx.fill();
  ctx.restore();

  // 핸들 + 팔
  const barY = p.y - Hh * 0.62;
  ctx.strokeStyle = '#aab3bf';
  ctx.lineWidth = Math.max(1.2, 2.2 * sc);
  ctx.beginPath(); ctx.moveTo(x - Wd * 0.40, barY); ctx.lineTo(x + Wd * 0.40, barY); ctx.stroke();
  ctx.fillStyle = '#2c313a';
  rr(x - Wd * 0.44, barY - Hh * 0.02, Wd * 0.10, Hh * 0.045, 2 * sc); ctx.fill();
  rr(x + Wd * 0.34, barY - Hh * 0.02, Wd * 0.10, Hh * 0.045, 2 * sc); ctx.fill();
  ctx.strokeStyle = '#242932';
  ctx.lineWidth = Wd * 0.085;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - Wd * 0.20, p.y - Hh * 0.72); ctx.lineTo(x - Wd * 0.38, barY - Hh * 0.01); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + Wd * 0.20, p.y - Hh * 0.72); ctx.lineTo(x + Wd * 0.38, barY - Hh * 0.01); ctx.stroke();
  ctx.fillStyle = '#e8b083';
  ctx.beginPath(); ctx.arc(x - Wd * 0.395, barY - Hh * 0.005, Wd * 0.045, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + Wd * 0.395, barY - Hh * 0.005, Wd * 0.045, 0, 6.2832); ctx.fill();

  // 들린 앞바퀴(윌리) + 포크
  const wheelX = x + Wd * 0.17, wheelY = p.y - Hh * 1.02;
  ctx.strokeStyle = '#c3ccd8';
  ctx.lineWidth = Math.max(1.2, 2.2 * sc);
  ctx.beginPath();
  ctx.moveTo(x + Wd * 0.30, barY - Hh * 0.02);
  ctx.lineTo(wheelX + Wd * 0.05, wheelY + Hh * 0.055);
  ctx.moveTo(x + Wd * 0.40, barY - Hh * 0.02);
  ctx.lineTo(wheelX + Wd * 0.10, wheelY + Hh * 0.055);
  ctx.stroke();
  ctx.save();
  ctx.translate(wheelX, wheelY);
  ctx.rotate(0.30);
  ctx.fillStyle = '#1b1f26';
  ctx.beginPath(); ctx.ellipse(0, 0, Wd * 0.145, Hh * 0.095, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(195,210,230,0.9)';
  ctx.lineWidth = Math.max(0.8, 1.5 * sc);
  ctx.beginPath(); ctx.ellipse(0, 0, Wd * 0.10, Hh * 0.065, 0, 0, 6.2832); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const a = 0.6 + i * 1.05;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * Wd * 0.03, Math.sin(a) * Hh * 0.02);
    ctx.lineTo(Math.cos(a) * Wd * 0.10, Math.sin(a) * Hh * 0.065);
    ctx.stroke();
  }
  ctx.restore();

  // 속도선
  ctx.strokeStyle = 'rgba(180,225,255,0.32)';
  ctx.lineWidth = Math.max(0.8, 1.6 * sc);
  for (let i = -1; i <= 1; i += 2) {
    ctx.beginPath();
    ctx.moveTo(x + i * Wd * 0.44, p.y - Hh * 0.30);
    ctx.lineTo(x + i * Wd * 0.62, p.y - Hh * 0.35);
    ctx.stroke();
  }

  // 쌍연사 총구 화염
  if (s.muzzle > 0) {
    drawFlash(x - Wd * 0.40, barY - Hh * 0.02, Wd * 0.13, 'rgba(160,235,255,0.95)');
    drawFlash(x + Wd * 0.40, barY - Hh * 0.02, Wd * 0.13, 'rgba(160,235,255,0.95)');
  }
}

/* ---------- 무장 트럭/지프 ---------- */
function drawTruck(s) {
  const sl = squadSlot(s.row, s.dx);
  const p = { y: sl.y, s: sl.s };
  const x = sl.x;
  const sc = p.s;
  const Wd = 160 * sc, Hh = 136 * sc;
  const bounce = Math.abs(Math.sin(G.t * 9 + s.ph)) * 1.6 * sc;
  const gy = p.y - bounce;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 2 * sc, Wd * 0.47, Wd * 0.12, 0, 0, 6.2832); ctx.fill();

  // 배기 연기
  for (let i = 0; i < 3; i++) {
    const pr = ((G.t * 0.8 + i * 0.34 + s.ph) % 1);
    ctx.fillStyle = 'rgba(215,215,208,0.22)';
    ctx.beginPath();
    ctx.arc(x - Wd * 0.44 - pr * 16 * sc, gy - Hh * 0.06 - pr * 26 * sc, (3 + pr * 7) * sc, 0, 6.2832);
    ctx.fill();
  }

  // 바퀴 (차체 밖으로 돌출)
  for (let i = -1; i <= 1; i += 2) {
    ctx.fillStyle = '#15181d';
    rr(x + i * Wd * 0.44 - Wd * 0.085, gy - Hh * 0.30, Wd * 0.17, Hh * 0.30, 3 * sc); ctx.fill();
    ctx.fillStyle = '#2c333c';
    rr(x + i * Wd * 0.44 - Wd * 0.040, gy - Hh * 0.20, Wd * 0.08, Hh * 0.11, 2 * sc); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    rr(x + i * Wd * 0.44 - Wd * 0.095, gy - Hh * 0.28, Wd * 0.19, Hh * 0.045, 2 * sc); ctx.fill();
  }

  // 범퍼
  ctx.fillStyle = '#333a42';
  rr(x - Wd * 0.46, gy - Hh * 0.19, Wd * 0.92, Hh * 0.07, 2 * sc); ctx.fill();
  ctx.fillStyle = '#4d545c';
  rr(x - Wd * 0.46, gy - Hh * 0.19, Wd * 0.92, Hh * 0.022, 1.5 * sc); ctx.fill();

  // 적재함
  const g = ctx.createLinearGradient(0, gy - Hh, 0, gy);
  g.addColorStop(0, '#7b8a53');
  g.addColorStop(0.45, '#5d6b43');
  g.addColorStop(1, '#3c462b');
  ctx.fillStyle = g;
  rr(x - Wd * 0.44, gy - Hh * 0.88, Wd * 0.88, Hh * 0.72, 4 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(24,30,16,0.55)';
  ctx.lineWidth = Math.max(1, 2 * sc);
  rr(x - Wd * 0.44, gy - Hh * 0.88, Wd * 0.88, Hh * 0.72, 4 * sc); ctx.stroke();

  // 천막 지붕 (둥근 캔버스)
  ctx.fillStyle = '#8c9b60';
  ctx.beginPath();
  ctx.moveTo(x - Wd * 0.44, gy - Hh * 0.86);
  ctx.quadraticCurveTo(x - Wd * 0.40, gy - Hh * 1.03, x, gy - Hh * 1.03);
  ctx.quadraticCurveTo(x + Wd * 0.40, gy - Hh * 1.03, x + Wd * 0.44, gy - Hh * 0.86);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(30,38,20,0.45)';
  ctx.lineWidth = Math.max(0.8, 1.6 * sc);
  for (let i = 1; i < 5; i++) {
    const bx = x - Wd * 0.44 + (Wd * 0.88 * i) / 5;
    ctx.beginPath();
    ctx.moveTo(bx, gy - Hh * 0.87);
    ctx.lineTo(bx, gy - Hh * 0.995 + Math.abs(bx - x) * 0.10);
    ctx.stroke();
  }

  // 후면 도어
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(x - Wd * 0.40, gy - Hh * 0.80, Wd * 0.80, Hh * 0.60, 3 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(34,42,24,0.6)';
  ctx.lineWidth = Math.max(1, 1.8 * sc);
  ctx.beginPath();
  ctx.moveTo(x, gy - Hh * 0.79);
  ctx.lineTo(x, gy - Hh * 0.21);
  ctx.stroke();
  ctx.fillStyle = '#aab27f';
  rr(x - Wd * 0.05, gy - Hh * 0.52, Wd * 0.10, Hh * 0.05, 2 * sc); ctx.fill();
  // 경첩
  ctx.fillStyle = '#6c7748';
  for (let i = -1; i <= 1; i += 2) {
    rr(x + i * Wd * 0.40 - Wd * 0.018, gy - Hh * 0.72, Wd * 0.036, Hh * 0.05, 1.5 * sc); ctx.fill();
    rr(x + i * Wd * 0.40 - Wd * 0.018, gy - Hh * 0.34, Wd * 0.036, Hh * 0.05, 1.5 * sc); ctx.fill();
  }
  // 테일램프
  ctx.fillStyle = '#ff4a3a';
  rr(x - Wd * 0.40, gy - Hh * 0.26, Wd * 0.075, Hh * 0.05, 2 * sc); ctx.fill();
  rr(x + Wd * 0.325, gy - Hh * 0.26, Wd * 0.075, Hh * 0.05, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,60,0.30)';
  ctx.beginPath(); ctx.ellipse(x - Wd * 0.36, gy - Hh * 0.235, Wd * 0.10, Hh * 0.032, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + Wd * 0.36, gy - Hh * 0.235, Wd * 0.10, Hh * 0.032, 0, 0, 6.2832); ctx.fill();

  // 포탑 링 + 방패판
  ctx.fillStyle = '#2f3722';
  ctx.beginPath(); ctx.ellipse(x, gy - Hh * 1.02, Wd * 0.29, Hh * 0.055, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#4a5630';
  rr(x - Wd * 0.20, gy - Hh * 1.20, Wd * 0.40, Hh * 0.20, 4 * sc); ctx.fill();
  ctx.strokeStyle = 'rgba(22,28,12,0.55)';
  ctx.lineWidth = Math.max(1, 1.8 * sc);
  rr(x - Wd * 0.20, gy - Hh * 1.20, Wd * 0.40, Hh * 0.20, 4 * sc); ctx.stroke();
  ctx.fillStyle = '#5f6e3f';
  rr(x - Wd * 0.155, gy - Hh * 1.19, Wd * 0.31, Hh * 0.05, 2 * sc); ctx.fill();

  // 기관포 (비스듬히 위를 향함)
  const ang = 0.07 + Math.sin(G.t * 1.8 + s.ph) * 0.02;
  ctx.save();
  ctx.translate(x + Wd * 0.02, gy - Hh * 1.16);
  ctx.rotate(ang);
  ctx.fillStyle = '#2b3038';
  rr(-Wd * 0.050, -Hh * 0.40, Wd * 0.10, Hh * 0.40, 2 * sc); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  rr(-Wd * 0.026, -Hh * 0.38, Wd * 0.022, Hh * 0.34, 1 * sc); ctx.fill();
  ctx.fillStyle = '#8b95a2';
  rr(-Wd * 0.070, -Hh * 0.425, Wd * 0.14, Hh * 0.05, 1.5 * sc); ctx.fill();
  ctx.fillStyle = '#3a424c';
  rr(-Wd * 0.085, -Hh * 0.13, Wd * 0.17, Hh * 0.10, 2 * sc); ctx.fill();
  ctx.restore();

  if (s.muzzle > 0) {
    drawFlash(x + Wd * 0.02 + Math.sin(ang) * Hh * 0.40, gy - Hh * 1.16 - Math.cos(ang) * Hh * 0.40, Wd * 0.135, 'rgba(255,190,90,0.95)');
  }
}

function iconHeavy(cx, cy, s, col) {
  ctx.fillStyle = col;
  ctx.fillRect(cx - s * 0.52, cy - s * 0.075, s * 1.04, s * 0.15);
  rr(cx - s * 0.66, cy - s * 0.28, s * 0.15, s * 0.56, s * 0.05); ctx.fill();
  rr(cx + s * 0.51, cy - s * 0.28, s * 0.15, s * 0.56, s * 0.05); ctx.fill();
  rr(cx - s * 0.84, cy - s * 0.19, s * 0.12, s * 0.38, s * 0.04); ctx.fill();
  rr(cx + s * 0.72, cy - s * 0.19, s * 0.12, s * 0.38, s * 0.04); ctx.fill();
}
function iconBike(cx, cy, s, col) {
  ctx.strokeStyle = col;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.15;
  ctx.beginPath(); ctx.arc(cx - s * 0.33, cy + s * 0.19, s * 0.20, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + s * 0.33, cy + s * 0.19, s * 0.20, 0, 6.2832); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.33, cy + s * 0.19);
  ctx.lineTo(cx - s * 0.06, cy - s * 0.16);
  ctx.lineTo(cx + s * 0.20, cy - s * 0.16);
  ctx.lineTo(cx + s * 0.33, cy + s * 0.19);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + s * 0.20, cy - s * 0.16); ctx.lineTo(cx + s * 0.28, cy - s * 0.38); ctx.stroke();
  ctx.lineWidth = s * 0.18;
  ctx.beginPath(); ctx.moveTo(cx - s * 0.26, cy - s * 0.22); ctx.lineTo(cx - s * 0.04, cy - s * 0.22); ctx.stroke();
}
function iconGun(cx, cy, s, col) {
  ctx.fillStyle = col;
  rr(cx - s * 0.44, cy - s * 0.02, s * 0.66, s * 0.22, s * 0.04); ctx.fill();
  for (let i = 0; i < 3; i++) ctx.fillRect(cx + s * 0.20, cy - s * 0.14 + i * s * 0.13, s * 0.30, s * 0.07);
  ctx.fillRect(cx - s * 0.12, cy + s * 0.18, s * 0.14, s * 0.22);
  ctx.fillRect(cx - s * 0.34, cy + s * 0.20, s * 0.10, s * 0.14);
}

function drawCrate(e) {
  if (e.z < 0.4) return;
  const p = project(e.z);
  const x = CX + bend(e.z) + e.x * p.hw;
  const big = !!e.sp;
  const w = (big ? 138 : 128) * p.s, h = (big ? 118 : 110) * p.s;
  const s = p.s;

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(x, p.y, w * 0.52, w * 0.15, 0, 0, 6.2832); ctx.fill();

  const sh = e.hitT > 0 ? Math.sin(G.t * 95) * 3.4 * p.s : 0;

  // 특수 상자 상승빛
  if (big) {
    const lg = ctx.createLinearGradient(0, p.y - h * 2.2, 0, p.y);
    const tint = e.sp === 'heavy' ? '255,190,70' : e.sp === 'bike' ? '110,215,255' : '255,130,70';
    lg.addColorStop(0, 'rgba(' + tint + ',0)');
    lg.addColorStop(1, 'rgba(' + tint + ',0.13)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.30, p.y - h * 2.2);
    ctx.lineTo(x + w * 0.30, p.y - h * 2.2);
    ctx.lineTo(x + w * 0.54, p.y);
    ctx.lineTo(x - w * 0.54, p.y);
    ctx.closePath(); ctx.fill();
  }

  ctx.save();
  ctx.translate(x + sh, p.y);

  // 몸통
  const g = ctx.createLinearGradient(0, -h, 0, 0);
  if (big) {
    g.addColorStop(0, '#e0ab5c');
    g.addColorStop(0.45, '#b57a2f');
    g.addColorStop(1, '#7d4a17');
  } else {
    g.addColorStop(0, '#cf9150');
    g.addColorStop(0.45, '#ac6d2e');
    g.addColorStop(1, '#7f4a1c');
  }
  ctx.fillStyle = g;
  rr(-w / 2, -h, w, h, 7 * p.s);
  ctx.fill();

  // 윗면
  const topH = h * 0.17;
  ctx.fillStyle = big ? '#f0c274' : '#d9a35d';
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h);
  ctx.lineTo(w / 2, -h);
  ctx.lineTo(w / 2 - w * 0.13, -h - topH);
  ctx.lineTo(-w / 2 + w * 0.13, -h - topH);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(120,72,26,0.35)';
  for (let i = 1; i < 4; i++) {
    ctx.fillRect(-w * 0.36 + (w * 0.72 * i) / 4, -h - topH * 0.85, Math.max(0.8, w * 0.012), topH * 0.7);
  }
  ctx.strokeStyle = 'rgba(70,40,12,0.75)';
  ctx.lineWidth = Math.max(1, 2 * p.s);
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h);
  ctx.lineTo(w / 2, -h);
  ctx.lineTo(w / 2 - w * 0.13, -h - topH);
  ctx.lineTo(-w / 2 + w * 0.13, -h - topH);
  ctx.closePath();
  ctx.stroke();

  // 세로 판자
  ctx.strokeStyle = 'rgba(84,46,14,0.45)';
  ctx.lineWidth = Math.max(0.8, 1.6 * p.s);
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 + (w * i) / 4, -h + 3 * p.s);
    ctx.lineTo(-w / 2 + (w * i) / 4, -3 * p.s);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(62,38,15,0.55)';
  ctx.fillRect(-w / 2, -h * 0.79, w, Math.max(1.5, 5 * p.s));
  ctx.fillRect(-w / 2, -h * 0.25, w, Math.max(1.5, 5 * p.s));
  ctx.strokeStyle = big ? 'rgba(255,214,120,0.95)' : 'rgba(52,30,9,0.9)';
  ctx.lineWidth = Math.max(1.4, (big ? 4 : 3) * p.s);
  rr(-w / 2, -h, w, h, 7 * p.s);
  ctx.stroke();

  // 금속 리벳
  ctx.fillStyle = 'rgba(40,24,8,0.55)';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.arc(-w * 0.42 + i * w * 0.28, -h * 0.97, Math.max(0.8, 1.6 * p.s), 0, 6.2832); ctx.fill();
  }

  // 균열
  if (e.hp < e.maxhp * 0.62) {
    ctx.strokeStyle = 'rgba(48,24,6,0.6)';
    ctx.lineWidth = Math.max(1, 2 * p.s);
    ctx.beginPath();
    ctx.moveTo(-w * 0.30, -h * 0.9);
    ctx.lineTo(-w * 0.36, -h * 0.72);
    ctx.lineTo(-w * 0.28, -h * 0.6);
    ctx.moveTo(w * 0.34, -h * 0.86);
    ctx.lineTo(w * 0.28, -h * 0.7);
    ctx.moveTo(-w * 0.36, -h * 0.30);
    ctx.lineTo(-w * 0.26, -h * 0.18);
    ctx.stroke();
  }
  if (e.hp < e.maxhp * 0.25) {
    ctx.strokeStyle = 'rgba(30,14,2,0.55)';
    ctx.lineWidth = Math.max(1, 2.2 * p.s);
    ctx.beginPath();
    ctx.moveTo(w * 0.30, -h * 0.95);
    ctx.lineTo(w * 0.12, -h * 0.66);
    ctx.lineTo(w * 0.26, -h * 0.46);
    ctx.moveTo(-w * 0.10, -h * 0.98);
    ctx.lineTo(-w * 0.18, -h * 0.70);
    ctx.stroke();
  }

  // 아이콘 배지
  if (big) {
    const bs = w * 0.17;
    const bx = -w * 0.33, by = -h * 0.86;
    ctx.fillStyle = 'rgba(16,14,10,0.82)';
    ctx.beginPath(); ctx.arc(bx, by, bs, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = e.sp === 'heavy' ? '#ffd76a' : e.sp === 'bike' ? '#8fe6ff' : '#ffab7a';
    ctx.lineWidth = Math.max(1.2, 2.2 * p.s);
    ctx.beginPath(); ctx.arc(bx, by, bs, 0, 6.2832); ctx.stroke();
    const col = e.sp === 'heavy' ? '#ffd76a' : e.sp === 'bike' ? '#9fe8ff' : '#ffb98a';
    if (e.sp === 'heavy') iconHeavy(bx, by, bs * 0.95, col);
    else if (e.sp === 'bike') iconBike(bx, by, bs * 0.95, col);
    else iconGun(bx, by, bs * 0.95, col);
  }

  // 숫자 (타격마다 톡톡 깎이는 느낌)
  const fs = Math.min(w * (big ? 0.38 : 0.44), 34 * p.s);
  const bump = e.hitT > 0 ? 1 + e.hitT * 1.6 : 1;
  ctx.save();
  ctx.translate(big ? w * 0.06 : 0, -h * 0.5);
  ctx.scale(bump, bump);
  txt(String(Math.max(0, Math.ceil(e.hp))), 0, 0, Math.max(7, fs), '#fff8e8', 'center', '900', 'rgba(48,22,0,0.95)', Math.max(1.6, fs * 0.16));
  ctx.restore();

  // 피격 백색 플래시 (1~3프레임)
  if (e.flashT > 0) {
    const fa = Math.min(1, e.flashT / 0.05);
    ctx.globalAlpha = fa * 0.30;
    ctx.fillStyle = '#fff6e0';
    rr(-w / 2, -h, w, h, 7 * p.s);
    ctx.fill();
    const hg = ctx.createRadialGradient(0, -h * 0.5, 0, 0, -h * 0.5, w * 0.62);
    hg.addColorStop(0, 'rgba(255,255,255,' + (0.55 * fa) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = hg;
    rr(-w / 2, -h, w, h, 7 * p.s);
    ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.z < 0.5) return;
  const p = project(e.z);
  const x = CX + bend(e.z) + e.x * p.hw;
  drawUnit(x, p.y, p.s * 1.15, RED, e.ph, false);
  if (e.hp < e.maxhp) {
    const bw = 30 * p.s;
    if (bw > 8) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(x - bw / 2, p.y - 52 * p.s, bw, 4 * p.s);
      ctx.fillStyle = '#ff5a4d';
      ctx.fillRect(x - bw / 2, p.y - 52 * p.s, bw * (e.hp / e.maxhp), 4 * p.s);
    }
  }
}

function drawGate(g) {
  if (g.z < -1) return;
  const z = Math.max(g.z, 0.35);
  const p = project(z);
  const cx = CX + bend(z);
  const alpha = g.applied ? Math.max(0, g.flash / 0.6) : 1;
  if (alpha <= 0.01) return;
  const hh = 128 * p.s;
  const pw = p.hw * 0.94;

  for (let side = -1; side <= 1; side += 2) {
    const key = side < 0 ? g.left : g.right;
    const o = OPS[key];
    if (!o) continue;
    const px = cx + side * p.hw * 0.5;
    const col = o.good ? ['rgba(46,160,255,0.62)', '#8fe6ff'] : ['rgba(225,58,52,0.62)', '#ffb3a3'];
    ctx.globalAlpha = alpha;
    // floor glow
    const fg = ctx.createLinearGradient(px, p.y - hh, px, p.y);
    fg.addColorStop(0, col[0]);
    fg.addColorStop(1, 'rgba(20,26,40,0.10)');
    ctx.fillStyle = fg;
    ctx.fillRect(px - pw / 2, p.y - hh, pw, hh);
    // frame
    ctx.strokeStyle = col[1];
    ctx.lineWidth = Math.max(1.4, 3 * p.s);
    ctx.strokeRect(px - pw / 2, p.y - hh, pw, hh);
    // text
    if (p.s > 0.14) {
      const fs = Math.min(pw * 0.62, 54 * p.s);
      txt(o.label, px, p.y - hh * 0.56, Math.max(9, fs), '#ffffff', 'center', '900', 'rgba(0,0,0,0.55)', Math.max(2, fs * 0.13));
      if (p.s > 0.32) {
        txt(o.sub, px, p.y - hh * 0.2, Math.max(8, 15 * p.s), 'rgba(255,255,255,0.92)', 'center', '700', 'rgba(0,0,0,0.5)', Math.max(1.6, 4 * p.s));
      }
    }
    ctx.globalAlpha = 1;
  }
  // arch top
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = Math.max(1.2, 2.4 * p.s);
  ctx.beginPath();
  ctx.moveTo(cx - p.hw * 0.97, p.y - hh);
  ctx.lineTo(cx + p.hw * 0.97, p.y - hh);
  ctx.stroke();
}

function drawBullet(b) {
  if (b.z < 0 || b.z > Z_SPAWN + 2) return;
  const z2 = Math.min(b.z + 6.5, Z_SPAWN + 2);
  const p1 = project(b.z), p2 = project(z2);
  const x1 = CX + bend(b.z) + b.x * p1.hw;
  const x2 = CX + bend(z2) + b.x * p2.hw;
  const k = b.w || 1;
  const w = Math.max(1.4, 5 * p1.s) * k;
  const heavy = b.sp === 'heavy' || b.sp === 'truck';
  ctx.lineCap = 'round';
  ctx.strokeStyle = heavy ? 'rgba(255,150,60,0.20)' : 'rgba(70,180,255,0.16)';
  ctx.lineWidth = w * 2.6;
  ctx.beginPath(); ctx.moveTo(x1, p1.y); ctx.lineTo(x2, p2.y); ctx.stroke();
  ctx.strokeStyle = heavy ? 'rgba(255,220,140,0.95)' : 'rgba(150,240,255,0.95)';
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, p1.y); ctx.lineTo(x2, p2.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(0.8, w * 0.42);
  ctx.beginPath(); ctx.moveTo(x1, p1.y); ctx.lineTo(x2, p2.y); ctx.stroke();
  if (b.sp === 'truck') {
    const g = ctx.createRadialGradient(x1, p1.y, 0, x1, p1.y, w * 3.2);
    g.addColorStop(0, 'rgba(255,225,160,0.55)');
    g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x1, p1.y, w * 3.2, 0, 6.2832); ctx.fill();
  }
}

function drawEBullet(b) {
  if (b.z < 0.4) return;
  const p = project(b.z);
  const x = CX + bend(b.z) + b.x * p.hw;
  const r = Math.max(2.5, (b.boss ? 26 : 13) * p.s);
  const g = ctx.createRadialGradient(x, p.y - r * 0.9, 0, x, p.y - r * 0.9, r * 1.9);
  g.addColorStop(0, 'rgba(255,220,150,0.95)');
  g.addColorStop(0.45, 'rgba(255,90,60,0.85)');
  g.addColorStop(1, 'rgba(255,60,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, p.y - r * 0.9, r * 1.9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#fff1c9';
  ctx.beginPath(); ctx.arc(x, p.y - r * 0.9, r * 0.45, 0, 6.2832); ctx.fill();
}

function drawBoss(b) {
  const p = project(b.z);
  const x = CX + bend(b.z) + b.x * p.hw;
  const s = p.s;
  const Hh = 330 * s, Wd = 196 * s;
  const shake = b.hitT > 0 ? Math.sin(G.t * 100) * 4 * s : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.beginPath(); ctx.ellipse(x, p.y, Wd * 0.52, Wd * 0.15, 0, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.translate(x + shake, p.y);
  const breathe = 1 + Math.sin(b.ph * 2.2) * 0.012;
  ctx.scale(breathe, breathe);

  // legs
  ctx.fillStyle = '#7c1f1b';
  rr(-Wd * 0.27, -Hh * 0.30, Wd * 0.20, Hh * 0.30, 8 * s); ctx.fill();
  rr(Wd * 0.07, -Hh * 0.30, Wd * 0.20, Hh * 0.30, 8 * s); ctx.fill();
  ctx.fillStyle = '#3b1a17';
  rr(-Wd * 0.30, -Hh * 0.09, Wd * 0.26, Hh * 0.09, 6 * s); ctx.fill();
  rr(Wd * 0.04, -Hh * 0.09, Wd * 0.26, Hh * 0.09, 6 * s); ctx.fill();

  // coat (넓은 어깨)
  const cg = ctx.createLinearGradient(0, -Hh * 0.85, 0, -Hh * 0.2);
  cg.addColorStop(0, '#e04a3c');
  cg.addColorStop(0.55, '#c8332c');
  cg.addColorStop(1, '#9a1f1a');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.30, -Hh * 0.88);
  ctx.lineTo(Wd * 0.30, -Hh * 0.88);
  ctx.lineTo(Wd * 0.38, -Hh * 0.74);
  ctx.lineTo(Wd * 0.34, -Hh * 0.30);
  ctx.lineTo(-Wd * 0.34, -Hh * 0.30);
  ctx.lineTo(-Wd * 0.38, -Hh * 0.74);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,18,14,0.55)';
  ctx.lineWidth = Math.max(1, 3 * s);
  ctx.stroke();
  // collar
  ctx.fillStyle = '#8f211c';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.19, -Hh * 0.87);
  ctx.lineTo(0, -Hh * 0.79);
  ctx.lineTo(Wd * 0.19, -Hh * 0.87);
  ctx.lineTo(Wd * 0.13, -Hh * 0.90);
  ctx.lineTo(-Wd * 0.13, -Hh * 0.90);
  ctx.closePath();
  ctx.fill();
  // coat center line & belt
  ctx.fillStyle = 'rgba(90,20,16,0.8)';
  ctx.fillRect(-Wd * 0.03, -Hh * 0.80, Wd * 0.06, Hh * 0.52);
  ctx.fillStyle = '#2c2f36';
  ctx.fillRect(-Wd * 0.35, -Hh * 0.42, Wd * 0.70, Hh * 0.06);
  ctx.fillStyle = '#c9a24a';
  rr(-Wd * 0.07, -Hh * 0.44, Wd * 0.14, Hh * 0.065, 3 * s); ctx.fill();
  // chest emblem (상자 문양)
  ctx.fillStyle = '#a97a35';
  rr(-Wd * 0.075, -Hh * 0.70, Wd * 0.15, Hh * 0.10, 3 * s); ctx.fill();
  ctx.fillStyle = '#f0c267';
  ctx.fillRect(-Wd * 0.075, -Hh * 0.665, Wd * 0.15, Hh * 0.022);
  ctx.strokeStyle = 'rgba(120,80,20,0.9)';
  ctx.lineWidth = Math.max(0.8, 1.6 * s);
  rr(-Wd * 0.075, -Hh * 0.70, Wd * 0.15, Hh * 0.10, 3 * s); ctx.stroke();

  // shoulders
  const shR = Wd * 0.19;
  const shG = ctx.createRadialGradient(0, 0, 2, 0, 0, shR);
  ctx.fillStyle = '#d63a31';
  ctx.beginPath(); ctx.arc(-Wd * 0.40, -Hh * 0.74, shR, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(Wd * 0.40, -Hh * 0.74, shR, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#8f211c';
  ctx.beginPath(); ctx.arc(-Wd * 0.40, -Hh * 0.74, shR * 0.62, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(Wd * 0.40, -Hh * 0.74, shR * 0.62, 0, 6.2832); ctx.fill();

  // arms
  ctx.strokeStyle = '#c8332c';
  ctx.lineWidth = Wd * 0.15;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.42, -Hh * 0.70);
  ctx.lineTo(-Wd * 0.52, -Hh * 0.44);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(Wd * 0.42, -Hh * 0.70);
  ctx.lineTo(Wd * 0.50, -Hh * 0.50);
  ctx.stroke();
  // fists
  ctx.fillStyle = '#f0b98f';
  ctx.beginPath(); ctx.arc(-Wd * 0.53, -Hh * 0.42, Wd * 0.085, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(Wd * 0.51, -Hh * 0.48, Wd * 0.085, 0, 6.2832); ctx.fill();

  // hair mane behind head
  ctx.fillStyle = '#f2c53d';
  ctx.beginPath(); ctx.ellipse(0, -Hh * 0.902, Wd * 0.215, Hh * 0.090, 0, 0, 6.2832); ctx.fill();
  // head
  ctx.fillStyle = '#f0b98f';
  ctx.beginPath(); ctx.arc(0, -Hh * 0.902, Wd * 0.162, 0, 6.2832); ctx.fill();
  // face
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-Wd * 0.072, -Hh * 0.918, Wd * 0.038, Hh * 0.020);
  ctx.fillRect(Wd * 0.034, -Hh * 0.918, Wd * 0.038, Hh * 0.020);
  ctx.fillStyle = '#7d1c17';
  ctx.fillRect(-Wd * 0.042, -Hh * 0.868, Wd * 0.084, Hh * 0.011);
  // yellow beard on the jaw
  ctx.fillStyle = '#f2c53d';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.162, -Hh * 0.888);
  ctx.quadraticCurveTo(-Wd * 0.150, -Hh * 0.812, 0, -Hh * 0.800);
  ctx.quadraticCurveTo(Wd * 0.150, -Hh * 0.812, Wd * 0.162, -Hh * 0.888);
  ctx.quadraticCurveTo(Wd * 0.085, -Hh * 0.850, 0, -Hh * 0.856);
  ctx.quadraticCurveTo(-Wd * 0.085, -Hh * 0.850, -Wd * 0.162, -Hh * 0.888);
  ctx.closePath();
  ctx.fill();
  // mustache
  ctx.fillStyle = '#e8b82f';
  ctx.beginPath();
  ctx.moveTo(-Wd * 0.085, -Hh * 0.878);
  ctx.quadraticCurveTo(0, -Hh * 0.858, Wd * 0.085, -Hh * 0.878);
  ctx.quadraticCurveTo(0, -Hh * 0.872, -Wd * 0.085, -Hh * 0.878);
  ctx.closePath();
  ctx.fill();

  // yellow hair spikes
  ctx.fillStyle = '#f2c53d';
  for (let i = -3; i <= 3; i++) {
    const bx = i * Wd * 0.048;
    const by = -Hh * 0.965 - Math.abs(i) * -0;
    ctx.beginPath();
    ctx.moveTo(bx - Wd * 0.035, -Hh * 0.945);
    ctx.lineTo(bx + i * Wd * 0.012, -Hh * 1.045 + Math.abs(i) * Hh * 0.008);
    ctx.lineTo(bx + Wd * 0.035, -Hh * 0.945);
    ctx.closePath();
    ctx.fill();
  }

  // hammer (right side)
  ctx.save();
  ctx.translate(Wd * 0.53, -Hh * 0.50);
  ctx.rotate(-0.30 + Math.sin(b.ph) * 0.05);
  ctx.fillStyle = '#7a5230';
  rr(-Wd * 0.030, -Hh * 0.31, Wd * 0.060, Hh * 0.45, 3 * s); ctx.fill();
  ctx.fillStyle = '#5f3d22';
  ctx.fillRect(-Wd * 0.030, -Hh * 0.07, Wd * 0.060, Hh * 0.03);
  ctx.fillStyle = '#8b95a2';
  rr(-Wd * 0.175, -Hh * 0.415, Wd * 0.35, Hh * 0.15, 5 * s); ctx.fill();
  ctx.fillStyle = '#c9d2dd';
  rr(-Wd * 0.155, -Hh * 0.406, Wd * 0.31, Hh * 0.044, 3 * s); ctx.fill();
  ctx.fillStyle = '#5d6673';
  rr(-Wd * 0.175, -Hh * 0.283, Wd * 0.35, Hh * 0.026, 2 * s); ctx.fill();
  ctx.restore();
  // gripping fist over the handle
  ctx.fillStyle = '#f0b98f';
  ctx.beginPath(); ctx.arc(Wd * 0.53, -Hh * 0.50, Wd * 0.088, 0, 6.2832); ctx.fill();

  // hp number over head
  if (s > 0.16) {
    const fs = Math.max(10, 30 * s);
    txt(String(Math.max(0, Math.ceil(b.hp))), 0, -Hh * 1.12, fs, '#ffffff', 'center', '900', 'rgba(0,0,0,0.6)', Math.max(2, fs * 0.13));
  }
  ctx.restore();
}

/* ---------------- drawing : hud ---------------- */
function drawHUD() {
  if (G.phase === 'start') return;
  const pad = 12;

  // stage pill
  ctx.fillStyle = 'rgba(8,14,24,0.62)';
  rr(pad, 10, 86, 30, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(110,200,255,0.55)';
  ctx.lineWidth = 1.2;
  rr(pad, 10, 86, 30, 9); ctx.stroke();
  txt('STAGE ' + G.stage, pad + 43, 25, 14, '#bfe9ff', 'center', '800');

  // unit pill
  ctx.fillStyle = 'rgba(8,14,24,0.62)';
  rr(pad, 46, 116, 34, 9); ctx.fill();
  // helmet icon
  ctx.fillStyle = '#2b7fd8';
  ctx.beginPath(); ctx.arc(pad + 20, 62, 9, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#175a9e';
  ctx.fillRect(pad + 9, 60, 22, 3);
  txt('×' + G.units, pad + 82, 64, Math.min(20, 14 + G.units * 0.18), '#ffffff', 'center', '900');

  // score
  ctx.textAlign = 'right';
  txt('SCORE', W - pad, 20, 10, 'rgba(200,225,245,0.75)', 'right', '700');
  txt(Math.round(G.score).toLocaleString('en-US'), W - pad, 38, 20, '#ffffff', 'right', '900', 'rgba(0,0,0,0.5)', 3);

  // 특수 유닛 칩 (형님 / 오토바이 / 지프)
  drawSpecialChips();

  // progress bar
  const bx = pad, by = 90, bw = W - pad * 2, bh = 8;
  ctx.fillStyle = 'rgba(6,10,18,0.6)';
  rr(bx, by, bw, bh, 4); ctx.fill();
  const prog = Math.min(1, G.dist / CFG.bossAt);
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, '#35b6ff');
  pg.addColorStop(0.7, '#7ee0a8');
  pg.addColorStop(1, '#ffd24d');
  ctx.fillStyle = pg;
  rr(bx, by, Math.max(3, bw * prog), bh, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(bx + bw * prog, by + bh / 2, 5, 0, 6.2832); ctx.fill();
  txt('BOSS', bx + bw - 2, by - 7, 9, 'rgba(255,220,120,0.9)', 'right', '800');

  // boss hp bar
  const b = G.boss;
  if (b && !b.dying) {
    const hy = 112;
    ctx.fillStyle = 'rgba(6,10,18,0.7)';
    rr(pad, hy, W - pad * 2, 16, 6); ctx.fill();
    const frac = Math.max(0, b.hp / b.maxhp);
    const hg = ctx.createLinearGradient(pad, 0, W - pad, 0);
    hg.addColorStop(0, '#ff5f45');
    hg.addColorStop(1, '#ffb03a');
    ctx.fillStyle = hg;
    rr(pad, hy, Math.max(2, (W - pad * 2) * frac), 16, 6); ctx.fill();
    txt('BOSS  ' + Math.ceil(b.hp), W / 2, hy + 8, 11, '#ffffff', 'center', '900', 'rgba(0,0,0,0.45)', 2.5);
  }

  // gate result flash
  if (G.lastGateText) {
    const a = Math.min(1, G.lastGateT / 0.5);
    ctx.globalAlpha = a;
    const t = G.lastGateText;
    const yy = H * 0.36;
    txt(t.text, W / 2, yy, 62, t.good ? '#7ef0c0' : '#ff6b6b', 'center', '900', 'rgba(0,0,0,0.65)', 7);
    txt(t.sub, W / 2, yy + 46, 20, '#ffffff', 'center', '800', 'rgba(0,0,0,0.6)', 4);
    ctx.globalAlpha = 1;
  }

  // banner
  if (G.banner) {
    const bt = G.banner;
    const k = Math.min(1, (2.2 - bt.t) * 6);
    ctx.save();
    ctx.globalAlpha = Math.min(1, bt.t * 2);
    ctx.translate(W / 2, H * 0.265);
    ctx.scale(0.72 + 0.28 * k, 0.72 + 0.28 * k);
    if (bt.icon) txt(bt.icon, 0, -36, 30, '#ffffff', 'center', '700');
    txt(bt.text, 0, 0, Math.min(38, W * 0.094), bt.color || '#fff', 'center', '900', 'rgba(0,0,0,0.68)', 6);
    if (bt.sub) txt(bt.sub, 0, 32, 14, 'rgba(255,255,255,0.92)', 'center', '700', 'rgba(0,0,0,0.55)', 3);
    ctx.restore();
  }

  // drag hint
  if (G.phase === 'playing' && G.hint > 0.01) {
    ctx.globalAlpha = G.hint * (0.55 + 0.45 * Math.sin(G.t * 5));
    const y = H * 0.955;
    txt('◀   드래그로 이동   ▶', W / 2, y, 15, '#ffffff', 'center', '800', 'rgba(0,0,0,0.55)', 4);
    ctx.globalAlpha = 1;
  }

  // mute button
  drawMuteBtn();
}

function drawSpecialChips() {
  const items = [];
  if (G.heavies.length) items.push(['형님', G.heavies.length, '#ffb03a']);
  if (G.bikes.length) items.push(['바이크', G.bikes.length, '#7ee0ff']);
  if (G.trucks.length) items.push(['지프', G.trucks.length, '#ffd24d']);
  if (!items.length) return;
  let x = W - 12;
  const y = 50, hgt = 26;
  ctx.font = '800 12px ' + FONT;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const label = it[0] + ' ×' + it[1];
    const tw = ctx.measureText(label).width + 18;
    x -= tw;
    ctx.fillStyle = 'rgba(8,14,24,0.66)';
    rr(x, y, tw, hgt, 8); ctx.fill();
    ctx.strokeStyle = it[2];
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.2;
    rr(x, y, tw, hgt, 8); ctx.stroke();
    ctx.globalAlpha = 1;
    txt(label, x + tw / 2, y + hgt / 2 + 1, 12, it[2], 'center', '800');
    x -= 6;
  }
}

function drawMuteBtn() {

    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x + 24, y + 14); ctx.lineTo(x + 30, y + 24); ctx.moveTo(x + 30, y + 14); ctx.lineTo(x + 24, y + 24); ctx.stroke();
  } else {
    ctx.fillRect(x + 11, y + 15, 5, 9);
    ctx.beginPath(); ctx.moveTo(x + 16, y + 12); ctx.lineTo(x + 24, y + 8); ctx.lineTo(x + 24, y + 31); ctx.lineTo(x + 16, y + 27); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#cfe6f7'; ctx.lineWidth = 2;
