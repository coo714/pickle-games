<!DOCTYPE html>

<title>넘버로드 v3 — 1줄 진화 슈터</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0d1420;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans CJK KR","Malgun Gothic",sans-serif}
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
</style>

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   넘버로드 v3 (NUMBER ROAD) — 1줄 진화 슈터
   - 아군은 항상 화면 맨 아래 1줄(최대 5기)
   - 나무통/게이트 = 상위 클래스로 진화 (증식 아님)
   - 통 위에 실제 보상이 올라가 회전/바운스
   - 빨간 적 군단 대량 웨이브 + 거대 보스
   - 완전 오프라인 단일 파일 / Canvas2D + WebAudio 합성음
   ===================================================================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* ---------------- layout / projection ---------------- */
let W = 390, H = 844, DPR = 1, CX = 195, HORIZON = 114, PLAYER_Y = 755, ROAD_HALF = 195;
const Z_SPAWN = 118;      // 스폰 지평선
const Z_K = 0.0215;       // 원근 계수
const Z_UNIT = 2.0;       // 아군 1줄 위치

function resize() {
  W = Math.max(300, Math.round(window.innerWidth));
  H = Math.max(460, Math.round(window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2;
  HORIZON = Math.round(H * 0.135);
  PLAYER_Y = Math.round(H * 0.895);
  ROAD_HALF = W * 0.50;
}

const Z_POW = 1.65; // 원거리 압축(레퍼런스처럼 먼 곳이 넓게 보이도록)
function project(z) {
  const s = 1 / (1 + z * Z_K);
  return { s: s, y: HORIZON + (PLAYER_Y - HORIZON) * Math.pow(s, Z_POW), hw: ROAD_HALF * s };
}
function bend(z) {
  const k = Math.max(0, Math.min(1, z / Z_SPAWN));
  const ph = (G ? G.scrollZ : 0) * 0.0042;
  return Math.sin(ph + z * 0.0105) * W * 0.028 * k * k;
}

/* ---------------- tiny helpers ---------------- */
function rr(x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
const FONT = '"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
function txt(s, x, y, size, color, align, weight, stroke, lw) {
  ctx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = lw || Math.max(2, size * 0.15);
    ctx.strokeStyle = stroke;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }

/* ---------------- audio ---------------- */
let AC = null, master = null, noiseBuf = null, muted = false;
let lastPunch = 0, lastShot = 0;

function initAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = 0.6;
      master.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * 0.5);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* 오디오는 선택 */ }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(18, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.04);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq, q, delay, type) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = 1 + Math.random() * 0.3;
    const f = AC.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q || 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(Math.max(0.001, vol), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.03);
  } catch (e) {}
}
function thump(vol, f0, f1, dur) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(Math.max(0.001, vol), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}

const sfx = {
  shot() {
    if (!AC || muted) return;
    const now = AC.currentTime;
    if (now - lastShot < 0.035) return;
    lastShot = now;
    tone(1700, 720, 0.045, 'square', 0.035);
    noiseBurst(0.03, 0.045, 2800, 2.6);
  },
  heavyShot() {
    if (!AC || muted) return;
    const now = AC.currentTime;
    if (now - lastShot < 0.03) return;
    lastShot = now;
    tone(420, 130, 0.05, 'sawtooth', 0.05);
    noiseBurst(0.035, 0.05, 1200, 1.6);
  },
  jeepShot() {
    thump(0.16, 260, 70, 0.09);
    noiseBurst(0.07, 0.07, 900, 1.1);
  },
  /* 총알이 나무/적에 박히는 묵직한 타격 */
  punch(power) {
    if (!AC || muted) return;
    const now = AC.currentTime;
    if (now - lastPunch < 0.038) return;
    lastPunch = now;
    const p = power || 1;
    thump(0.13 * p, 210, 48, 0.10);
    noiseBurst(0.05, 0.075 * p, 620, 1.0);
    noiseBurst(0.028, 0.05 * p, 2600, 2.2);
  },
  crack() {
    noiseBurst(0.05, 0.09, 1700, 2.4);
    noiseBurst(0.03, 0.06, 4200, 3.2);
  },
  splinter() { noiseBurst(0.13, 0.09, 1400, 1.2); },
  barrelBreak(big) {
    thump(big ? 0.34 : 0.26, 150, 32, 0.4);
    noiseBurst(0.34, big ? 0.3 : 0.22, 700, 0.66);
    noiseBurst(0.18, big ? 0.2 : 0.15, 2400, 0.9, 0.02);
    tone(300, 62, 0.3, 'sawtooth', big ? 0.16 : 0.11);
  },
  evolve() {
    [330, 415, 523, 660, 830].forEach((f, i) => tone(f, f * 1.01, 0.19, 'square', 0.10, i * 0.055));
    thump(0.22, 120, 48, 0.55);
    noiseBurst(0.42, 0.15, 320, 0.6);
  },
  powerup() {
    [523, 659, 784].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.12, i * 0.06));
  },
  gate() {
    tone(560, 560, 0.08, 'sine', 0.13);
    tone(720, 720, 0.08, 'sine', 0.13, 0.075);
    tone(960, 960, 0.15, 'sine', 0.14, 0.15);
  },
  hurt() {
    tone(200, 52, 0.26, 'triangle', 0.2);
    noiseBurst(0.2, 0.13, 340, 1);
  },
  squish() {
    noiseBurst(0.06, 0.07, 480, 1.4);
    tone(240, 90, 0.07, 'sawtooth', 0.05);
  },
  bossIn() {
    thump(0.3, 100, 38, 0.9);
    noiseBurst(0.75, 0.2, 240, 0.8);
    tone(70, 40, 0.9, 'sawtooth', 0.14, 0.1);
  },
  win() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.15, i * 0.11));
  },
  lose() {
    [420, 340, 260, 175].forEach((f, i) => tone(f, f * 0.82, 0.26, 'sawtooth', 0.13, i * 0.13));
  }
};

/* ---------------- config / units ---------------- */
const CFG = {
  speed: 15,
  bulletSpeed: 160,
  bossAt: 640,
  contactCd: 1.0,
  maxSlots: 5
};

/* Tier 0 → 3 : 소총병 → 미니건 형님 → 오토바이 → 무장 지프 */
const TIER = [
  { name: '소총병',    short: '소총',   dps: 78,  rate: 8.5, bullets: 1, col: '#4fb3ff' },
  { name: '미니건 형님', short: '형님',   dps: 340, rate: 15,  bullets: 2, col: '#ffb03a' },
  { name: '오토바이',   short: '바이크',  dps: 300, rate: 11,  bullets: 2, col: '#7ce8ff' },
  { name: '무장 지프',  short: '지프',   dps: 800, rate: 6.2, bullets: 2, splash: 0.11, col: '#ffd24d' }
];

const REW = {
  heavy:   { label: '미니건 형님', col: '#ffb03a', tier: 1 },
  bike:    { label: '오토바이',   col: '#7ce8ff', tier: 2 },
  jeep:    { label: '무장 지프',  col: '#ffd24d', tier: 3 },
  soldier: { label: '병사 +1',    col: '#6fd0ff', tier: -1 },
  power:   { label: '화력 +25%',  col: '#ff8a5a', tier: -2 }
};

const GATE = {
  heavy:   { label: '형님',    sub: '진화', col: '#ffb03a', tier: 1 },
  bike:    { label: '오토바이', sub: '진화', col: '#7ce8ff', tier: 2 },
  jeep:    { label: '무장 지프', sub: '진화', col: '#ffd24d', tier: 3 },
  soldier: { label: '병사 +1',  sub: '추가', col: '#6fd0ff', tier: -1 },
  power:   { label: '화력 +25%', sub: '강화', col: '#ff8a5a', tier: -2 },
  neg:     { label: '병사 -1',  sub: '손실', col: '#ff5a4d', tier: -3 }
};

/* at = 진행 거리(=15/s) */
const SCRIPT = [
  { at: 0,   type: 'barrel', x: -0.36, hp: 535,  z: 98,  rew: 'heavy' },
  { at: 0,   type: 'barrel', x:  0.38, hp: 412,  z: 108, rew: 'soldier' },
  { at: 34,  type: 'wave',   n: 8,  z: 114 },
  { at: 62,  type: 'barrel', x:  0.04, hp: 234,  z: 100, rew: 'bike' },
  { at: 104, type: 'wave',   n: 10, z: 116 },
  { at: 138, type: 'barrel', x:  0.54, hp: 153,  z: 96,  rew: 'power' },
  { at: 170, type: 'gate',   left: 'heavy',  right: 'soldier' },
  { at: 206, type: 'wave',   n: 12, z: 114 },
  { at: 232, type: 'barrel', x: -0.44, hp: 880,  z: 102, rew: 'jeep' },
  { at: 268, type: 'wave',   n: 14, z: 116 },
  { at: 300, type: 'gate',   left: 'bike',   right: 'jeep' },
  { at: 330, type: 'barrel', x:  0.46, hp: 1200, z: 98,  rew: 'jeep' },
  { at: 362, type: 'wave',   n: 18, z: 118 },
  { at: 396, type: 'gate',   left: 'power',  right: 'soldier' },
  { at: 424, type: 'barrel', x: -0.52, hp: 1500, z: 100, rew: 'bike' },
  { at: 452, type: 'wave',   n: 22, z: 116 },
  { at: 484, type: 'gate',   left: 'neg',    right: 'power' },
  { at: 512, type: 'barrel', x:  0.00, hp: 1800, z: 98,  rew: 'heavy' },
  { at: 540, type: 'wave',   n: 26, z: 118 },
  { at: 570, type: 'gate',   left: 'jeep',   right: 'soldier' },
  { at: 596, type: 'barrel', x:  0.48, hp: 2200, z: 100, rew: 'jeep' },
  { at: 614, type: 'wave',   n: 28, z: 118 }
];
SCRIPT.sort((a, b) => a.at - b.at);

/* ---------------- state ---------------- */
let G = null;
let buttons = [];
let TEST_FREEZE = false;

function mkSlot(tier) {
  return {
    tier: tier || 0,
    ph: Math.random() * 6.28,
    fireT: Math.random() * 0.12,
    muzzle: 0,
    recoil: 0,
    glow: 0,
    bob: Math.random() * 6.28
  };
}

function emptyState() {
  return {
    phase: 'start',
    stage: 1,
    t: 0, dist: 0, scrollZ: 0,
    slots: [mkSlot(0), mkSlot(0), mkSlot(0)],
    power: 1, score: 0, kills: 0,
    playerX: 0, targetX: 0,
    bullets: [], ebullets: [], entities: [], gates: [],
    popups: [], particles: [], booms: [], flyers: [], casings: [], rings: [],
    shake: 0, flash: 0, hitStop: 0,
    banner: null, gateText: null, gateT: 0,
    boss: null, bossSpawned: false, scriptIdx: 0,
    enemyMul: 1, barrelMul: 1,
    hurtT: 0, lastContact: -9, hint: 1, hintUsed: false, unitPulse: 0, dragging: false,
    endT: 0, saveShown: -9
  };
}

function resetRun(stage, phase) {
  const st = stage || 1;
  G = emptyState();
  G.stage = st;
  G.enemyMul = 1 + (st - 1) * 0.40;
  G.barrelMul = 1 + (st - 1) * 0.50;
  G.phase = phase || 'playing';
  if (G.phase !== 'start') {
    showBanner('STAGE ' + st, '3기로 시작 · 통을 깨서 진화!', '#8fe6ff', 1.8);
  }
}

function mkBarrel(x, hp, z, rew) {
  return {
    kind: 'barrel', x: x, z: z, hp: hp, maxhp: hp,
    w: 0.30, rew: rew || null,
    hitT: 0, sq: 0, flash: 0, dmgAcc: 0, popT: 0,
    seed: Math.random() * 9, dead: false, rot: Math.random() * 6.28
  };
}
function mkEnemy(x, z, hp) {
  return {
    kind: 'enemy', x: x, z: z, hp: hp, maxhp: hp, w: 0.075,
    ph: Math.random() * 6.28, hitT: 0, sq: 0, flash: 0,
    dmgAcc: 0, popT: 0, fireT: rand(1.8, 4.6), dead: false,
    spd: rand(0.92, 1.12), lane: rand(-0.26, 0.26)
  };
}

/* ---------------- spawning ---------------- */
function runScript() {
  while (G.scriptIdx < SCRIPT.length && G.dist >= SCRIPT[G.scriptIdx].at) {
    spawnEncounter(SCRIPT[G.scriptIdx++]);
  }
}
function spawnEncounter(s) {
  if (s.type === 'barrel') {
    G.entities.push(mkBarrel(s.x, Math.round(s.hp * G.barrelMul), Math.min(s.z || Z_SPAWN, Z_SPAWN), s.rew));
  } else if (s.type === 'wave') {
    spawnWave(s.n, s.z || 116);
  } else if (s.type === 'gate') {
    G.gates.push({ kind: 'gate', z: s.z || Z_SPAWN, left: s.left, right: s.right, applied: false, flash: 0, hitT: 0 });
  }
}

function spawnWave(n, z0) {
  const cols = Math.min(7, Math.max(5, Math.ceil(n / 2.6)));
  const rows = Math.ceil(n / cols);
  const baseHp = 26 + G.dist * 0.16;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const cnt = Math.min(cols, n - r * cols);
    const t = cnt === 1 ? 0.5 : c / (cnt - 1);
    const x = -0.74 + 1.48 * t + rand(-0.05, 0.05);
    const z = Math.min(Z_SPAWN + 14, z0 + r * 4.2 + rand(0, 1.8));
    G.entities.push(mkEnemy(x, z, Math.round((baseHp + rand(-6, 10)) * G.enemyMul)));
  }
}

/* ---------------- fx helpers ---------------- */
function shakeIt(v) { G.shake = Math.max(G.shake, v); }
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function showBanner(text, sub, color, t) { G.banner = { text: text, sub: sub, t: t || 1.9, color: color || '#fff' }; }

function addPopup(x, z, text, color, size, big, lift) {
  const zz = Math.max(z, 0.4);
  const p = project(zz);
  G.popups.push({
    sx: CX + bend(zz) + x * p.hw + rand(-10, 10),
    sy: p.y - (lift === undefined ? 30 : lift) * p.s - (big ? 26 : 0) + rand(-6, 4),
    text: text, color: color || '#fff',
    life: big ? 1.15 : 0.72, max: big ? 1.15 : 0.72,
    size: size || Math.max(12, 24 * p.s),
    vy: big ? -58 : -44
  });
}

function addParticles(sx, sy, n, colors, spread, spd, size, grav) {
  const g = grav === undefined ? 620 : grav;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = rand(spd * 0.35, spd);
    G.particles.push({
      sx: sx, sy: sy,
      vx: Math.cos(a) * v * spread,
      vy: Math.sin(a) * v - rand(30, 120),
      g: g,
      life: rand(0.3, 0.75), max: 0.75,
      size: rand(size * 0.45, size),
      color: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * 6.28, vr: rand(-11, 11),
      sq: rand(0.7, 1.4)
    });
  }
  if (G.particles.length > 460) G.particles.splice(0, G.particles.length - 460);
}

function addBoom(sx, sy, sc, big) {
  G.booms.push({ sx: sx, sy: sy, t: 0, life: big ? 0.6 : 0.42, sc: Math.max(0.45, sc || 1), big: !!big });
}
function addRing(sx, sy, r, col) {
  G.rings.push({ sx: sx, sy: sy, t: 0, life: 0.45, r: r, col: col || 'rgba(160,235,255,0.9)' });
}
function addCasing(sx, sy, dir) {
  G.casings.push({
    sx: sx, sy: sy,
    vx: (dir || 1) * rand(40, 90),
    vy: rand(-150, -80),
    rot: rand(0, 6.28), vr: rand(-16, 16),
    life: 0.75, max: 0.75
  });
  if (G.casings.length > 90) G.casings.shift();
}
/*__PART_B__*/

/* ===================== squad helpers ===================== */
/* 티어별 실루엣 폭(도로 반폭 기준) */
const UNIT_W = [0.255, 0.375, 0.335, 0.465];

function squadLayout(tiers) {
  const gap = 0.024;
  const raw = tiers.map(function (t) { return UNIT_W[t]; });
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i];
  const fit = Math.min(1, 1.60 / (sum + gap * (raw.length - 1)));
  const ws = raw.map(function (w) { return w * fit; });
  let total = 0;
  for (let i = 0; i < ws.length; i++) total += ws[i];
  total += gap * (ws.length - 1);
  let x = -total / 2;
  const off = [];
  for (let i = 0; i < ws.length; i++) { off.push(x + ws[i] / 2); x += ws[i] + gap; }
  return { off: off, total: total, fit: fit };
}

function curTiers() {
  return G.slots.map(function (s) { return s.tier; });
}

function slotPos(i, tiers) {
  const T = tiers || curTiers();
  const L = squadLayout(T);
  const p = project(Z_UNIT);
  const idx = clamp(i, 0, L.off.length - 1);
  const dx = L.off[idx];
  return {
    x: CX + bend(Z_UNIT) + (G.playerX + dx) * p.hw,
    y: p.y,
    sc: p.s * 1.5 * L.fit,
    dx: dx
  };
}

function clampPlayerX() {
  const L = squadLayout(curTiers());
  const lim = Math.max(0.05, 0.84 - L.total / 2);
  G.targetX = clamp(G.targetX, -lim, lim);
  G.playerX = clamp(G.playerX, -lim, lim);
}
function squadDps() {
  let d = 0;
  for (let i = 0; i < G.slots.length; i++) d += TIER[G.slots[i].tier].dps;
  return d * G.power;
}

/* ===================== main update ===================== */
function update(dt) {
  G.t += dt;
  updateFx(dt);
  if (G.hitStop > 0) { G.hitStop -= dt; return; }
  if (G.phase !== 'playing') return;

  G.playerX += (G.targetX - G.playerX) * Math.min(1, dt * 16);
  clampPlayerX();

  G.scrollZ += CFG.speed * dt;
  G.dist += CFG.speed * dt;

  runScript();

  if (!G.bossSpawned && G.dist >= CFG.bossAt) {
    G.bossSpawned = true;
    spawnBoss();
  }

  updateSquad(dt);
  updateBullets(dt);
  updateEntities(dt);
  updateGates(dt);
  updateBoss(dt);
  updateEnemyBullets(dt);

  if (G.hint > 0 && G.t > 6) G.hint = Math.max(0, G.hint - dt * 0.7);
}

function updateSquad(dt) {
  for (let i = 0; i < G.slots.length; i++) {
    const s = G.slots[i];
    const T = TIER[s.tier];
    s.ph += dt * (9.4 + s.tier * 1.1);
    s.fireT -= dt;
    if (s.muzzle > 0) s.muzzle -= dt;
    if (s.recoil > 0) s.recoil = Math.max(0, s.recoil - dt * 7.5);
    if (s.glow > 0) s.glow = Math.max(0, s.glow - dt * 1.5);
    if (s.fireT <= 0) {
      s.fireT += 1 / T.rate;
      fireSlot(i, T);
    }
  }
}

function pickAim(x0) {
  const cands = [];
  for (let i = 0; i < G.entities.length; i++) {
    const e = G.entities[i];
    if (e.dead) continue;
    if (Math.abs(e.x - x0) < 0.30 + e.w) cands.push(e);
  }
  if (!cands.length) {
    const b = G.boss;
    if (b && !b.dying && Math.abs(b.x - x0) < 0.55) return b.x;
    return x0 + rand(-0.05, 0.05);
  }
  cands.sort((a, c) => a.z - c.z);
  const m = Math.min(3, cands.length);
  return cands[(Math.random() * m) | 0].x;
}

function fireSlot(i, T) {
  const s = G.slots[i];
  s.recoil = 1;
  s.muzzle = T.bullets > 1 ? 0.07 : 0.055;
  const x0 = G.playerX + slotPos(i).dx;
  const n = T.bullets || 1;
  const dmg = (T.dps * G.power) / T.rate / n;
  for (let k = 0; k < n; k++) {
    const off = n === 1 ? 0 : (k - 0.5) * 0.03;
    const aim = pickAim(x0 + off);
    G.bullets.push({
      kind: 'bullet',
      x: x0 + off, x0: x0 + off,
      x1: aim + off * 1.3,
      z: Z_UNIT + 1.2,
      dmg: dmg,
      sp: s.tier,
      w: s.tier === 3 ? 2.3 : s.tier === 1 ? 1.5 : 1,
      splash: T.splash || 0
    });
  }
  if (s.tier === 1) sfx.heavyShot();
  else if (s.tier === 3) sfx.jeepShot();
  else sfx.shot();

  if (s.tier <= 1) {
    const p = slotPos(i);
    if (Math.random() < 0.8) addCasing(p.x + 11 * p.sc, p.y - 62 * p.sc, 1);
  }
}

function updateBullets(dt) {
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.z += CFG.bulletSpeed * dt;
    b.x = lerp(b.x0, b.x1, Math.min(1, b.z / 40));
    let hit = null;
    const boss = G.boss;
    if (boss && !boss.dying && Math.abs(b.x - boss.x) < 0.40 && b.z > boss.z - 4.4 && b.z < boss.z + 5.2) hit = boss;
    if (!hit) {
      for (let k = 0; k < G.entities.length; k++) {
        const e = G.entities[k];
        if (e.dead) continue;
        if (Math.abs(b.x - e.x) < e.w + 0.012 && Math.abs(b.z - e.z) < 2.4) { hit = e; break; }
      }
    }
    if (hit) {
      if (hit === boss) damageBoss(b.dmg, b.x);
      else damageEntity(hit, b.dmg, b.x);
      if (b.splash) splashDamage(b, hit);
      G.bullets.splice(i, 1);
      continue;
    }
    if (b.z > Z_SPAWN + 10) G.bullets.splice(i, 1);
  }
}

function splashDamage(b, skip) {
  const p = project(clamp(b.z, 0.5, Z_SPAWN));
  const sx = CX + bend(clamp(b.z, 0.5, Z_SPAWN)) + b.x * p.hw;
  if (Math.random() < 0.45) {
    addParticles(sx, p.y - 24 * p.s, 6, ['#ffe9b0', '#ffb03a', '#ffffff'], 1.6, 260, 5 * Math.max(0.4, p.s), 420);
    addBoom(sx, p.y - 20 * p.s, p.s * 0.7, false);
  }
  for (let k = 0; k < G.entities.length; k++) {
    const e = G.entities[k];
    if (e.dead || e === skip) continue;
    if (Math.abs(e.x - b.x) < b.splash + e.w * 0.5 && Math.abs(e.z - b.z) < 8) {
      damageEntity(e, b.dmg * 0.45, e.x);
    }
  }
}

/* ===================== damage ===================== */
function damageEntity(e, amt, bx) {
  if (!e || e.dead) return;
  e.hp -= amt;
  e.hitT = 0.12;
  e.flash = 0.06;
  e.sq = Math.min(1.2, e.sq + 0.7);
  e.dmgAcc += amt;
  G.score += amt * 0.3;

  const pz = Math.max(e.z, 0.5);
  const p = project(pz);
  const sx = CX + bend(pz) + (bx === undefined ? e.x : bx) * p.hw;
  const sy = p.y - (e.kind === 'barrel' ? 44 : 22) * p.s;

  if (Math.random() < 0.75) {
    addParticles(sx, sy, 3, ['#ffe9b0', '#ffffff', '#ffd08a'], 1.5, 260, 4.4 * Math.max(0.45, p.s), 520);
  }
  if (e.kind === 'barrel' && Math.random() < 0.55) {
    addParticles(sx + rand(-8, 8), sy + 6 * p.s, 2, ['#c98a44', '#8a5522', '#e6c088'], 1.4, 230, 5.4 * Math.max(0.4, p.s), 760);
  }
  if (Math.random() < 0.1) shakeIt(2.6);
  sfx.punch(0.85);

  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    if (e.kind === 'barrel') breakBarrel(e);
    else killEnemy(e);
  }
}

function killEnemy(e) {
  const pz = Math.max(e.z, 0.5);
  const p = project(pz);
  const sx = CX + bend(pz) + e.x * p.hw;
  addParticles(sx, p.y - 16 * p.s, 9, ['#e0553a', '#a8231d', '#ffd0a0', '#ffffff'], 1.35, 240, 6 * Math.max(0.4, p.s), 720);
  G.kills++;
  G.score += 55;
  sfx.squish();
}

function breakBarrel(e) {
  const pz = Math.max(e.z, 0.6);
  const p = project(pz);
  const sx = CX + bend(pz) + e.x * p.hw;
  const sy = p.y - 44 * p.s;
  const big = e.maxhp > 900;

  addParticles(sx, sy, big ? 42 : 26, ['#c98a44', '#8a5522', '#e0b070', '#6b3f14', '#ffe9b0'], 2.0, 420, 10 * Math.max(0.4, p.s), 900);
  addParticles(sx, sy, 14, ['#fff6d8', '#ffe9b0'], 2.2, 460, 5 * p.s, 400);
  addBoom(sx, sy, p.s * 1.15, big);
  addRing(sx, sy, 60 * p.s, 'rgba(255,214,140,0.85)');

  G.score += 260 + e.maxhp * 1.1;
  shakeIt(big ? 20 : 14);
  G.flash = Math.max(G.flash, big ? 0.30 : 0.20);
  G.hitStop = big ? 0.055 : 0.035;
  vibrate(big ? [18, 12, 40] : [14, 8, 26]);
  sfx.barrelBreak(big);
  addPopup(e.x, e.z, big ? '통 파괴!' : '파괴!', '#ffe066', 0, true, 60);

  if (e.rew) launchReward(e);
}

function launchReward(e) {
  const R = REW[e.rew];
  if (!R) return;
  const plan = planReward(e.rew);
  const pz = Math.max(e.z, 0.6);
  const p = project(pz);
  G.flyers.push({
    kind: 'flyer',
    rew: e.rew,
    plan: plan,
    x0: CX + bend(pz) + e.x * p.hw,
    y0: p.y - 86 * p.s,
    u: 0,
    dur: 0.66,
    spin: Math.random() * 6.28,
    arc: rand(80, 150),
    trailT: 0
  });
  sfx.splinter();
}

function planReward(rew) {
  if (rew === 'soldier') {
    if (G.slots.length < CFG.maxSlots) return { add: true, idx: G.slots.length };
    return { power: true, idx: 0 };
  }
  if (rew === 'power') return { power: true, idx: 0 };
  const tier = REW[rew].tier;
  let idx = -1, low = 99;
  for (let i = 0; i < G.slots.length; i++) {
    const t = G.slots[i].tier;
    if (t < tier && t < low) { low = t; idx = i; }
  }
  if (idx < 0) return { power: true, idx: 0 };
  return { idx: idx, tier: tier };
}

function grantReward(rew) {
  const R = REW[rew];
  if (!R) return null;
  if (rew === 'soldier' || rew === 'power') {
    if (rew === 'soldier' && G.slots.length < CFG.maxSlots) {
      G.slots.push(mkSlot(0));
      const i = G.slots.length - 1;
      G.slots[i].glow = Math.random() * 6.28;
      return { text: '병사 +1', col: R.col, idx: i };
    }
    G.power = Math.min(4, G.power + 0.25);
    return { text: '화력 +25%', col: '#ff8a5a' };
  }
  const plan = planReward(rew);
  if (plan.power) {
    G.power = Math.min(4, G.power + 0.25);
    return { text: '화력 +25%', col: '#ff8a5a' };
  }
  const s = G.slots[plan.idx];
  s.tier = plan.tier;
  s.glow = 1;
  s.fireT = 0.08;
  return { text: R.label + ' 진화!', col: R.col, idx: plan.idx, tier: plan.tier, big: true };
}

function applyRewardFlyer(f) {
  const plan = f.plan;
  let res = null;
  if (plan.add) {
    if (G.slots.length < CFG.maxSlots) {
      G.slots.push(mkSlot(0));
      const i = G.slots.length - 1;
      G.slots[i].glow = 1;
      res = { text: '병사 +1', col: '#6fd0ff', idx: i };
    } else {
      G.power = Math.min(4, G.power + 0.25);
      res = { text: '화력 +25%', col: '#ff8a5a' };
    }
  } else if (plan.power) {
    G.power = Math.min(4, G.power + 0.25);
    res = { text: '화력 +25%', col: '#ff8a5a' };
  } else if (plan.idx < G.slots.length) {
    const s = G.slots[plan.idx];
    s.tier = plan.tier;
    s.glow = 1;
    s.fireT = 0.06;
    res = { text: REW[f.rew].label + ' 진화!', col: REW[f.rew].col, idx: plan.idx, tier: plan.tier, big: true };
  } else {
    G.power = Math.min(4, G.power + 0.25);
    res = { text: '화력 +25%', col: '#ff8a5a' };
  }

  const idx = res.idx === undefined ? 0 : res.idx;
  const sp = slotPos(idx);
  addRing(sp.x, sp.y - 34 * sp.sc, 46 * sp.sc, res.col);
  addParticles(sp.x, sp.y - 28 * sp.sc, 18, [res.col, '#ffffff'], 1.7, 300, 6 * sp.sc, 420);
  addPopup(G.playerX, Z_UNIT + 2, res.text, res.col, 16, true, 104);
  G.unitPulse = 0.8;

  if (res.big) {
    sfx.evolve();
    shakeIt(13);
    vibrate([16, 10, 34]);
    G.hitStop = 0.03;
  } else {
    sfx.powerup();
    vibrate([10, 6, 18]);
  }
}

/* ===================== entities ===================== */
function updateEntities(dt) {
  for (let i = G.entities.length - 1; i >= 0; i--) {
    const e = G.entities[i];
    const mul = e.kind === 'enemy' ? (0.85 + e.spd * 0.35) : 1;
    e.z -= (CFG.speed * mul) * dt;

    if (e.kind === 'enemy') {
      const k = e.z < 52 ? Math.min(1, (52 - e.z) / 34) : 0;
      if (k > 0) {
        const tgt = G.playerX + (e.lane || 0);
        e.x += (tgt - e.x) * Math.min(1, dt * 1.35 * k);
      }
    }

    if (e.hitT > 0) e.hitT -= dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.popT > 0) e.popT -= dt;
    if (e.sq > 0) e.sq = Math.max(0, e.sq - dt * 6.5);

    if (e.dmgAcc >= 0.6 && e.popT <= 0) {
      addPopup(e.x, e.z + 1.4, '-' + Math.max(1, Math.round(e.dmgAcc)),
        e.kind === 'barrel' ? '#ffe066' : '#ffd0c0',
        0, false, e.kind === 'barrel' ? 104 : 40);
      e.dmgAcc = 0;
      e.popT = 0.2;
    }

    if (e.kind === 'enemy') {
      e.ph += dt * 11;
      if (e.z < 28 && e.z > 3.5) {
        e.fireT -= dt;
        if (e.fireT <= 0 && G.ebullets.length < 7) {
          e.fireT = rand(2.8, 5.4);
          G.ebullets.push({ kind: 'ebullet', x: e.x, z: e.z - 2, vz: 74, boss: false });
          noiseBurst(0.04, 0.028, 950, 3);
        }
      }
      if (e.z <= 1.3) {
        e.dead = true;
        G.entities.splice(i, 1);
        hitSquad(1, 'contact');
        continue;
      }
    } else if (e.kind === 'barrel') {
      if (e.z <= 1.1) {
        e.dead = true;
        G.entities.splice(i, 1);
        const p = project(1.1);
        const sx = CX + bend(1.1) + e.x * p.hw;
        addParticles(sx, p.y - 40, 22, ['#c98a44', '#8a5522', '#e0b070'], 1.8, 320, 8, 800);
        addPopup(e.x, 2, '으악!', '#ff5a5a', 22, true, 60);
        G.flash = Math.max(G.flash, 0.34);
        sfx.barrelBreak(false);
        hitSquad(1, 'barrel', true);
        continue;
      }
    }
    if (e.dead) G.entities.splice(i, 1);
  }
}

function hitSquad(n, why, force) {
  if (G.phase !== 'playing') return;
  if (!force && G.t - G.lastContact < CFG.contactCd) return;
  G.lastContact = G.t;
  for (let k = 0; k < (n || 1); k++) {
    if (G.slots.length > 1) {
      G.slots.pop();
    } else {
      gameOver();
      return;
    }
  }
  G.hurtT = 0.6;
  G.flash = Math.max(G.flash, 0.32);
  shakeIt(15);
  vibrate([30, 16, 30]);
  sfx.hurt();
}

/* ===================== gates ===================== */
function updateGates(dt) {
  for (let i = G.gates.length - 1; i >= 0; i--) {
    const g = G.gates[i];
    g.z -= CFG.speed * dt;
    if (g.flash > 0) g.flash -= dt;
    if (g.hitT > 0) g.hitT -= dt;
    if (!g.applied && g.z <= 2.4) {
      g.applied = true;
      g.flash = 0.7;
      const key = G.playerX < 0 ? g.left : g.right;
      applyGate(key);
    }
    if (g.z < -3) G.gates.splice(i, 1);
  }
}

function applyGate(key) {
  const o = GATE[key];
  if (!o) return;
  if (key === 'neg') {
    hitSquad(1, 'gate', true);
    G.gateText = { text: '-1기', sub: '병사 손실', good: false };
    G.gateT = 1.4;
    return;
  }
  const res = grantReward(key);
  if (!res) return;
  G.gateText = { text: res.text, sub: res.big ? '상위 클래스 진화' : '강화', good: true };
  G.gateT = 1.5;
  if (res.big) {
    sfx.evolve();
    shakeIt(12);
    vibrate([14, 10, 30]);
  } else {
    sfx.gate();
  }
  const idx = res.idx === undefined ? 0 : res.idx;
  const sp = slotPos(idx);
  addRing(sp.x, sp.y - 30 * sp.sc, 40 * sp.sc, res.col);
}

/* ===================== boss ===================== */
function spawnBoss() {
  const hp = Math.round(Math.max(28000, squadDps() * 8.0) * (1 + (G.stage - 1) * 0.5));
  G.boss = {
    kind: 'boss', x: 0, z: 62, hp: hp, maxhp: hp,
    ph: 0, fireT: 2.6, sumT: 4.0, hitT: 0, sq: 0, flash: 0,
    dmgAcc: 0, popT: 0, dying: false, dieT: 0, step: 0
  };
  showBanner('BOSS 등장!', '빨간 군단 총공격', '#ff6b6b', 2.2);
  shakeIt(20);
  G.flash = Math.max(G.flash, 0.2);
  sfx.bossIn();
  vibrate([0, 60, 40, 60, 120]);
  spawnWave(18, 104);
}

function updateBoss(dt) {
  const b = G.boss;
  if (!b) return;
  if (b.dying) {
    b.dieT -= dt;
    if (b.dieT <= 0) stageClear();
    return;
  }
  b.z += (17 - b.z) * Math.min(1, dt * 0.55);
  b.ph += dt;
  b.x = Math.sin(b.ph * 0.8) * 0.26;
  b.step += dt * 5.2;
  if (b.hitT > 0) b.hitT -= dt;
  if (b.flash > 0) b.flash -= dt;
  if (b.popT > 0) b.popT -= dt;
  if (b.sq > 0) b.sq = Math.max(0, b.sq - dt * 6);
  if (b.dmgAcc >= b.maxhp * 0.06 && b.popT <= 0) {
    addPopup(b.x + rand(-0.2, 0.2), b.z, '-' + Math.round(b.dmgAcc / 100) * 100, '#ffe066', 0, false, 300);
    b.dmgAcc = 0;
    b.popT = 0.45;
  }
  b.fireT -= dt;
  if (b.fireT <= 0) {
    b.fireT = 1.9;
    G.ebullets.push({ kind: 'ebullet', x: b.x, z: b.z - 3, vz: 52, boss: true });
    tone(160, 70, 0.2, 'sawtooth', 0.08);
  }
  b.sumT -= dt;
  if (b.sumT <= 0) {
    b.sumT = 8.0;
    spawnWave(5, 66);
  }
  // 아군 지원군 (보스전 동안 5초마다 1기 보충)
  b.helpT = (b.helpT === undefined ? 5.0 : b.helpT) - dt;
  if (b.helpT <= 0) {
    b.helpT = 6.0;
    if (G.slots.length < CFG.maxSlots) {
      G.slots.push(mkSlot(Math.min(2, G.stage)));
      const i = G.slots.length - 1;
      G.slots[i].glow = 1;
      const sp = slotPos(i);
      addRing(sp.x, sp.y - 34 * sp.sc, 44 * sp.sc, '#8fe6ff');
      addPopup(G.playerX, Z_UNIT + 2, '지원군 합류!', '#8fe6ff', 15, true, 96);
      sfx.powerup();
      vibrate([12, 8, 20]);
    }
  }
}

function damageBoss(amt, bx) {
  const b = G.boss;
  if (!b || b.dying) return;
  b.hp -= amt;
  b.hitT = 0.09;
  b.flash = 0.055;
  b.sq = Math.min(1, b.sq + 0.30);
  b.dmgAcc += amt;
  G.score += amt * 0.3;
  if (Math.random() < 0.5) {
    const p = project(b.z);
    const sx = CX + bend(b.z) + (bx === undefined ? b.x : bx) * p.hw + rand(-26, 26) * p.s;
    addParticles(sx, p.y - rand(80, 210) * p.s, 3, ['#ffe9b0', '#ffffff', '#ffb03a'], 1.3, 240, 4.6 * p.s, 500);
  }
  if (amt > 24) sfx.punch(1.1);
  if (b.hp <= 0) {
    b.hp = 0;
    b.dying = true;
    b.dieT = 1.8;
    shakeIt(24);
    G.flash = 0.55;
    G.hitStop = 0.09;
    vibrate([0, 50, 40, 50, 120]);
    const p = project(b.z);
    const sx = CX + bend(b.z) + b.x * p.hw;
    addParticles(sx, p.y - 150 * p.s, 64, ['#ffce4d', '#ff7a3d', '#ffffff', '#c8322c'], 2.1, 460, 13, 800);
    addBoom(sx, p.y - 120 * p.s, p.s * 1.5, true);
    sfx.barrelBreak(true);
    sfx.win();
  }
}

function stageClear() {
  G.phase = 'clear';
  G.score += 3000 + G.slots.length * 200 + G.stage * 600;
  sfx.win();
}
function gameOver() {
  if (G.phase !== 'playing') return;
  G.phase = 'dead';
  G.endT = 0;
  sfx.lose();
}

/* ===================== enemy bullets ===================== */
function updateEnemyBullets(dt) {
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.z -= b.vz * dt;
    if (b.z <= 1.0) {
      const p = project(1.0);
      const sx = CX + bend(1.0) + b.x * p.hw;
      addParticles(sx, p.y - 12, 6, ['#ff7a4d', '#ffd0a0'], 1, 200, 6, 500);
      G.ebullets.splice(i, 1);
      if (Math.abs(b.x - G.playerX) < (b.boss ? 0.16 : 0.13)) {
        hitSquad(1, b.boss ? 'bossfire' : 'fire');
      }
      continue;
    }
    if (b.z > Z_SPAWN) G.ebullets.splice(i, 1);
  }
}

/* ===================== fx update ===================== */
function updateFx(dt) {
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 42);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.9);
  if (G.hurtT > 0) G.hurtT = Math.max(0, G.hurtT - dt * 1.8);
  if (G.unitPulse > 0) G.unitPulse = Math.max(0, G.unitPulse - dt * 1.6);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (G.gateText) { G.gateT -= dt; if (G.gateT <= 0) G.gateText = null; }

  for (let i = G.popups.length - 1; i >= 0; i--) {
    const p = G.popups[i];
    p.life -= dt;
    p.sy += p.vy * dt;
    p.vy += 26 * dt;
    if (p.life <= 0) G.popups.splice(i, 1);
  }
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.life -= dt;
    q.sx += q.vx * dt;
    q.sy += q.vy * dt;
    q.vy += q.g * dt;
    q.rot += q.vr * dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.booms.length - 1; i >= 0; i--) {
    const b = G.booms[i];
    b.t += dt;
    if (b.t >= b.life) G.booms.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.t += dt;
    if (r.t >= r.life) G.rings.splice(i, 1);
  }
  for (let i = G.casings.length - 1; i >= 0; i--) {
    const c = G.casings[i];
    c.life -= dt;
    c.sx += c.vx * dt;
    c.sy += c.vy * dt;
    c.vy += 700 * dt;
    c.rot += c.vr * dt;
    if (c.life <= 0) G.casings.splice(i, 1);
  }
  /* 보상 비행체 */
  for (let i = G.flyers.length - 1; i >= 0; i--) {
    const f = G.flyers[i];
    f.u += dt / f.dur;
    f.spin += dt * 9;
    f.trailT -= dt;
    if (f.trailT <= 0) {
      f.trailT = 0.03;
      const pos = flyerPos(f);
      G.particles.push({
        sx: pos.x, sy: pos.y, vx: rand(-14, 14), vy: rand(-20, 10), g: 0,
        life: 0.34, max: 0.34, size: rand(2, 4.4),
        color: REW[f.rew] ? REW[f.rew].col : '#fff', rot: 0, vr: 0, sq: 1
      });
    }
    if (f.u >= 1) {
      applyRewardFlyer(f);
      G.flyers.splice(i, 1);
    }
  }
}

function flyerPos(f) {
  const plan = f.plan;
  let tiers = curTiers();
  let idx = 0;
  if (plan.add) {
    if (tiers.length < CFG.maxSlots) { tiers = tiers.concat([0]); idx = tiers.length - 1; }
    else idx = tiers.length - 1;
  } else if (plan.power) {
    idx = 0;
  } else {
    tiers = tiers.slice();
    if (plan.idx < tiers.length) tiers[plan.idx] = plan.tier;
    idx = Math.min(plan.idx, tiers.length - 1);
  }
  const target = slotPos(idx, tiers);
  const u = Math.min(1, f.u);
  const ty = target.y - 46 * target.sc;
  return {
    x: lerp(f.x0, target.x, easeOut(u)),
    y: lerp(f.y0, ty, u) - Math.sin(Math.PI * u) * f.arc,
    sc: target.sc,
    u: u
  };
}

function roadPts(zNear, zFar, halfMul, N) {
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const z = zNear + (zFar - zNear) * (i / N);
    const p = project(z);
    pts.push({ x: CX + bend(z) - p.hw * halfMul, y: p.y });
  }
  for (let i = N; i >= 0; i--) {
    const z = zNear + (zFar - zNear) * (i / N);
    const p = project(z);
    pts.push({ x: CX + bend(z) + p.hw * halfMul, y: p.y });
  }
  return pts;
}

function drawRoadShape(zNear, zFar, halfMul, fill) {
  const pts = roadPts(zNear, zFar, halfMul, 20);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawRoad() {
  drawRoadShape(-8, Z_SPAWN, 1.10, '#9c8d70');

  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#7e8488');
  g.addColorStop(0.30, '#71767a');
  g.addColorStop(1, '#5c6165');
  drawRoadShape(-8, Z_SPAWN, 1.0, g);

  // 아스팔트 결
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#2f3438';
  ctx.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    const z = ((i * 11 - G.scrollZ * 0.9) % (Z_SPAWN + 30));
    if (z < 0) continue;
    const p1 = project(z), p2 = project(Math.min(Z_SPAWN, z + 3));
    if (p1.y - p2.y < 2) continue;
    const xx = CX + bend(z) + Math.sin(i * 3.3) * p1.hw * 0.7;
    ctx.beginPath();
    ctx.moveTo(xx, p1.y);
    ctx.lineTo(xx + 6 * p1.s, p2.y);
    ctx.stroke();
  }
  ctx.restore();

  // 중앙 점선
  const dashLen = 7, gap = 7;
  const period = dashLen + gap;
  const off = G.scrollZ % period;
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  for (let k = -2; k < 14; k++) {
    const z0 = k * period - off;
    const z1 = z0 + dashLen;
    if (z1 < -6 || z0 > Z_SPAWN) continue;
    drawRoadShape(Math.max(-6, z0), Math.min(Z_SPAWN, z1), 0.030, 'rgba(255,255,255,0.72)');
  }

  // 가장자리 흰 선
  drawRoadShape(-8, Z_SPAWN, 0.968, 'rgba(255,255,255,0.55)');
  ctx.save();
  drawRoadShape(-8, Z_SPAWN, 0.955, 'rgba(0,0,0,0)');
  ctx.restore();
}

function drawRails() {
  const N = 22;
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < N; i++) {
      const z0 = -8 + (Z_SPAWN + 8) * (i / N);
      const z1 = -8 + (Z_SPAWN + 8) * ((i + 1) / N);
      const p0 = project(z0), p1 = project(z1);
      if (p0.y - p1.y < 1.2) continue;
      const x0 = CX + bend(z0) + side * p0.hw * 1.045;
      const x1 = CX + bend(z1) + side * p1.hw * 1.045;
      const x0b = CX + bend(z0) + side * p0.hw * 1.16;
      const x1b = CX + bend(z1) + side * p1.hw * 1.16;
      const h0 = 26 * p0.s, h1 = 26 * p1.s;
      const shade = 0.62 + 0.34 * (1 - i / N);
      ctx.fillStyle = 'rgba(' + Math.round(206 * shade) + ',' + Math.round(203 * shade) + ',' + Math.round(196 * shade) + ',1)';
      ctx.beginPath();
      ctx.moveTo(x0, p0.y);
      ctx.lineTo(x1, p1.y);
      ctx.lineTo(x1, p1.y - h1);
      ctx.lineTo(x0, p0.y - h0);
      ctx.closePath();
      ctx.fill();
      // 상단 뚜껑
      ctx.fillStyle = 'rgba(150,148,142,0.9)';
      ctx.beginPath();
      ctx.moveTo(x0, p0.y - h0);
      ctx.lineTo(x1, p1.y - h1);
      ctx.lineTo(x1b, p1.y - h1);
      ctx.lineTo(x0b, p0.y - h0);
      ctx.closePath();
      ctx.fill();
    }
  }
}
