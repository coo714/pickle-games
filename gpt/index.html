<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101c2b">
<title>LAST SQUAD : SURVIVAL</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #101c2b;
    font-family: Arial, "Malgun Gothic", sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #172b36;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#hud {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    gap: 7px;
    pointer-events: none;
    z-index: 5;
}

.hud-box {
    flex: 1;
    padding: 10px 4px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 12px;
    background: rgba(10,22,39,.86);
    box-shadow: 0 4px 0 rgba(0,0,0,.22);
    text-align: center;
    backdrop-filter: blur(5px);
}

.hud-label {
    color: #a6bbce;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.hud-value {
    color: white;
    font-size: 23px;
    font-weight: 900;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
}

#unitCount {
    color: #52d8ff;
}

#progress {
    position: absolute;
    top: max(96px, calc(env(safe-area-inset-top) + 78px));
    left: 24px;
    right: 24px;
    height: 7px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    overflow: hidden;
    pointer-events: none;
}

#progressFill {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg,#147aff,#58eaff);
    transition: width .15s linear;
}

#soundButton {
    position: absolute;
    right: 14px;
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    background: rgba(12,24,38,.8);
    color: white;
    font-size: 19px;
    z-index: 12;
    cursor: pointer;
}

#hint {
    position: absolute;
    bottom: max(27px, calc(env(safe-area-inset-bottom) + 12px));
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.7);
    font-weight: 700;
    letter-spacing: 1px;
    pointer-events: none;
}

#banner {
    position: absolute;
    top: 34%;
    left: 0;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: clamp(28px,8vw,48px);
    font-weight: 1000;
    font-style: italic;
    text-shadow: 0 4px 0 #12334b,0 0 25px #32bcff;
    pointer-events: none;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .2s, transform .25s;
    z-index: 8;
}

#banner.visible {
    opacity: 1;
    transform: scale(1);
}

#banner.danger {
    color: #ff524b;
    text-shadow: 0 4px 0 #591512,0 0 25px #ff3020;
}

.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 28px;
    background: linear-gradient(
        180deg,
        rgba(7,18,33,.88),
        rgba(7,18,33,.55),
        rgba(7,18,33,.96)
    );
    z-index: 20;
    text-align: center;
}

.hidden {
    display: none !important;
}

.eyebrow {
    color: #72e4ff;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 900;
    margin-bottom: 14px;
}

.logo {
    color: #fff;
    font-size: clamp(45px,13vw,78px);
    line-height: .86;
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -3px;
    text-shadow: 0 5px 0 #153c62,0 8px 20px #000;
}

.subtitle {
    color: #ffca48;
    font-size: 25px;
    letter-spacing: 7px;
    font-weight: 900;
    margin-top: 16px;
}

.description {
    color: #b8cddd;
    font-size: 14px;
    line-height: 1.9;
    margin: 32px 0;
}

.main-button {
    border: 0;
    border-bottom: 6px solid #a66b05;
    border-radius: 15px;
    width: min(280px,90%);
    padding: 19px 12px;
    background: linear-gradient(#ffe17b,#ffb522);
    color: #312207;
    font-size: 23px;
    font-weight: 1000;
    box-shadow: 0 10px 35px rgba(255,181,34,.22);
    cursor: pointer;
    touch-action: manipulation;
}

.main-button:active {
    transform: translateY(4px);
    border-bottom-width: 2px;
}

.small-note {
    color: #8197ab;
    font-size: 11px;
    margin-top: 23px;
    letter-spacing: 1px;
}

#resultTitle {
    color: #ff6262;
    font-size: 43px;
    font-weight: 1000;
    font-style: italic;
    text-shadow: 0 4px 0 #631b20;
}

.result-panel {
    width: min(300px,100%);
    margin: 26px 0;
    padding: 12px 20px;
    background: rgba(19,39,58,.9);
    border: 1px solid #34516a;
    border-radius: 16px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    color: #a9bfd1;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,.09);
}

.result-row:last-child {
    border: 0;
}

.result-row strong {
    color: white;
    font-size: 17px;
}

@media (min-width: 650px) {
    #game {
        width: min(100vw,46.2085dvh);
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 100px #000;
    }
}
</style>
</head>
<body>

<div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div class="hud-box">
            <div class="hud-label">SQUAD</div>
            <div class="hud-value" id="unitCount">12</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">STAGE</div>
            <div class="hud-value" id="stageCount">01</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">TIME</div>
            <div class="hud-value" id="timeCount">00:00</div>
        </div>
    </div>

    <div id="progress">
        <div id="progressFill"></div>
    </div>

    <div id="banner"></div>
    <div id="hint">← 좌우로 드래그하여 이동 →</div>
    <button id="soundButton" aria-label="소리 켜기 또는 끄기">♪</button>

    <div class="overlay" id="startScreen">
        <div class="eyebrow">TACTICAL SURVIVAL</div>
        <div class="logo">LAST<br>SQUAD</div>
        <div class="subtitle">SURVIVAL</div>
        <div class="description">
            적군의 포위망을 돌파하라!<br>
            숫자 게이트로 병력을 증원하고<br>
            거대한 보스를 처치하세요.
        </div>
        <button class="main-button" id="startButton">전투 시작 ▶</button>
        <div class="small-note">좌우 드래그 · 자동 사격 · 무한 스테이지</div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
        <div class="eyebrow">MISSION FAILED</div>
        <div id="resultTitle">GAME OVER</div>

        <div class="result-panel">
            <div class="result-row">
                도달 스테이지
                <strong id="resultStage">1</strong>
            </div>
            <div class="result-row">
                생존 시간
                <strong id="resultTime">00:00</strong>
            </div>
            <div class="result-row">
                처치한 적
                <strong id="resultKills">0</strong>
            </div>
            <div class="result-row">
                최대 병력
                <strong id="resultMax">0</strong>
            </div>
            <div class="result-row">
                최고 점수
                <strong id="resultBest">0</strong>
            </div>
        </div>

        <button class="main-button" id="restartButton">다시 도전 ↻</button>
        <div class="small-note">더 많은 병력을 모아 살아남으세요.</div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   기본 설정
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const game = document.getElementById("game");

const ui = {
    units: document.getElementById("unitCount"),
    stage: document.getElementById("stageCount"),
    time: document.getElementById("timeCount"),
    progress: document.getElementById("progressFill"),
    banner: document.getElementById("banner"),
    hint: document.getElementById("hint"),
    start: document.getElementById("startScreen"),
    over: document.getElementById("gameOverScreen"),
    sound: document.getElementById("soundButton")
};

const W = 390;
const H = 844;

const HORIZON = 145;
const ROAD_BOTTOM = 865;
const ROAD_FAR = 30;
const ROAD_NEAR = 225;
const PLAYER_Z = 0.82;
const MAX_UNITS = 250;

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));

let screenScaleX = 1;
let screenScaleY = 1;
let dpr = 1;

let mode = "menu";
let lastFrame = 0;
let elapsed = 0;
let stage = 1;
let stageTime = 0;
let stageDuration = 20;
let units = 12;
let maxUnits = 12;
let kills = 0;
let score = 0;
let best = 0;

let roadOffset = 0;
let shake = 0;
let damageFlash = 0;
let gainFlash = 0;
let recoil = 0;
let muzzle = 0;

let enemyTimer = 0;
let crateTimer = 0;
let gateTimer = 0;
let shootTimer = 0;
let transitionTimer = 0;
let bannerTimer = 0;
let bossSpawned = false;
let stageClearing = false;

let enemies = [];
let crates = [];
let gates = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let popups = [];
let scenery = [];
let boss = null;

let dragging = false;
let pointerId = null;

const player = {
    x: 0,
    targetX: 0,
    invulnerable: 0
};

try {
    best = Number(localStorage.getItem("lastSquadBest") || 0);
} catch (error) {
    best = 0;
}

/* =========================================================
   화면 크기 및 고해상도 대응
========================================================= */

function resize() {
    const rect = game.getBoundingClientRect();

    dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    screenScaleX = canvas.width / W;
    screenScaleY = canvas.height / H;

    ctx.setTransform(screenScaleX, 0, 0, screenScaleY, 0, 0);
    ctx.imageSmoothingEnabled = true;
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
}

resize();

/* =========================================================
   WebAudio 효과음
========================================================= */

let audio = null;
let masterGain = null;
let noiseBuffer = null;
let muted = false;
let lastShotSound = 0;
let lastHitSound = 0;

function initAudio() {
    try {
        if (!audio) {
            const AudioClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioClass) return;

            audio = new AudioClass();

            masterGain = audio.createGain();
            masterGain.gain.value = muted ? 0 : 0.3;
            masterGain.connect(audio.destination);

            noiseBuffer = audio.createBuffer(
                1,
                audio.sampleRate,
                audio.sampleRate
            );

            const data = noiseBuffer.getChannelData(0);

            for (let i = 0; i < data.length; i++) {
                data[i] = Math.random() * 2 - 1;
            }
        }

        if (audio.state === "suspended") {
            audio.resume().catch(() => {});
        }
    } catch (error) {
        audio = null;
    }
}

function tone(freq, endFreq, duration, volume, type = "sine", delay = 0) {
    if (!audio || muted || !masterGain) return;

    const t = audio.currentTime + delay;
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(Math.max(1, freq), t);
    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(1, endFreq),
        t + duration
    );

    gain.gain.setValueAtTime(Math.max(0.001, volume), t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(t);
    oscillator.stop(t + duration + 0.02);

    oscillator.onended = () => {
        oscillator.disconnect();
        gain.disconnect();
    };
}

function noise(duration, volume, frequency, endFrequency) {
    if (!audio || muted || !noiseBuffer) return;

    const t = audio.currentTime;
    const source = audio.createBufferSource();
    const filter = audio.createBiquadFilter();
    const gain = audio.createGain();

    source.buffer = noiseBuffer;

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(frequency, t);
    filter.frequency.exponentialRampToValueAtTime(
        Math.max(20, endFrequency),
        t + duration
    );

    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start(t);
    source.stop(t + duration);

    source.onended = () => {
        source.disconnect();
        filter.disconnect();
        gain.disconnect();
    };
}

function sfx(name) {
    if (!audio || muted) return;

    const now = audio.currentTime;

    switch (name) {
        case "shoot":
            if (now - lastShotSound < 0.085) return;
            lastShotSound = now;
            noise(0.045, 0.16, 4500, 400);
            tone(180, 65, 0.045, 0.07, "triangle");
            break;

        case "hit":
            if (now - lastHitSound < 0.065) return;
            lastHitSound = now;
            tone(250, 100, 0.045, 0.065, "square");
            break;

        case "explosion":
            noise(0.28, 0.55, 1800, 80);
            tone(100, 32, 0.3, 0.35, "sine");
            break;

        case "gain":
            tone(523, 523, 0.13, 0.22, "triangle");
            tone(659, 659, 0.13, 0.22, "triangle", 0.08);
            tone(784, 1047, 0.23, 0.22, "triangle", 0.16);
            break;

        case "damage":
            noise(0.15, 0.28, 900, 100);
            tone(180, 55, 0.25, 0.25, "sawtooth");
            break;

        case "boss":
            tone(90, 45, 1.1, 0.5, "sawtooth");
            tone(140, 70, 0.9, 0.25, "triangle", 0.3);
            break;

        case "bossHit":
            if (now - lastHitSound < 0.08) return;
            lastHitSound = now;
            noise(0.07, 0.15, 900, 200);
            tone(85, 45, 0.08, 0.12, "triangle");
            break;

        case "clear":
            [523, 659, 784, 1047].forEach((f, i) => {
                tone(f, f, 0.35, 0.23, "triangle", i * 0.12);
            });
            break;

        case "over":
            [392, 330, 262, 130].forEach((f, i) => {
                tone(f, f * 0.8, 0.45, 0.24, "triangle", i * 0.2);
            });
            break;
    }
}

ui.sound.addEventListener("pointerdown", e => {
    e.stopPropagation();
});

ui.sound.addEventListener("click", e => {
    e.stopPropagation();

    initAudio();
    muted = !muted;

    if (masterGain) {
        masterGain.gain.value = muted ? 0 : 0.3;
    }

    ui.sound.textContent = muted ? "×♪" : "♪";
});

/* =========================================================
   원근 투영
   z = 0 : 먼 거리
   z = 1 : 화면 아래
========================================================= */

function project(x, z) {
    const depth = Math.max(0, z);
    const perspective = Math.pow(depth, 1.65);
    const halfWidth = lerp(ROAD_FAR, ROAD_NEAR, perspective);

    return {
        x: W / 2 + x * halfWidth,
        y: HORIZON + (ROAD_BOTTOM - HORIZON) * perspective,
        s: 0.16 + depth * 0.94,
        halfWidth
    };
}

function playerPosition() {
    return project(player.x, PLAYER_Z);
}

function roundedRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function polygon(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();

    points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
    });

    ctx.closePath();
    ctx.fill();
}

function ellipse(x, y, rx, ry, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
}

function text(str, x, y, size, color, outline = true) {
    ctx.font = `900 ${size}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (outline) {
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(2, size * 0.13);
        ctx.strokeStyle = "rgba(0,0,0,.7)";
        ctx.strokeText(str, x, y);
    }

    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
}

/* =========================================================
   게임 초기화
========================================================= */

function resetGame() {
    elapsed = 0;
    stage = 1;
    stageTime = 0;
    stageDuration = 20;

    units = 12;
    maxUnits = 12;
    kills = 0;
    score = 0;

    roadOffset = 0;
    shake = 0;
    damageFlash = 0;
    gainFlash = 0;
    recoil = 0;
    muzzle = 0;

    enemyTimer = 1.3;
    crateTimer = 0.3;
    gateTimer = 4.2;
    shootTimer = 0;
    transitionTimer = 0;
    bannerTimer = 0;

    stageClearing = false;
    bossSpawned = false;

    enemies = [];
    crates = [];
    gates = [];
    bullets = [];
    enemyBullets = [];
    particles = [];
    popups = [];
    boss = null;

    player.x = 0;
    player.targetX = 0;
    player.invulnerable = 0;

    dragging = false;
    pointerId = null;

    initScenery();
    updateHUD();
}

function startGame() {
    initAudio();
    resetGame();

    mode = "playing";

    ui.start.classList.add("hidden");
    ui.over.classList.add("hidden");

    ui.hint.style.opacity = "1";

    showBanner("STAGE 01", 1.5);
}

function gameOver() {
    if (mode !== "playing") return;

    mode = "over";
    units = 0;
    dragging = false;
    pointerId = null;

    updateHUD();

    const p = playerPosition();

    explosion(p.x, p.y - 20, 1.8, "#ffb62f");
    shake = 18;

    sfx("over");

    score = kills * 10 + stage * 100 + Math.floor(elapsed);

    best = Math.max(best, score);

    try {
        localStorage.setItem("lastSquadBest", String(best));
    } catch (error) {}

    document.getElementById("resultStage").textContent = stage;
    document.getElementById("resultTime").textContent = formatTime(elapsed);
    document.getElementById("resultKills").textContent = kills;
    document.getElementById("resultMax").textContent = maxUnits;
    document.getElementById("resultBest").textContent = best;

    ui.banner.classList.remove("visible");
    ui.over.classList.remove("hidden");
}

document.getElementById("startButton")
    .addEventListener("click", startGame);

document.getElementById("restartButton")
    .addEventListener("click", startGame);

/* =========================================================
   조작
========================================================= */

function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const localX = (clientX - rect.left) / rect.width * W;
    const p = project(0, PLAYER_Z);

    const formationWidth = Math.min(
        63,
        25 + Math.sqrt(units) * 2.2
    );

    const limit = Math.min(
        0.84,
        (p.halfWidth - formationWidth - 5) / p.halfWidth
    );

    player.targetX = clamp(
        (localX - W / 2) / p.halfWidth,
        -limit,
        limit
    );
}

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    initAudio();

    if (mode !== "playing") return;
    if (dragging) return;

    dragging = true;
    pointerId = e.pointerId;

    try {
        canvas.setPointerCapture(e.pointerId);
    } catch (error) {}

    movePlayer(e.clientX);
});

canvas.addEventListener("pointermove", e => {
    if (mode !== "playing") return;
    if (!dragging || e.pointerId !== pointerId) return;

    e.preventDefault();
    movePlayer(e.clientX);
});

function releasePointer(e) {
    if (e.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;
}

canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("lostpointercapture", releasePointer);

const keys = {};

window.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", " ", "a", "d"].includes(e.key)) {
        e.preventDefault();
    }

    keys[e.key.toLowerCase()] = true;

    if (e.key === " " && mode !== "playing") {
        startGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    dragging = false;
    pointerId = null;

    Object.keys(keys).forEach(k => keys[k] = false);
});

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("touchmove", e => {
    e.preventDefault();
}, { passive: false });

document.addEventListener("gesturestart", e => {
    e.preventDefault();
}, { passive: false });

/* =========================================================
   HUD 및 메시지
========================================================= */

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);

    return String(m).padStart(2, "0") +
        ":" +
        String(s).padStart(2, "0");
}

function updateHUD() {
    ui.units.textContent = units;
    ui.stage.textContent = String(stage).padStart(2, "0");
    ui.time.textContent = formatTime(elapsed);

    let progress = stageTime / stageDuration;

    if (stage % 3 === 0 && boss) {
        progress = 1 - boss.hp / boss.maxHp;
    }

    if (stageClearing) progress = 1;

    ui.progress.style.width = clamp(progress * 100, 0, 100) + "%";
}

function showBanner(message, duration = 1.5, danger = false) {
    ui.banner.textContent = message;
    ui.banner.classList.toggle("danger", danger);
    ui.banner.classList.add("visible");

    bannerTimer = duration;
}

function popup(message, x, y, color = "#ffffff", size = 24) {
    if (popups.length > 35) popups.shift();

    popups.push({
        message,
        x,
        y,
        color,
        size,
        life: 1.1,
        maxLife: 1.1
    });
}

/* =========================================================
   배경 오브젝트
========================================================= */

function initScenery() {
    scenery = [];

    for (let i = 0; i < 32; i++) {
        scenery.push({
            x: (i % 2 === 0 ? -1 : 1) * rand(1.15, 1.8),
            z: rand(0, 1.15),
            type: randInt(0, 3),
            seed: rand(0, 100)
        });
    }
}

function updateScenery(dt, speed) {
    scenery.forEach(o => {
        o.z += speed * dt;

        if (o.z > 1.18) {
            o.z = rand(0, 0.05);
            o.x = Math.sign(o.x) * rand(1.15, 1.8);
            o.type = randInt(0, 3);
        }
    });
}

/* =========================================================
   도로 및 배경 그리기
========================================================= */

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 70);

    sky.addColorStop(0, "#5ca3c8");
    sky.addColorStop(0.7, "#a7d6e0");
    sky.addColorStop(1, "#d2e6dc");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    polygon([
        [0, 153], [0, 109], [35, 83],
        [70, 117], [112, 76], [155, 129],
        [201, 94], [240, 140], [285, 89],
        [338, 122], [390, 72], [390, 180]
    ], "#72978d");

    polygon([
        [0, 160], [0, 130], [55, 106],
        [98, 143], [160, 115], [210, 150],
        [280, 119], [340, 139], [390, 113],
        [390, 180]
    ], "#4d7863");

    const grass = ctx.createLinearGradient(0, HORIZON, 0, H);

    grass.addColorStop(0, "#628d49");
    grass.addColorStop(0.5, "#426d32");
    grass.addColorStop(1, "#294c24");

    ctx.fillStyle = grass;
    ctx.fillRect(0, HORIZON, W, H - HORIZON);

    for (let i = 0; i < 15; i++) {
        const z = ((i / 15 + roadOffset * 0.55) % 1.12);
        const p1 = project(0, z);
        const p2 = project(0, z + 0.035);

        ctx.fillStyle = "rgba(0,0,0,.035)";
        ctx.fillRect(0, p1.y, W, p2.y - p1.y);
    }

    drawRoad();
    drawScenery();

    const fog = ctx.createLinearGradient(
        0, HORIZON - 10, 0, HORIZON + 95
    );

    fog.addColorStop(0, "rgba(204,224,211,.5)");
    fog.addColorStop(1, "rgba(204,224,211,0)");

    ctx.fillStyle = fog;
    ctx.fillRect(0, HORIZON - 10, W, 105);
}

function roadStrip(x1, x2, z1, z2, color) {
    const a = project(x1, z1);
    const b = project(x2, z1);
    const c = project(x2, z2);
    const d = project(x1, z2);

    polygon([
        [a.x, a.y],
        [b.x, b.y],
        [c.x, c.y],
        [d.x, d.y]
    ], color);
}

function drawRoad() {
    roadStrip(-1.12, 1.12, 0, 1.08, "#b1b4ae");
    roadStrip(-1.03, 1.03, 0, 1.08, "#303b43");

    const road = ctx.createLinearGradient(0, HORIZON, 0, H);

    road.addColorStop(0, "#69747b");
    road.addColorStop(0.4, "#4c555c");
    road.addColorStop(1, "#333c43");

    const a = project(-1, 0);
    const b = project(1, 0);
    const c = project(1, 1.08);
    const d = project(-1, 1.08);

    polygon([
        [a.x, a.y],
        [b.x, b.y],
        [c.x, c.y],
        [d.x, d.y]
    ], road);

    roadStrip(-0.99, -0.965, 0, 1.08, "#e8e8d8");
    roadStrip(0.965, 0.99, 0, 1.08, "#e8e8d8");

    for (let i = 0; i < 13; i++) {
        const z = (i / 13 + roadOffset) % 1.08;
        const end = Math.min(1.08, z + 0.036);

        roadStrip(-0.345, -0.325, z, end, "#d6d7d1");
        roadStrip(0.325, 0.345, z, end, "#d6d7d1");
    }

    for (let i = 0; i < 24; i++) {
        const z = (i / 24 + roadOffset) % 1.08;
        const end = Math.min(1.08, z + 0.045);
        const color = i % 2 === 0 ? "#d8d6c8" : "#b83d35";

        roadStrip(-1.105, -1.035, z, end, color);
        roadStrip(1.035, 1.105, z, end, color);
    }

    for (let i = 0; i < 24; i++) {
        const z = (i / 24 + roadOffset * 0.85) % 1.08;
        const x = Math.sin(i * 31.72) * 0.9;
        const p = project(x, z);

        ctx.fillStyle = "rgba(255,255,255,.025)";
        ctx.fillRect(p.x, p.y, p.s * 12, p.s * 2);
    }
}

function drawScenery() {
    const sorted = scenery.slice().sort((a, b) => a.z - b.z);

    sorted.forEach(o => {
        const p = project(o.x, o.z);

        if (p.x < -100 || p.x > W + 100) return;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.s, p.s);

        if (o.type === 0 || o.type === 1) {
            ellipse(7, 0, 24, 8, "rgba(0,0,0,.19)");

            ctx.fillStyle = "#64513b";
            ctx.fillRect(-4, -36, 8, 37);

            ellipse(-12, -42, 17, 20, "#245132");
            ellipse(10, -46, 19, 23, "#2d6037");
            ellipse(0, -61, 18, 22, "#3d7542");
            ellipse(-7, -65, 10, 13, "#4b8748");
        } else if (o.type === 2) {
            ellipse(0, 0, 14, 5, "rgba(0,0,0,.2)");

            polygon([
                [-14, -2], [-11, -12],
                [1, -18], [14, -10], [17, 0]
            ], "#7c8982");

            polygon([
                [-11, -12], [1, -18],
                [8, -9], [-5, -6]
            ], "#a5b0a4");
        } else {
            ctx.fillStyle = "#d4d9d5";
            ctx.fillRect(-3, -31, 6, 31);

            ctx.fillStyle = "#e8ece8";
            ctx.fillRect(-11, -38, 22, 13);

            ctx.fillStyle = "#db5145";
            ctx.fillRect(-9, -35, 18, 5);
        }

        ctx.restore();
    });
}

/* =========================================================
   유닛 증가 및 피해
========================================================= */

function applyEffect(effect, value) {
    const before = units;
    let next = units;

    if (effect === "add") next += value;
    if (effect === "multiply") next *= value;
    if (effect === "subtract") next -= value;
    if (effect === "divide") next = Math.floor(next / value);

    units = clamp(Math.floor(next), 0, MAX_UNITS);
    maxUnits = Math.max(maxUnits, units);

    const difference = units - before;
    const p = playerPosition();

    if (difference > 0) {
        gainFlash = 0.28;

        popup("+" + difference, p.x, p.y - 90, "#67ffae", 31);

        burst(p.x, p.y - 35, "#5cffb2", 25, 100);
        sfx("gain");
    } else if (difference < 0) {
        damageFlash = 0.25;
        shake = Math.max(shake, 7);

        popup(String(difference), p.x, p.y - 90, "#ff6262", 29);
        sfx("damage");
    } else if (units === MAX_UNITS) {
        popup("MAX", p.x, p.y - 90, "#ffe365", 25);
        sfx("gain");
    }

    updateHUD();

    if (units <= 0) gameOver();
}

function damagePlayer(amount, ignoreInvulnerability = false) {
    if (mode !== "playing") return;
    if (player.invulnerable > 0 && !ignoreInvulnerability) return;

    amount = Math.max(1, Math.ceil(amount));

    const lost = Math.min(units, amount);

    units -= lost;
    player.invulnerable = 0.3;

    shake = Math.max(shake, 9);
    damageFlash = 0.3;

    const p = playerPosition();

    popup("-" + lost, p.x, p.y - 65, "#ff5757", 28);
    burst(p.x, p.y - 30, "#ff754e", 14, 100);

    sfx("damage");
    updateHUD();

    if (units <= 0) gameOver();
}

/* =========================================================
   적 생성
========================================================= */

function spawnWave() {
    const count = Math.min(
        14,
        3 + Math.floor(stage * 0.8) + randInt(0, 2)
    );

    const center = rand(-0.58, 0.58);

    for (let i = 0; i < count; i++) {
        const heavy = stage >= 2 &&
            Math.random() < Math.min(0.12 + stage * 0.012, 0.42);

        const hp = Math.round(
            (heavy ? 32 : 10) *
            (1 + (stage - 1) * 0.34) *
            (1 + Math.max(0, units - 25) * 0.008)
        );

        enemies.push({
            x: clamp(center + rand(-0.42, 0.42), -0.83, 0.83),
            z: -rand(0, 0.11) - Math.floor(i / 4) * 0.045,
            hp,
            maxHp: hp,
            heavy,
            speed: rand(0.077, 0.115) + Math.min(stage * 0.004, 0.045),
            hit: 0,
            phase: rand(0, Math.PI * 2),
            damage: heavy ? 5 + Math.floor(stage / 3) : 2 + Math.floor(stage / 5)
        });
    }
}

/* =========================================================
   번호 상자 및 게이트
========================================================= */

function spawnCrate() {
    const multiply = Math.random() < 0.23;

    crates.push({
        x: [-0.58, 0, 0.58][randInt(0, 2)],
        z: 0.01,
        effect: multiply ? "multiply" : "add",
        value: multiply ? 2 : [5, 10, 15, 20][randInt(0, 3)],
        collected: false
    });
}

function spawnGate() {
    const good = Math.random() < 0.55
        ? { effect: "multiply", value: 2 }
        : { effect: "add", value: randInt(2, 5) * 5 };

    const bad = Math.random() < 0.75
        ? { effect: "subtract", value: 5 + Math.floor(stage / 3) * 2 }
        : { effect: "divide", value: 2 };

    const goodLeft = Math.random() < 0.5;

    gates.push({
        z: 0,
        left: goodLeft ? good : bad,
        right: goodLeft ? bad : good,
        collected: false
    });
}

function effectLabel(effect, value) {
    if (effect === "add") return "+" + value;
    if (effect === "multiply") return "×" + value;
    if (effect === "subtract") return "-" + value;
    if (effect === "divide") return "÷" + value;
    return String(value);
}

function isGood(effect) {
    return effect === "add" || effect === "multiply";
}

/* =========================================================
   보스
========================================================= */

function spawnBoss() {
    const hp = Math.round(
        320 + stage * 105 + units * 12
    );

    boss = {
        x: 0,
        z: -0.1,
        hp,
        maxHp: hp,
        hit: 0,
        attackTimer: 2.4,
        phase: 0,
        arrived: false
    };

    bossSpawned = true;

    showBanner("WARNING · BOSS", 2.1, true);

    shake = 11;
    sfx("boss");
}

function bossAttack() {
    if (!boss || !boss.arrived) return;

    const p = project(boss.x, boss.z);
    const target = playerPosition();

    const count = Math.min(7, 3 + Math.floor(stage / 3));
    const baseAngle = Math.atan2(
        target.y - p.y,
        target.x - p.x
    );

    for (let i = 0; i < count; i++) {
        const angle = baseAngle + (i - (count - 1) / 2) * 0.15;

        enemyBullets.push({
            x: p.x,
            y: p.y - 22 * p.s,
            vx: Math.cos(angle) * 220,
            vy: Math.sin(angle) * 220,
            radius: 6,
            damage: Math.max(2, Math.floor(stage / 2)),
            life: 4
        });
    }

    burst(p.x, p.y - 20, "#ff8c35", 12, 80);
    noise(0.16, 0.25, 1200, 100);
}

/* =========================================================
   사격
========================================================= */

function shoot() {
    if (units <= 0) return;

    const p = playerPosition();
    const count = units;

    const formationWidth = Math.min(
        108,
        30 + Math.sqrt(units) * 5
    );

    const spread = Math.min(
        0.5,
        0.1 + units * 0.0025
    );

    for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const angle = (t - 0.5) * spread + rand(-0.014, 0.014);

        const x = p.x + (t - 0.5) * formationWidth;
        const y = p.y - 48 - rand(0, 18);

        bullets.push({
            x,
            y,
            px: x,
            py: y,
            vx: Math.sin(angle) * 730,
            vy: -Math.cos(angle) * 730,
            damage: 2,
            life: 1.25
        });
    }

    recoil = 1;
    muzzle = 0.065;

    sfx("shoot");
}

/* =========================================================
   파티클 및 폭발
========================================================= */

function burst(x, y, color, count = 15, speed = 120) {
    for (let i = 0; i < count; i++) {
        if (particles.length >= 750) break;

        const angle = rand(0, Math.PI * 2);
        const velocity = rand(speed * 0.2, speed);
        const life = rand(0.18, 0.65);

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life,
            maxLife: life,
            size: rand(2, 5),
            color,
            gravity: 70,
            smoke: false
        });
    }
}

function explosion(x, y, scale = 1, color = "#ff9b35") {
    burst(x, y, color, Math.floor(18 * scale), 150 * scale);
    burst(x, y, "#ffe08a", Math.floor(9 * scale), 110 * scale);
    burst(x, y, "#ff4b22", Math.floor(7 * scale), 180 * scale);

    for (let i = 0; i < 8 * scale; i++) {
        if (particles.length >= 750) break;

        const life = rand(0.35, 0.85);

        particles.push({
            x: x + rand(-7, 7) * scale,
            y: y + rand(-7, 7) * scale,
            vx: rand(-35, 35) * scale,
            vy: rand(-65, -15) * scale,
            life,
            maxLife: life,
            size: rand(5, 13) * scale,
            color: "#4d4540",
            gravity: -15,
            smoke: true
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.gravity * dt;

        p.vx *= Math.pow(0.3, dt);

        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];

        p.life -= dt;
        p.y -= 40 * dt;

        if (p.life <= 0) popups.splice(i, 1);
    }
}

/* =========================================================
   스테이지 진행
========================================================= */

function clearStage() {
    if (stageClearing || mode !== "playing") return;

    stageClearing = true;
    transitionTimer = 2.4;

    showBanner("STAGE CLEAR!", 2.2);
    sfx("clear");

    enemies.forEach(e => {
        const p = project(e.x, e.z);

        if (e.z > 0) {
            explosion(p.x, p.y - 10, p.s * 0.7);
        }
    });

    enemies = [];
    enemyBullets = [];
    bullets = [];
    crates = [];
    gates = [];

    const p = playerPosition();

    popup("CLEAR BONUS +10", p.x, p.y - 120, "#ffe16a", 20);
    applyEffect("add", 10);

    updateHUD();
}

function nextStage() {
    stage++;
    stageTime = 0;

    stageDuration = Math.min(32, 19 + stage * 1.2);

    stageClearing = false;
    bossSpawned = false;
    boss = null;

    enemyTimer = 0.7;
    crateTimer = 0.2;
    gateTimer = 3.5;
    shootTimer = 0;

    showBanner(
        stage % 3 === 0
            ? "BOSS STAGE " + stage
            : "STAGE " + String(stage).padStart(2, "0"),
        1.8,
        stage % 3 === 0
    );

    updateHUD();
}

/* =========================================================
   충돌 판정
========================================================= */

function segmentHitsRect(b, x, y, w, h) {
    const minX = Math.min(b.x, b.px);
    const maxX = Math.max(b.x, b.px);
    const minY = Math.min(b.y, b.py);
    const maxY = Math.max(b.y, b.py);

    if (
        maxX < x - w ||
        minX > x + w ||
        maxY < y - h ||
        minY > y + h
    ) {
        return false;
    }

    const dx = b.x - b.px;
    const dy = b.y - b.py;

    let t0 = 0;
    let t1 = 1;

    const p = [-dx, dx, -dy, dy];
    const q = [
        b.px - (x - w),
        x + w - b.px,
        b.py - (y - h),
        y + h - b.py
    ];

    for (let i = 0; i < 4; i++) {
        if (Math.abs(p[i]) < 0.00001) {
            if (q[i] < 0) return false;
        } else {
            const r = q[i] / p[i];

            if (p[i] < 0) t0 = Math.max(t0, r);
            else t1 = Math.min(t1, r);

            if (t0 > t1) return false;
        }
    }

    return true;
}

function updateBullets(dt) {
    const targets = [];

    enemies.forEach(e => {
        if (e.z < 0 || e.hp <= 0) return;

        const p = project(e.x, e.z);

        targets.push({
            enemy: e,
            x: p.x,
            y: p.y - 14 * p.s,
            w: (e.heavy ? 17 : 12) * p.s,
            h: (e.heavy ? 24 : 20) * p.s,
            z: e.z
        });
    });

    targets.sort((a, b) => b.z - a.z);

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        b.px = b.x;
        b.py = b.y;

        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;

        if (
            b.life <= 0 ||
            b.y < HORIZON - 15 ||
            b.x < -30 ||
            b.x > W + 30
        ) {
            bullets.splice(i, 1);
            continue;
        }

        let hit = false;

        for (const t of targets) {
            const e = t.enemy;

            if (e.hp <= 0) continue;

            if (segmentHitsRect(b, t.x, t.y, t.w, t.h)) {
                e.hp -= b.damage;
                e.hit = 0.09;
                hit = true;

                if (Math.random() < 0.28) {
                    burst(b.x, b.y, "#ffd6a0", 2, 55);
                }

                sfx("hit");

                if (e.hp <= 0) {
                    explosion(t.x, t.y, Math.max(0.35, t.z));

                    kills++;

                    if (Math.random() < 0.4) sfx("explosion");

                    shake = Math.max(shake, 2);
                }

                break;
            }
        }

        if (!hit && boss && boss.hp > 0 && boss.z > 0) {
            const p = project(boss.x, boss.z);

            if (segmentHitsRect(
                b,
                p.x,
                p.y - 34 * p.s,
                43 * p.s,
                48 * p.s
            )) {
                boss.hp -= b.damage;
                boss.hit = 0.07;
                hit = true;

                if (Math.random() < 0.2) {
                    burst(b.x, b.y, "#ffba60", 3, 65);
                }

                sfx("bossHit");
            }
        }

        if (hit) bullets.splice(i, 1);
    }

    enemies = enemies.filter(e => e.hp > 0);

    if (boss && boss.hp <= 0) {
        const p = project(boss.x, boss.z);

        explosion(p.x, p.y - 30, 3.4);
        explosion(p.x - 25, p.y - 45, 1.5);
        explosion(p.x + 25, p.y - 15, 1.5);

        shake = 20;
        kills += 1;

        sfx("explosion");

        popup("BOSS DOWN!", p.x, p.y - 90, "#ffe365", 28);

        boss = null;
        clearStage();
    }
}

/* =========================================================
   게임 업데이트
========================================================= */

function update(dt) {
    elapsed += dt;

    const speed = 0.105 + Math.min(stage * 0.004, 0.05);

    roadOffset = (roadOffset + speed * dt) % 1.08;

    updateScenery(dt, speed);

    shake = Math.max(0, shake - dt * 27);
    damageFlash = Math.max(0, damageFlash - dt);
    gainFlash = Math.max(0, gainFlash - dt);
    recoil = Math.max(0, recoil - dt * 12);
    muzzle = Math.max(0, muzzle - dt);

    player.invulnerable = Math.max(
        0,
        player.invulnerable - dt
    );

    if (bannerTimer > 0) {
        bannerTimer -= dt;

        if (bannerTimer <= 0) {
            ui.banner.classList.remove("visible");
        }
    }

    if (elapsed > 7) {
        ui.hint.style.opacity = "0";
    }

    const p0 = project(0, PLAYER_Z);
    const formationWidth = Math.min(
        63,
        25 + Math.sqrt(units) * 2.2
    );

    const limit = Math.min(
        0.84,
        (p0.halfWidth - formationWidth - 5) / p0.halfWidth
    );

    if (keys.arrowleft || keys.a) {
        player.targetX -= dt * 1.7;
    }

    if (keys.arrowright || keys.d) {
        player.targetX += dt * 1.7;
    }

    player.targetX = clamp(player.targetX, -limit, limit);

    player.x = lerp(
        player.x,
        player.targetX,
        1 - Math.exp(-dt * 18)
    );

    player.x = clamp(player.x, -limit, limit);

    if (stageClearing) {
        transitionTimer -= dt;

        updateParticles(dt);

        if (transitionTimer <= 0) nextStage();

        updateHUD();
        return;
    }

    stageTime += dt;

    const bossStage = stage % 3 === 0;

    enemyTimer -= dt;
    crateTimer -= dt;
    gateTimer -= dt;
    shootTimer -= dt;

    if (shootTimer <= 0) {
        shoot();
        shootTimer = 0.19;
    }

    if (enemyTimer <= 0) {
        if (
            stageTime < stageDuration - 5 &&
            (!bossStage || !bossSpawned)
        ) {
            spawnWave();
        }

        enemyTimer = Math.max(
            0.85,
            2.1 - stage * 0.065
        );
    }

    if (crateTimer <= 0) {
        if (!boss || Math.random() < 0.7) {
            spawnCrate();
        }

        crateTimer = rand(3.2, 4.6);
    }

    if (gateTimer <= 0) {
        spawnGate();
        gateTimer = rand(7.2, 9.0);
    }

    if (bossStage && !bossSpawned && stageTime >= 7.5) {
        spawnBoss();
    }

    const p = playerPosition();

    /* 적 이동 및 충돌 */

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        e.z += e.speed * dt;
        e.phase += dt * 7;
        e.hit = Math.max(0, e.hit - dt);

        if (e.z >= PLAYER_Z - 0.035) {
            const ep = project(e.x, e.z);

            const hitWidth = Math.min(
                62,
                24 + Math.sqrt(units) * 2.5
            );

            if (Math.abs(ep.x - p.x) < hitWidth + 10 * ep.s) {
                damagePlayer(e.damage, true);

                explosion(ep.x, ep.y - 15, 0.7);
                enemies.splice(i, 1);

                if (mode !== "playing") return;
                continue;
            }
        }

        if (e.z > 1.12) {
            enemies.splice(i, 1);
        }
    }

    /* 상자 이동 및 획득 */

    for (let i = crates.length - 1; i >= 0; i--) {
        const c = crates[i];

        c.z += speed * 1.22 * dt;

        if (
            !c.collected &&
            c.z >= PLAYER_Z - 0.035 &&
            c.z <= PLAYER_Z + 0.075
        ) {
            const cp = project(c.x, c.z);

            const pickupWidth = Math.min(
                60,
                28 + Math.sqrt(units) * 2
            );

            if (Math.abs(cp.x - p.x) < pickupWidth + 19 * cp.s) {
                c.collected = true;

                applyEffect(c.effect, c.value);
                burst(cp.x, cp.y - 25, "#6bffcc", 18, 110);
            }
        }

        if (c.collected || c.z > 1.1) {
            crates.splice(i, 1);
        }
    }

    /* 게이트 이동 및 통과 */

    for (let i = gates.length - 1; i >= 0; i--) {
        const g = gates[i];

        const previousZ = g.z;

        g.z += speed * 1.16 * dt;

        if (
            !g.collected &&
            previousZ < PLAYER_Z &&
            g.z >= PLAYER_Z
        ) {
            g.collected = true;

            const effect = player.x < 0 ? g.left : g.right;

            applyEffect(effect.effect, effect.value);

            if (mode !== "playing") return;
        }

        if (g.z > 1.12) {
            gates.splice(i, 1);
        }
    }

    /* 보스 이동 및 공격 */

    if (boss) {
        boss.phase += dt;
        boss.hit = Math.max(0, boss.hit - dt);

        if (!boss.arrived) {
            boss.z += dt * 0.16;

            if (boss.z >= 0.49) {
                boss.z = 0.49;
                boss.arrived = true;
            }
        } else {
            boss.x = Math.sin(boss.phase * 0.9) * 0.48;

            boss.z = 0.49 +
                Math.sin(boss.phase * 0.7) * 0.045;

            boss.attackTimer -= dt;

            if (boss.attackTimer <= 0) {
                bossAttack();

                boss.attackTimer = Math.max(
                    0.85,
                    2.5 - stage * 0.075
                );
            }
        }
    }

    /* 적군 총알 */

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];

        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;

        const hitWidth = Math.min(
            62,
            24 + Math.sqrt(units) * 2.5
        );

        if (
            Math.abs(b.x - p.x) < hitWidth &&
            Math.abs(b.y - (p.y - 26)) < 34
        ) {
            damagePlayer(b.damage);

            burst(b.x, b.y, "#ffb35c", 7, 80);

            enemyBullets.splice(i, 1);

            if (mode !== "playing") return;
            continue;
        }

        if (
            b.life <= 0 ||
            b.y > H + 30 ||
            b.x < -30 ||
            b.x > W + 30
        ) {
            enemyBullets.splice(i, 1);
        }
    }

    updateBullets(dt);
    updateParticles(dt);

    if (
        !bossStage &&
        stageTime >= stageDuration &&
        enemies.length === 0
    ) {
        clearStage();
    }

    updateHUD();
}

function drawSoldier(x, y, scale, blue, phase = 0, heavy = false, flash = false) {
    ctx.save();

    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const bodyColor = flash
        ? "#ffffff"
        : blue ? "#2389ed" : "#c83d3b";

    const darkColor = blue ? "#164d88" : "#74282a";
    const lightColor = blue ? "#70caff" : "#ff8272";
    const helmetColor = blue ? "#2267b7" : "#ad292c";

    ellipse(0, 1, 9, 4, "rgba(0,0,0,.25)");

    const leg = Math.sin(phase) * 2;

    ctx.fillStyle = "#202d39";

    roundedRect(-6, -10 + leg, 5, 11, 2);
    ctx.fill();

    roundedRect(1, -10 - leg, 5, 11, 2);
    ctx.fill();

    ctx.fillStyle = darkColor;

    roundedRect(-10, -27, 20, 19, 5);
    ctx.fill();

    ctx.fillStyle = bodyColor;

    roundedRect(-8, -28, 16, 17, 4);
    ctx.fill();

    ctx.fillStyle = lightColor;
    ctx.fillRect(-6, -25, 3, 10);

    ctx.fillStyle = "#2c3540";

    roundedRect(-7, -18, 14, 6, 2);
    ctx.fill();

    ctx.fillStyle = "#566371";
    ctx.fillRect(-5, -17, 3, 4);
    ctx.fillRect(0, -17, 3, 4);

    ellipse(0, -31, 7, 8, "#e9b88e");
    ellipse(0, -35, 9, 7, helmetColor);

    ctx.fillStyle = lightColor;

    roundedRect(-7, -38, 13, 3, 1);
    ctx.fill();

    ctx.fillStyle = "#172b3a";

    roundedRect(-6, -33, 12, 4, 2);
    ctx.fill();

    if (blue) {
        ctx.fillStyle = "#202d38";

        roundedRect(6, -37, 5, 24, 2);
        ctx.fill();

        ctx.fillStyle = "#71818e";
        ctx.fillRect(7, -42, 3, 10);

        ctx.fillStyle = "#26313b";
        ctx.fillRect(5, -43, 7, 3);

        ellipse(8, -21, 3, 4, "#d7aa82");

        if (muzzle > 0) {
            drawMuzzle(8, -46, 0.8);
        }
    } else {
        ctx.fillStyle = "#353c40";

        roundedRect(6, -20, 6, 22, 2);
        ctx.fill();

        ctx.fillStyle = "#9ca5a8";
        ctx.fillRect(7, -1, 4, 8);
    }

    if (heavy) {
        ctx.fillStyle = "#414a51";

        roundedRect(-13, -27, 8, 11, 2);
        ctx.fill();

        roundedRect(5, -27, 8, 11, 2);
        ctx.fill();

        ctx.fillStyle = "#e2a13a";
        ctx.fillRect(-11, -25, 4, 3);
        ctx.fillRect(7, -25, 4, 3);

    ctx.restore();
}

function drawMuzzle(x, y, scale) {

function drawVehicle(x, y, width, height) {
    const w = width;
    const h = height;

    ellipse(x, y + 7, w * 0.63, 19, "rgba(0,0,0,.35)");

    ctx.save();
    ctx.translate(x, y);

    const wheelPositions = [
        [-w / 2 - 5, -h + 13],
        [w / 2 - 7, -h + 13],
        [-w / 2 - 5, -13],
        [w / 2 - 7, -13]
    ];

    wheelPositions.forEach(([wx, wy]) => {
        ctx.fillStyle = "#121c23";

        roundedRect(wx, wy, 12, 24, 4);
        ctx.fill();

        ctx.fillStyle = "#3e4c54";
        ctx.fillRect(wx + 3, wy + 3, 6, 17);

        ctx.fillStyle = "#69777e";

        for (let i = 0; i < 4; i++) {
            ctx.fillRect(wx + 2, wy + 4 + i * 5, 8, 2);
        }
    });

    polygon([
        [-w / 2, -h + 6],
        [w / 2, -h + 6],
        [w / 2, 2],
        [-w / 2, 2]
    ], "#233b4c");

    polygon([
        [-w / 2, -h + 6],
        [-w / 2 + 9, -h - 6],
        [w / 2 - 9, -h - 6],
        [w / 2, -h + 6]
    ], "#7c9baa");

    ctx.fillStyle = "#416c82";

    roundedRect(-w / 2 + 5, -h + 4, w - 10, h - 5, 5);
    ctx.fill();

    ctx.fillStyle = "#2c4655";

    roundedRect(-w / 2 + 10, -h + 11, w - 20, h - 19, 3);
    ctx.fill();

    ctx.strokeStyle = "#8aa5b0";
    ctx.lineWidth = 2;

    for (let i = 0; i < 5; i++) {
        const yy = -h + 16 + i * (h - 28) / 5;

        ctx.beginPath();
        ctx.moveTo(-w / 2 + 11, yy);
        ctx.lineTo(w / 2 - 11, yy);
        ctx.stroke();
    }

    ctx.fillStyle = "#91adba";

    roundedRect(-w / 2 + 5, -h - 4, w - 10, 18, 4);
    ctx.fill();

    ctx.fillStyle = "#214f6b";

    roundedRect(-w / 2 + 12, -h - 1, w - 24, 11, 3);
    ctx.fill();

    ctx.fillStyle = "#e4faff";
    ctx.fillRect(-w / 2 + 5, -h + 4, 8, 5);
    ctx.fillRect(w / 2 - 13, -h + 4, 8, 5);

    ctx.fillStyle = "#152c3b";

    roundedRect(-w / 2 - 1, -2, w + 2, 10, 3);
    ctx.fill();

    ctx.fillStyle = "#f14e3c";
    ctx.fillRect(-w / 2 + 5, 0, 11, 5);
    ctx.fillRect(w / 2 - 16, 0, 11, 5);

    ctx.fillStyle = "#c4d0d3";
    ctx.fillRect(-10, 1, 20, 5);

    ctx.restore();
}

function drawPlayer() {
    if (units <= 0) return;

    const p = playerPosition();

    const width = Math.min(
        130,
        60 + Math.sqrt(units) * 4.5
    );

    const height = Math.min(
        105,
        66 + Math.sqrt(units) * 2.3
    );

    ctx.save();

    if (player.invulnerable > 0 && Math.sin(elapsed * 50) > 0) {
        ctx.globalAlpha = 0.68;
    }

    if (gainFlash > 0) {
        const glow = ctx.createRadialGradient(
            p.x, p.y - 25, 10,
            p.x, p.y - 25, 100
        );

        glow.addColorStop(0, "rgba(65,255,155,.4)");
        glow.addColorStop(1, "rgba(65,255,155,0)");

        ctx.fillStyle = glow;
        ctx.fillRect(p.x - 100, p.y - 125, 200, 200);
    }

    drawVehicle(p.x, p.y, width, height);

    const visible = Math.min(units, 100);

    const columns = Math.min(
        10,
        Math.max(3, Math.ceil(Math.sqrt(visible * 1.25)))
    );

    const rows = Math.ceil(visible / columns);

    const soldierScale = Math.min(
        0.9,
        (width - 10) / (columns * 21)
    );

    const gapX = (width - 18) / Math.max(1, columns - 1);
    const gapY = Math.min(14, (height - 15) / Math.max(1, rows));

    for (let i = 0; i < visible; i++) {
        const row = Math.floor(i / columns);
        const col = i % columns;

        const rowCount = Math.min(
            columns,
            visible - row * columns
        );

        const sx = p.x +
            (col - (rowCount - 1) / 2) * gapX;

        const sy = p.y - height + 22 +
            row * gapY +
            recoil * 3;

        drawSoldier(
            sx,
            sy,
            soldierScale,
            true,
            0,
            false,
            false
        );
    }

    const badgeY = p.y + 27;

    ctx.fillStyle = "#102c46";

    roundedRect(p.x - 31, badgeY - 13, 62, 26, 13);
    ctx.fill();

    ctx.strokeStyle = "#63d5ff";
    ctx.lineWidth = 2;
    ctx.stroke();

    text(String(units), p.x, badgeY, 19, "#ffffff", false);

    ctx.restore();
}

   적군 그래픽
========================================================= */

function drawHealthBar(x, y, width, height, ratio, color) {
    ctx.fillStyle = "rgba(0,0,0,.7)";

    roundedRect(x - width / 2, y, width, height, height / 2);
    ctx.fill();

    const inner = Math.max(0, (width - 2) * clamp(ratio, 0, 1));

    if (inner > 0) {
        ctx.fillStyle = color;

        roundedRect(
            x - width / 2 + 1,
            y + 1,
            inner,
            height - 2,
            Math.min(3, inner / 2)
        );

        ctx.fill();
    }
}

function drawEnemy(e) {
    if (e.z < 0) return;

    const p = project(e.x, e.z);
    const s = p.s * (e.heavy ? 1.35 : 1);

    drawSoldier(
        p.x,
        p.y,
        s,
        false,
        e.phase,
        e.heavy,
        e.hit > 0
    );

    const barWidth = 28 * s;

    drawHealthBar(
        p.x,
        p.y - 48 * s,
        barWidth,
        Math.max(3, 5 * s),
        e.hp / e.maxHp,
        "#ff5757"
    );

    if (e.heavy) {
        text(
            Math.max(0, Math.ceil(e.hp)),
            p.x,
            p.y - 56 * s,
            Math.max(8, 11 * s),
            "#ffffff"
        );
    }
}

   게이트 그래픽
========================================================= */

function drawGate(g) {
    if (g.z < 0) return;

    const p = project(0, g.z);
    const s = p.s;

    const half = p.halfWidth * 0.96;
    const height = 108 * s;

    const leftX = W / 2 - half;
    const centerX = W / 2;
    const rightX = W / 2 + half;

    const alpha = g.collected ? 0.35 : 1;

    ctx.save();
    ctx.globalAlpha = alpha;

    function drawSide(x1, x2, effect) {
        const good = isGood(effect.effect);

        const color = good ? "#1d9cff" : "#f44343";
        const light = good ? "#8be8ff" : "#ffb0a0";

        const gradient = ctx.createLinearGradient(
            0, p.y - height, 0, p.y
        );

        gradient.addColorStop(
            0,
            good
                ? "rgba(40,169,255,.75)"
                : "rgba(255,68,68,.75)"
        );

        gradient.addColorStop(
            1,
            good
                ? "rgba(40,169,255,.15)"
                : "rgba(255,68,68,.15)"
        );

        ctx.fillStyle = gradient;
        ctx.fillRect(x1, p.y - height, x2 - x1, height);

        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, 4 * s);
        ctx.strokeRect(x1, p.y - height, x2 - x1, height);

        ctx.fillStyle = color;
        ctx.fillRect(
            x1,
            p.y - height,
            x2 - x1,
            12 * s
        );

        ctx.fillStyle = light;
        ctx.fillRect(
            x1,
            p.y - height,
            x2 - x1,
            3 * s
        );

        ctx.fillStyle = good
            ? "rgba(80,210,255,.25)"
            : "rgba(255,70,70,.25)";

        ctx.fillRect(
            x1,
            p.y - 4 * s,
            x2 - x1,
            7 * s
        );

        for (let i = 1; i < 5; i++) {
            ctx.fillStyle = "rgba(255,255,255,.08)";
            ctx.fillRect(
                x1,
                p.y - height + height * i / 5,
                x2 - x1,
                Math.max(1, s)
            );
        }

        text(
            effectLabel(effect.effect, effect.value),
            (x1 + x2) / 2,
            p.y - height * 0.57,
            Math.min((x2 - x1) * 0.65, 47 * s),
            "#ffffff"
        );

        text(
            good ? "UPGRADE" : "DANGER",
            (x1 + x2) / 2,
            p.y - height * 0.24,
            Math.max(6, 12 * s),
            light,
            false
        );
    }

    drawSide(leftX, centerX, g.left);
    drawSide(centerX, rightX, g.right);

    [leftX, centerX, rightX].forEach(x => {
        ctx.fillStyle = "#344b5b";

        ctx.fillRect(
            x - 3 * s,
            p.y - height - 4 * s,
            6 * s,
            height + 8 * s
        );

        ctx.fillStyle = "#b1c9d4";

        ctx.fillRect(
            x - 2 * s,
            p.y - height,
            2 * s,
            height
        );
    });

    ctx.restore();
}

/* =========================================================
   총알 및 효과 그리기
========================================================= */

function drawBullets() {
    ctx.save();

    ctx.lineCap = "round";

    ctx.strokeStyle = "rgba(26,157,255,.3)";
    ctx.lineWidth = 5;
    ctx.beginPath();

    for (const b of bullets) {
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(
            b.x - b.vx * 0.018,
            b.y - b.vy * 0.018
        );
    }

    ctx.stroke();

    ctx.strokeStyle = "#4dcaff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    for (const b of bullets) {
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(
            b.x - b.vx * 0.013,
            b.y - b.vy * 0.013
        );
    }

    ctx.stroke();

    ctx.strokeStyle = "#e1faff";
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (const b of bullets) {
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(
            b.x - b.vx * 0.006,
            b.y - b.vy * 0.006
        );
    }

    ctx.stroke();

    for (const b of enemyBullets) {
        ellipse(
            b.x,
            b.y,
            b.radius + 4,
            b.radius + 4,
            "rgba(255,70,20,.2)"
        );

        ellipse(
            b.x,
            b.y,
            b.radius,
            b.radius,
            "#ff542f"
        );

        ellipse(
            b.x - 1,
            b.y - 1,
            b.radius * 0.5,
            b.radius * 0.5,
            "#fff2a4"
        );
    }

    ctx.restore();
}

function drawParticles() {
    ctx.save();

    for (const p of particles) {
        const ratio = p.life / p.maxLife;

        ctx.globalAlpha = clamp(ratio, 0, 1);

        if (p.smoke) {
            const size = p.size * (2 - ratio);

            ellipse(
                p.x,
                p.y,
                size,
                size * 0.85,
                p.color
            );
        } else {
            ctx.fillStyle = p.color;

            const size = p.size * Math.max(0.3, ratio);

            ctx.fillRect(
                p.x - size / 2,
                p.y - size / 2,
                size,
                size
            );
        }
    }

    ctx.restore();
}

function drawPopups() {
    ctx.save();

    for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life * 3);

        const scale = p.life > 0.9
            ? 1 + (p.life - 0.9) * 2
            : 1;

        text(
            p.message,
            p.x,
            p.y,
            p.size * scale,
            p.color
        );
    }

    ctx.restore();
}

/* =========================================================
   전체 화면 렌더링
========================================================= */

function render() {
    ctx.setTransform(
        screenScaleX, 0,
        0, screenScaleY,
        0, 0
    );

    ctx.fillStyle = "#294c24";
    ctx.fillRect(0, 0, W, H);

    ctx.save();

    if (shake > 0) {
        ctx.translate(
            rand(-shake, shake) * 0.55,
            rand(-shake, shake) * 0.55
        );
    }

    drawBackground();

    const objects = [];

    enemies.forEach(e => {
        objects.push({ z: e.z, type: "enemy", data: e });
    });

    crates.forEach(c => {
        objects.push({ z: c.z, type: "crate", data: c });
    });

    gates.forEach(g => {
        objects.push({ z: g.z, type: "gate", data: g });
    });

    if (boss) {
        objects.push({ z: boss.z, type: "boss" });
    }

    if (units > 0) {
        objects.push({ z: PLAYER_Z, type: "player" });
    }

    objects.sort((a, b) => a.z - b.z);

    for (const o of objects) {
        if (o.type === "enemy") drawEnemy(o.data);
        if (o.type === "crate") drawCrate(o.data);
        if (o.type === "gate") drawGate(o.data);
        if (o.type === "boss") drawBoss();
        if (o.type === "player") drawPlayer();
    }

    drawBullets();
    drawParticles();
    drawPopups();

    ctx.restore();

    if (damageFlash > 0) {
        const vignette = ctx.createRadialGradient(
            W / 2, H / 2, 100,
            W / 2, H / 2, 440
        );

        vignette.addColorStop(0, "rgba(255,0,0,0)");
        vignette.addColorStop(
            1,
            `rgba(255,30,20,${damageFlash * 1.6})`
        );

        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
    }

    if (gainFlash > 0) {
        ctx.fillStyle =
            `rgba(80,255,150,${gainFlash * 0.12})`;

        ctx.fillRect(0, 0, W, H);
    }

    const bottomShade = ctx.createLinearGradient(
        0, H - 80, 0, H
    );

    bottomShade.addColorStop(0, "rgba(0,0,0,0)");
    bottomShade.addColorStop(1, "rgba(0,0,0,.3)");

    ctx.fillStyle = bottomShade;
    ctx.fillRect(0, H - 80, W, 80);
}

/* =========================================================
   메인 화면 미리보기
========================================================= */

function setupMenuPreview() {
    resetGame();

    mode = "menu";

    gates = [{
        z: 0.43,
        left: { effect: "multiply", value: 2 },
        right: { effect: "subtract", value: 5 },
        collected: false
    }];

    crates = [{
        x: -0.52,
        z: 0.64,
        effect: "add",
        value: 10,
        collected: false
    }];

    for (let i = 0; i < 14; i++) {
        enemies.push({
            x: (i % 5 - 2) * 0.29,
            z: 0.18 + Math.floor(i / 5) * 0.07,
            hp: 20,
            maxHp: 20,
            heavy: i % 5 === 0,
            hit: 0,
            phase: i
        });
    }
}

/* =========================================================
   60FPS 목표 메인 루프
========================================================= */

function frame(timestamp) {
    if (!lastFrame) lastFrame = timestamp;

    const dt = Math.min(
        (timestamp - lastFrame) / 1000,
        0.033
    );

    lastFrame = timestamp;

    if (!document.hidden) {
        if (mode === "playing") {
            update(dt);
        } else if (mode === "menu") {
            roadOffset = (roadOffset + dt * 0.045) % 1.08;

            updateScenery(dt, 0.045);

            enemies.forEach(e => {
                e.phase += dt * 5;
            });
        } else if (mode === "over") {
            updateParticles(dt);
            shake = Math.max(0, shake - dt * 30);
        }

        render();
    }

    requestAnimationFrame(frame);
}

document.addEventListener("visibilitychange", () => {
    lastFrame = 0;

    if (document.hidden) {
        dragging = false;
        pointerId = null;
    }
});

setupMenuPreview();
requestAnimationFrame(frame);

</script>
